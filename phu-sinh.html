<style>
/* Phù Sinh — giấy dó, mực chàm, dấu son */
:root{--bg:#e9e3d2;--bg2:#ddd5c0;--paper:#f6f1e3;--paper2:#ece5d2;--ink:#232830;--ink2:#4c545e;--ink3:#8b8f90;--line:#cdc4ab;
  --acc:#27466b;--acc2:#3f6c93;--seal:#b3372c;--jade:#3c7a65;--gold:#a67a27;--vio:#6a4b86;--water:#7fa3b8;
  --sh:0 2px 10px rgba(30,34,40,.16);--fs:15px;--nav:58px;--font:"Noto Serif","Source Serif 4","Source Serif Pro",Cambria,Georgia,"Times New Roman",serif}
:root[data-theme=dark]{--bg:#10141a;--bg2:#0c1015;--paper:#1a2029;--paper2:#232b36;--ink:#e7e1d0;--ink2:#b5ae9d;--ink3:#767c84;--line:#36404d;
  --acc:#8db3da;--acc2:#6f97c0;--seal:#d85c4d;--jade:#6db69b;--gold:#d2a853;--vio:#a688c8;--water:#33566c;--sh:0 2px 10px rgba(0,0,0,.5)}
:root[data-font=l]{--fs:17px}:root[data-font=xl]{--fs:19px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg2);color:var(--ink);font:var(--fs)/1.5 var(--font);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:disabled{cursor:default;opacity:.42}
[hidden]{display:none!important}
#app{position:fixed;inset:0;margin:0 auto;max-width:600px;background:var(--bg);overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.25)}
#mapcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
:root[data-view=screen] #mapcv,:root[data-view=combat] #mapcv{visibility:hidden}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}.ic.sm{width:.9em;height:.9em;opacity:.6}
.bad{color:var(--seal)}.good{color:var(--jade)}.grow{flex:1}.hint{color:var(--ink3);font-size:.86em;margin:.5em 0}.empty{color:var(--ink3);font-style:italic;padding:1.2em .4em}
/* khung giấy có móc góc */
.frame,.hud,.dock,.scard,.win,.mbox,.stat-pop{background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh);position:relative;border-radius:3px}
.hud::before,.scard::before,.win::before,.mbox::before,.dock.card::before{content:"";position:absolute;inset:3px;pointer-events:none;border-radius:2px;
  background:linear-gradient(var(--acc),var(--acc)) 0 0/12px 1.5px,linear-gradient(var(--acc),var(--acc)) 0 0/1.5px 12px,linear-gradient(var(--acc),var(--acc)) 100% 0/12px 1.5px,linear-gradient(var(--acc),var(--acc)) 100% 0/1.5px 12px,
  linear-gradient(var(--acc),var(--acc)) 0 100%/12px 1.5px,linear-gradient(var(--acc),var(--acc)) 0 100%/1.5px 12px,linear-gradient(var(--acc),var(--acc)) 100% 100%/12px 1.5px,linear-gradient(var(--acc),var(--acc)) 100% 100%/1.5px 12px;background-repeat:no-repeat;opacity:.7}

.btn.pri{background:var(--acc);color:#f6f1e3;border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc),inset 0 0 0 3px rgba(246,241,227,.45);letter-spacing:.06em;font-weight:600}
:root[data-theme=dark] .btn.pri{color:#10141a}
.btn.big{min-height:52px;font-size:1.25em;padding:.3em 2em;letter-spacing:.3em}.btn.sm{min-height:32px;padding:.15em .6em;font-size:.86em}.btn.wide{flex:1}.btn.on{background:var(--acc);color:var(--paper);border-color:var(--acc)}
.btn:not(:disabled):active{transform:translateY(1px)}.lnk{color:var(--ink2);text-decoration:underline dotted;text-underline-offset:4px;padding:.5em;font-style:italic}
.xb{width:36px;height:36px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;flex:none;background:var(--paper)}

.hud-id{flex:1;min-width:0;line-height:1.25}.hud-id .nm{display:block;font-size:1.12em}.hud-id .rl{display:block;color:var(--acc);font-weight:700;font-size:.95em}.hud-id small{color:var(--ink3);font-size:.8em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-tg{color:var(--ink3)}

.hline{font-size:.9em;margin:5px 0;display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.stone{display:inline-flex;align-items:center;gap:.3em;font-weight:700;color:var(--jade);font-variant-numeric:tabular-nums}.stone i{width:.62em;height:.62em;background:var(--jade);transform:rotate(45deg);border-radius:1px;display:inline-block;box-shadow:inset -1px -1px 0 rgba(0,0,0,.25)}
.hbtns{display:flex;gap:6px;margin-top:6px}.hbtns button{flex:1;min-height:34px;border:1px solid var(--line);background:var(--paper);font-size:.88em;border-radius:2px}.hbtns button:not(:disabled){border-color:var(--ink2)}.hbtns button.hl{background:var(--seal);color:#fbf7ea;border-color:var(--seal)}

#mapui{position:absolute;inset:0;z-index:4;pointer-events:none}#mapui>*{pointer-events:auto}

.mleft{position:absolute;left:8px;top:calc(var(--hudh,84px) + 14px)}.mright{position:absolute;right:8px;top:calc(var(--hudh,84px) + 14px);display:flex;flex-direction:column;gap:6px}
.mtime{position:absolute;right:8px;bottom:calc(var(--nav) + 76px);display:flex;gap:4px}.mtime .mb{width:36px;height:36px}

.stat-pop{position:absolute;left:8px;right:8px;top:calc(var(--hudh,84px) + 14px);padding:8px 12px;z-index:2;max-height:50%;overflow:auto}.stat-pop header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sl{padding:5px 0;border-top:1px dotted var(--line)}.sl b{display:block}.sl small{color:var(--ink3)}.sl.bad b{color:var(--seal)}.sl.good b{color:var(--jade)}

.dock.card{width:100%;padding:10px 14px}.nc-h b{font-size:1.1em;margin-right:.5em}.nc-h small{color:var(--ink3)}
.nc-g{font-size:.9em;display:flex;align-items:center;gap:.4em;margin:2px 0}.nc-g i{width:.6em;height:.6em;background:var(--jade);display:inline-block}.dg1 i{background:var(--gold)}.dg2 i{background:var(--seal)}.dg3 i{background:var(--vio)}.dg1{color:var(--gold)}.dg2{color:var(--seal)}.dg3{color:var(--vio)}
.nc-d{font-size:.88em;color:var(--ink2)}.nc-n{font-size:.88em;color:var(--gold);font-style:italic;margin-top:2px}.nc-b{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line);background:var(--paper);border-radius:3px;font-size:.72em;position:relative;min-width:0;white-space:nowrap;color:var(--ink2)}.nv .ic{width:20px;height:20px;color:var(--acc)}.nv.on{background:var(--acc);color:var(--paper);border-color:var(--acc)}.nv.on .ic{color:var(--paper)}

.sc-h{padding:10px 16px 6px;display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}.sc-h h2{font-size:1.18em}.sc-h small{color:var(--ink3)}
.sc-b{padding:0 16px 10px;overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}.sc-f{display:flex;gap:8px;align-items:center;padding:8px 14px 12px;border-top:1px solid var(--line)}
.art{display:block;width:100%;background:var(--paper2)}.art.strip{height:76px;flex:none;border-bottom:1px solid var(--line)}
.story p{margin:.45em 0;text-align:justify;hyphens:auto}.story p.old{color:var(--ink3)}.story p.q{font-style:italic;padding-left:.8em;border-left:2px solid var(--line)}
:root[data-anim="1"] .story p.new,:root[data-anim="1"] .scard,:root[data-anim="1"] .win,:root[data-anim="1"] .mbox,:root[data-anim="1"] .dock{animation:rise .22s ease-out both}

.news{font-style:italic;color:var(--ink2);border-top:1px dotted var(--line);padding-top:.4em;margin-top:.4em;font-size:.92em}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:.5em 0}.chip{font-size:.84em;padding:.1em .55em;border:1px solid var(--line);background:var(--paper2);border-radius:2px}.chip.up{color:var(--jade);border-color:var(--jade)}.chip.dn{color:var(--seal);border-color:var(--seal)}.chip.item{color:var(--gold);border-color:var(--gold)}
.choices{display:flex;flex-direction:column;gap:6px;margin:.5em 0}
.ch{display:flex;align-items:center;gap:.6em;text-align:left;min-height:40px;padding:.35em .7em;border:1px solid var(--ink3);background:var(--paper);border-radius:2px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--line)}
.ch .cn{font-weight:700;color:var(--acc);min-width:1.3em}.ch .ct{flex:1}.cx{font-size:.8em;color:var(--ink3);white-space:nowrap;font-style:italic}.cx.no{color:var(--seal)}.cx.chk{color:var(--acc)}.cx.tm::before{content:"⏳ ";font-style:normal;opacity:.6}
.ch.hl{border-color:var(--seal);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 3px var(--seal)}.ch.soft{border-style:dashed;color:var(--ink2);box-shadow:none}.ch.info{border-color:var(--seal);background:var(--paper2);box-shadow:none}
.ch:not(:disabled):not(.info):active{background:var(--paper2)}
.grp{font-size:.8em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:.9em 0 .2em;font-weight:400}.grp.now{color:var(--seal)}
.sgrp{font-size:.95em;color:var(--acc);margin:.8em 0 .25em;display:flex;align-items:center;gap:.5em}.sgrp::after{content:"";flex:1;height:1px;background:var(--line)}.sgrp small{color:var(--ink3);font-weight:400}
.foe-l{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}.foe-i{font-size:1.9em;width:1.6em;height:1.6em;display:grid;place-items:center;border:1px solid var(--seal);border-radius:50%;background:var(--paper2)}.foe-l small{display:block;color:var(--ink3)}.foe-l.big .foe-i{font-size:2.4em}
.rows{display:flex;flex-direction:column;gap:5px;margin:.4em 0}
.row{display:flex;align-items:center;gap:.7em;text-align:left;padding:.4em .6em;border:1px solid var(--line);background:var(--paper);border-radius:2px;min-height:44px;width:100%}
.r-i{width:1.9em;text-align:center;flex:none;font-size:1.1em;color:var(--acc)}.r-i.big{font-size:1.7em}.r-t{flex:1;min-width:0}.r-t b{display:block;font-weight:600}.r-t small{display:block;color:var(--ink3);font-size:.84em}.r-x{font-size:.84em;color:var(--ink2);white-space:nowrap;font-style:italic}.r-x.col{display:flex;flex-direction:column;gap:4px;font-style:normal}
.row.taken{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}.row.dim{opacity:.5}button.row:not(:disabled):active{background:var(--paper2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:.5em 0}

.shop-top{font-style:italic;color:var(--ink2);margin-bottom:.4em}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ink2);margin:.2em 0 .6em;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs.wrap{flex-wrap:wrap;border-bottom:0;gap:6px}

.el-kim{color:var(--gold)}.el-moc{color:var(--jade)}.el-thuy{color:var(--acc2)}.el-hoa{color:var(--seal)}.el-tho{color:#8a6a3c}.el-loi{color:var(--vio)}.el-bang{color:#5b9bb5}.el-phong{color:#6c9a7c}.el-am{color:#5a5670}.el-phat{color:#b88a2e}
/* lời mở đầu kiếp */

.in-b small{letter-spacing:.4em;color:var(--seal);font-weight:700}.in-b h1{font-size:2em;letter-spacing:.08em;margin:.1em 0}.in-o{font-size:1.1em}.in-t{font-style:italic;color:var(--ink2);margin-top:.6em}.tap{margin-top:1em}

.logl p{padding:.3em 0;border-bottom:1px dotted var(--line);font-size:.93em}.logl p span{color:var(--ink3);font-size:.82em;margin-right:.6em;font-style:italic}.lg-win{color:var(--jade)}.lg-en{color:var(--seal)}
.sets{display:flex;flex-direction:column}.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.5em 0;border-bottom:1px dotted var(--line);flex-wrap:wrap}.set>span{flex:1;min-width:8em}

.pips{color:var(--gold);letter-spacing:.15em;font-size:.8em;display:block}

.cb-foes,.cb-ally{display:flex;gap:6px}.ucard{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--seal);padding:6px 10px;border-radius:2px;position:relative}.ucard.ally{border-left-color:var(--jade)}.ucard.me{border-left-color:var(--acc)}

.u-bar{display:grid;grid-template-columns:4.4em 1fr auto;gap:6px;align-items:center;font-size:.8em;margin-top:3px}.u-bar span{color:var(--ink2)}.u-bar b{font-variant-numeric:tabular-nums;font-weight:600;min-width:4.5em;text-align:right}.u-s{color:var(--ink3)}
.sts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.si{font-weight:700;font-size:.72em;border:1px solid var(--ink3);padding:0 .3em;border-radius:2px}.si b{font-family:var(--font);margin-left:.2em}
.cb-art{position:relative;flex:1;min-height:110px;max-height:250px;border:1px solid var(--line);overflow:hidden}.cb-art .art{position:absolute;inset:0;height:100%}.cb-rd{position:absolute;left:6px;top:6px;font-size:.78em;background:var(--paper);border:1px solid var(--line);padding:0 .5em}

.cb-cmd{min-height:112px}.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.cwait{text-align:center;padding:1.6em 0}.cb-bot{display:flex;gap:6px;justify-content:center;padding-top:2px}
.cb-end{text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px 20px}.cb-end b{font-size:1.4em;letter-spacing:.15em;color:var(--jade)}.cb-end.lose b,.cb-end.dead b{color:var(--seal)}
.ring{position:absolute;inset:-26px;border-radius:50%;border:3px solid var(--seal);animation-name:shrink;animation-timing-function:linear;pointer-events:none}@keyframes shrink{from{transform:scale(1);opacity:.4}to{transform:scale(.42);opacity:1}}

.qm{position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--seal);animation:qrun 1.2s linear both}@keyframes qrun{0%{left:0}50%{left:calc(100% - 4px)}100%{left:0}}

/* ===== đợt cải tổ: giấy dó vàng hơn, góc bo, icon có nền, bố cục phủ kín màn hình ===== */
:root{--bg:#ebdfc0;--bg2:#e0d1aa;--paper:#f7ecce;--paper2:#efe0ba;--line:#cdbb8f;--r:10px;--sh:0 4px 16px rgba(70,50,15,.2)}

#app{max-width:none;box-shadow:none;border:0!important}
.hud::before,.scard::before,.win::before,.mbox::before,.dock.card::before{display:none}
.hud,.dock,.scard,.win,.mbox,.stat-pop{border-radius:14px;border:1px solid var(--line);box-shadow:var(--sh),inset 0 0 0 3px var(--paper),inset 0 0 0 4px color-mix(in srgb,var(--line) 70%,transparent)}

.scard,.win{overflow:hidden}.art.strip{border-radius:13px 13px 0 0}

.chip,.el,.si,.ph{border-radius:6px}
.ch{border-radius:var(--r);border:1px solid var(--line);box-shadow:0 1px 0 rgba(60,40,10,.1);background:var(--paper)}.ch.hl{border-color:var(--seal);box-shadow:inset 4px 0 0 var(--seal)}.ch.now{border-left:1px solid var(--line);box-shadow:inset 4px 0 0 var(--ink)}.ch.soft{box-shadow:none}

.r-i{color:var(--acc)}.row{border-color:var(--line)}

.fx-vig{left:0!important;top:0!important;transform:none;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,20,10,.55) 100%);animation:fxvig .45s ease-out both}@keyframes fxvig{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* ===== giao diện mới: tối giản, sang trọng kiểu tạp chí thời trang ===== */
:root,:root[data-theme=light]{--bg:#e2d5b4;--bg2:#d8c9a4;--paper:#ece0c2;--paper2:#e3d5b2;--ink:#151413;--ink2:#4a4642;--ink3:#97918a;--line:rgba(60,42,15,.18);
  --acc:#151413;--seal:#9c2a22;--gold:#9a7b45;--jade:#3d6b58;--r:2px;--sh:0 18px 50px -24px rgba(21,20,19,.35);--ease:cubic-bezier(.22,1,.36,1);
  --font:"Be Vietnam Pro","Helvetica Neue",Arial,sans-serif;--disp:"Cormorant Garamond","Noto Serif",Georgia,serif}
:root[data-theme=dark]{--bg:#0f0e0d;--bg2:#0a0a09;--paper:#171615;--paper2:#1f1d1b;--ink:#efeae1;--ink2:#bdb6ab;--ink3:#79736b;--line:rgba(239,234,225,.12);
  --acc:#efeae1;--seal:#d0574b;--gold:#c9a86a;--sh:0 18px 50px -20px rgba(0,0,0,.7)}
body{font-weight:400;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
h1,h2,h3,.title h1,.in-b h1,.win-h h2,.sc-h h2,.birth h2,.f-n b,.hud-id .nm,.hud-date b{font-family:var(--disp);font-weight:600;letter-spacing:.02em}
.title h1{font-size:3.2em;letter-spacing:.32em;font-weight:500}
/* bỏ sọc giấy, bỏ viền kép, chỉ còn đường mảnh */
.sc-b,.win-b{background-image:none!important}
.hud,.dock,.scard,.win,.mbox,.stat-pop{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.xb,.mb,.nv,.row,.cell,.sk,.ucard,.chip,.slot,.lgc,.fate,.life,.seg button,.hbtns button,.wi svg,.clog,.el,.si,.ph,textarea,#noteIn,.cb-art,.art.mart,.foe-i,.ch,.tabs button,.eqc,.bc,.bgrid,.doll,.bdet,.art.strip{border-radius:var(--r)}
.row,.cell,.ch,.fate,.life,.sk,.ucard,.lgc,.nv,.hbtns button,.mb,.xb{border-color:var(--line);box-shadow:none;background:transparent}
.win-h,.sc-f,.win-f{border-color:var(--line)}
.win-h h2,.mbox h3{color:var(--ink);font-size:1.4em}.mbox h3{border:0;letter-spacing:.04em}
/* nút: chữ in hoa giãn, chuyển màu mượt */
.btn{border-radius:var(--r);border:1px solid var(--ink);background:transparent;box-shadow:none!important;text-transform:uppercase;letter-spacing:.16em;font-size:.78em;font-weight:500;min-height:42px;padding:.3em 1.4em;
  transition:background .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease),transform .2s var(--ease)}
.btn.pri,.btn.on{background:var(--ink);color:var(--paper)!important;border-color:var(--ink)}
.btn:not(:disabled):hover{background:var(--ink);color:var(--paper)}.btn.pri:not(:disabled):hover{background:var(--seal);border-color:var(--seal)}
.btn.big{font-size:.9em;letter-spacing:.42em;min-height:56px;padding:.3em 3em}.btn.sm{font-size:.7em;min-height:32px;padding:.1em .9em}
.ch,.row,.fate,.sk,.nv,.tabs button,.lgc,.cell{transition:background .4s var(--ease),border-color .4s var(--ease),color .4s var(--ease)}
.ch:not(:disabled):hover,button.row:not(:disabled):hover,.fate:hover,.sk:not(:disabled):hover{border-color:var(--ink);background:var(--paper2)}
.ch.hl{box-shadow:inset 2px 0 0 var(--seal)}.ch .cn{color:var(--seal);font-family:var(--disp);font-size:1.1em}
.lnk{font-style:normal;text-decoration:none;letter-spacing:.14em;text-transform:uppercase;font-size:.72em;border-bottom:1px solid currentColor;padding:.2em 0;margin:0 .6em}
/* thẻ tab: gạch chân mảnh thay vì viên thuốc */
.tabs{gap:18px;border-bottom:1px solid var(--line)}.tabs button,.tabs button.on{border:0;border-radius:0;background:none;padding:.5em 0;font-size:.78em;letter-spacing:.14em;text-transform:uppercase;box-shadow:inset 0 -1px 0 transparent;color:var(--ink3)}
.tabs button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--ink)}
/* thanh dưới */
#nav{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nv{border:0;font-size:.62em;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}.nv .ib{background:none!important;color:var(--ink2)!important}
.nv.on{background:none;color:var(--ink)}.nv.on .ib{color:var(--seal)!important}.nv.on::after{content:"";position:absolute;bottom:2px;left:35%;right:35%;height:1px;background:var(--ink)}
.ib{border-radius:50%}
.hb{height:3px;border:0;background:var(--line);border-radius:0}.hb i{border-radius:0;transition:width .8s var(--ease)}
.hud-date b{color:var(--seal);font-size:1.9em}
.grp{letter-spacing:.22em;font-size:.68em;font-weight:500;color:var(--ink3)}
.t-seal{border-radius:0;transform:none;box-shadow:none;width:40px;height:40px;font-family:var(--disp)}
.narr p{line-height:1.8}.narr p.k{font-family:var(--disp);font-size:1.25em;letter-spacing:.3em}
#modal{background:rgba(15,14,13,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#panel{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.toast,#tip{border-radius:var(--r);letter-spacing:.04em}
/* xuất hiện mượt */
:root[data-anim="1"] .story p.new,:root[data-anim="1"] .scard,:root[data-anim="1"] .win,:root[data-anim="1"] .dock{animation:lux .7s var(--ease) both}
:root[data-anim="1"] .mbox{animation:luxm .55s var(--ease) both}:root[data-anim="1"] #modal{animation:fadein .4s var(--ease) both}
@keyframes lux{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes luxm{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}}
/* chuyển cảnh vết mực loang: hai lớp mực, lớp sau đậm hơn, không phủ đen toàn bộ */
#ink{position:fixed;inset:0;z-index:100;pointer-events:none;display:none}
#ink.on{display:block;pointer-events:auto}
#ink svg{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;transform:translate(-50%,-50%)}
#ink .b{transform-box:fill-box;transform-origin:center;transform:scale(0);will-change:transform}
#ink .b1{fill:#6e6252;opacity:.45}#ink .b2{fill:#2a241d;opacity:.72}#ink .b3{fill:#120f0c;opacity:.88}
#ink .b4{fill:#0a0807;opacity:1}
#ink.cover .b1{animation:inkg 1.1s cubic-bezier(.4,0,.2,1) forwards}
#ink.cover .b2{animation:inkg 1s cubic-bezier(.45,0,.25,1) .25s forwards}
#ink.cover .b3{animation:inkg3 .95s cubic-bezier(.45,0,.3,1) .45s forwards}
#ink.cover .b4{animation:inkg4 .85s cubic-bezier(.5,0,.15,1) .75s forwards}
#ink.reveal .b1,#ink.reveal .b2{transform:scale(1)}#ink.reveal .b3{transform:scale(.95)}#ink.reveal .b4{transform:scale(2.6)}
#ink.reveal{animation:inkout .8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes inkg{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes inkg3{0%{transform:scale(0)}100%{transform:scale(.95)}}
@keyframes inkg4{0%{transform:scale(0)}100%{transform:scale(2.6)}}
@keyframes inkout{from{opacity:1}to{opacity:0}}
/* ===== thống nhất chữ: một phông chính, một phông tiêu đề; không in đậm nặng ===== */
:root{--xf:var(--font);font-synthesis:none}
*{font-synthesis:none}
b,strong,h1,h2,h3,h4,th,.kr b,.kv b,.hud-id .rl,.stone,.lc-n,.grp,.sgrp,.f-n b,.qt,.si,.ch .cn,.hrow,.hv,.cb-end b,.dodge-ov p,.fx-num b,.cine-txt b,.pt-fig b{font-family:var(--font);font-weight:500}
.kr b,.kv b,.hv,.hud-date b,.stone,.u-bar b{font-variant-numeric:tabular-nums}
.title h1,.in-b h1{font-family:var(--disp);font-weight:500}
.win-h h2,.sc-h h2,.birth h2,.hud-id .nm,.mbox h3{font-family:var(--disp);font-weight:600}
.hud-date b{font-family:var(--font);font-weight:400}
.dot,.at-on,.alv,.fx-heal i{font-family:var(--font)!important}
/* ===== chi tiết địa điểm ===== */
.place .sc-h{padding:14px 18px 4px;align-items:center}.place .sc-h h2{font-size:1.6em;flex:1}
.place .sc-b{padding:0 18px 12px}
.pl-tg{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--ink3)}
.pl-meta{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.pl-meta>span{font-size:.76em;padding:.2em .7em;border:1px solid var(--line);border-radius:999px;color:var(--ink2);display:inline-flex;align-items:center;gap:.4em}
.pl-meta .nc-g{margin:0}
.pl-kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px}
.pl-kv>div{padding:8px 0;line-height:1.35}.pl-kv>div+div{border-left:1px solid var(--line);padding-left:14px}
.pl-kv small{display:block;font-size:.68em;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}.pl-kv span{font-size:.92em}
.place .pl-desc .story p{color:var(--ink2);font-style:italic;font-size:.95em;line-height:1.7}
.place .grp{margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:.68em;letter-spacing:.24em;color:var(--ink2)}
.place .grp.now{color:var(--seal)}.place .grp.big{color:var(--gold)}
.place .grp i{font-size:1.25em;letter-spacing:.02em;text-decoration:none;color:var(--ink3);margin-left:auto}
.place .grp .ib{font-size:1.3em}
.place .ch{min-height:46px;padding:.45em .8em;gap:.7em}.place .ch .ct{font-weight:400}
.place .ch .cn{font-size:.8em;color:var(--ink3);min-width:1.4em}
.place .ch.now{border:1px solid color-mix(in srgb,var(--seal) 40%,transparent);background:color-mix(in srgb,var(--seal) 6%,transparent);font-weight:400}
.place .ch .ex{width:1.15em;height:1.15em;font-size:.7em}
.place .sgrp{font-size:.82em;color:var(--ink2);margin:12px 0 6px;font-weight:400}.place .sgrp::after{background:var(--line)}
.place .sgrp+.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.place .sgrp+.choices .ch{flex-wrap:wrap;align-content:center;min-height:54px}
.place .sgrp+.choices .ch .cx{width:100%;padding-left:2.1em;margin-top:-2px}
.place .sgrp+.choices .ch .cx+.cx{width:auto}
.place .sc-f .btn{flex:1}
.place .ch.now{border-left-width:1px!important;border-left-color:color-mix(in srgb,var(--seal) 40%,transparent)!important;box-shadow:none}
.place .sgrp+.choices .ch .ct{flex:1 1 calc(100% - 2.5em)}
.place .sgrp+.choices .ch .cx{width:auto!important;padding-left:0!important;margin:0 .6em 0 0;font-size:.74em}
.place .sgrp+.choices .ch .cn+.ct~.cx:first-of-type,.place .sgrp+.choices .ch .ct+.cx{margin-left:2.1em}
/* ===== thẻ địa điểm dưới bản đồ ===== */
.dock.card.nc{padding:14px 16px 14px;font-size:.95em}
.nc-top{align-items:flex-start;gap:4px}
.nc-tt b{font-family:var(--disp);font-weight:600;font-size:1.55em;line-height:1.1;margin-top:2px}
.nc-eb{display:block;font-size:.66em!important;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc .icb{width:32px;height:32px;border:0;background:transparent;color:var(--ink3)}.nc .icb:hover{color:var(--ink)}
.nc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

// ================= LÕI TRÒ CHƠI =================
function hashS(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RS=null; // khi khác null: mọi phép ngẫu nhiên dùng bộ sinh có hạt giống (mulberry32)
const R = ()=>RS?RS():Math.random();
function seeded(seed,fn){const o=RS;RS=mul(hashS(seed));try{return fn();}finally{RS=o;}}
const ri = (a,b)=>a+Math.floor(R()*(b-a+1));
const pick = a=>a[Math.floor(R()*a.length)];
const chance = p=>R()<p;
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const rnd1 = x=>Math.round(x*10)/10;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wIdx(arr){let t=0;arr.forEach(x=>t+=(x.w==null?1:x.w));let r=R()*t;for(let i=0;i<arr.length;i++){r-=(arr[i].w==null?1:arr[i].w);if(r<=0)return i;}return arr.length-1;}
function wpick(arr,wf){let t=0;arr.forEach(x=>t+=wf(x));let r=R()*t;for(const x of arr){r-=wf(x);if(r<=0)return x;}return arr[arr.length-1];}

// ---------------- CHỮ ----------------
const BAG = {};
function bagPick(key,arr){let b=BAG[key];if(!b||!b.length){b=BAG[key]=shuffle([...arr.keys()]);}const i=b.pop();return arr[i<arr.length?i:0];}
function gp(o,path){return path.split('.').reduce((x,k)=>x==null?undefined:x[k],o);}
function capS(s){return s.replace(/(^|[.!?…:]\s+|“|\n)([a-zà-ỹđ])/g,(m,a,b)=>a+b.toUpperCase());}
function T(s,v){
  if(Array.isArray(s)) s=s.length?bagPick('_t'+s[0].slice(0,24),s):'';
  if(s==null) return '';
  v=v||{};
  let out=String(s), g=0;
  while(g++<8 && /[\[{]/.test(out)){
    const b4=out;
    out=out.replace(/\[([^\[\]{}]*?\|[^\[\]{}]*?)\]/g,(_,a)=>pick(a.split('|')));
    out=out.replace(/\{(\$?)([\w.]+)\}/g,(m,d,k)=>{
      if(d){const x=gp(v,k);return x!=null?String(x):'';}
      const pool=P[k];return pool?bagPick(k,pool):m;
    });
    if(out===b4)break;
  }
  return capS(out.replace(/\s+([,.!?])/g,'$1').replace(/ {2,}/g,' ').trim());
}
const up1 = s=>s?s[0].toUpperCase()+s.slice(1):s;
const lc1 = s=>s?s[0].toLowerCase()+s.slice(1):s;

function genName(g,rare){const ho=chance(rare?0.45:0.16)?pick(NAME.ho2):pick(NAME.ho);return ho+' '+pick(g==='nu'?NAME.nu:NAME.nam);}
function tangName(){let a=pick(NAME.tang1),b=pick(NAME.tang2);while(b===a)b=pick(NAME.tang2);return a+' '+b;}
function daoName(){return pick(NAME.dao1)+' '+pick(NAME.dao2);}
function maName(){return pick(NAME.ma1)+' '+pick(NAME.ma2);}
function biName(){const r=R();if(r<0.55)return pick(NAME.bi1)+' '+pick(NAME.bi2);return pick(NAME.ho)+' '+pick(NAME.bi3);}
function placeName(type,w){
  if(type==='tong') return pick((w||G.meta.world).sects).n;
  let a=pick(PLACE.a),b=pick(PLACE.b),k=0;while((b===a||a.includes(b))&&k++<9)b=pick(PLACE.b);
  const s=pick(PLACE.sfx[type]||['Địa']);
  if(type==='tran'&&chance(.3)) return a+' '+s;
  return a+' '+b+' '+s;
}
function npc(kind){
  const pg=G.run?G.run.g:'nam';
  let g=kind==='nu'?'nu':kind==='nam'?'nam':chance(.5)?'nam':'nu';
  const o={g};

  else if(kind==='tang'){o.g='nam';o.ten=tangName();o.hn='vị tăng';o.xung='bần tăng';o.goi='thí chủ';o.look=lc1(T('{look_tang}'));}
  else if(kind==='dao'){o.g='nam';o.ten=daoName();o.hn='lão đạo';o.xung='bần đạo';o.goi='đạo hữu';o.look=lc1(T('{look_dao}'));}
  else if(kind==='ma'){o.g=g;o.ten=maName();o.hn=g==='nam'?'hắn':'mụ';o.xung='bản tọa';o.goi='tiểu bối';o.look=lc1(T('{look_ma}'));}
  else if(kind==='thuong'){o.g='nam';o.ten='chưởng quỹ '+pick(NAME.ho);o.hn='gã';o.xung='tiểu nhân';o.goi='khách quan';o.look=lc1(T('{look_thuong}'));}
  else if(kind==='hai'){o.ten=biName();o.hn=g==='nam'?'thằng bé':'con bé';o.xung='cháu';o.goi=pg==='nam'?'đại ca':'tỷ tỷ';o.look=lc1(T('{look_hai}'));}
  else if(kind==='pham'){o.ten=pick(NAME.ho)+' '+pick(NAME.bi3);o.g=/Nương|Tẩu|Bà|Muội/.test(o.ten)?'nu':'nam';o.hn=o.g==='nam'?'gã':'thị';o.xung='tiểu nhân';o.goi='tiên sư';o.look=lc1(T('{look_phamnhan}'));}
  else if(kind==='yeu'){o.ten=pick(DESC.vo.concat(DESC.am))+' '+pick(['Tộc trưởng','Đại tướng','Yêu sứ','Yêu vương']);o.hn='hắn';o.xung='bổn tọa';o.goi='người tu tiên';o.look='mắt vàng, tai nhọn, nanh dài quá môi';}
  else {o.ten=genName(g);o.hn=g==='nam'?'hắn':'nàng';o.xung=g==='nam'?'tại hạ':'tiểu nữ';o.goi=chance(.5)?'đạo hữu':(pg==='nam'?'huynh đài':'cô nương');o.look=lc1(T('{look_tre_'+g+'}'));}
  return o;
}

}
function genWorld0(){
  const used=new Set();
  const mk=(al,kind)=>{let p,k=0;do{p=pick(SECT_PRE[al]);}while(used.has(p)&&k++<20);used.add(p);return {n:p+' '+pick(SECT_SFX[kind]),al,kind};};

    const s=sects[i%sects.length];
    let g=s.kind==='phat'?'nam':(chance(.5)?'nam':'nu');

const CHG_SLOW=0.6; // tụ lực, thủ thế: đoạn từ mốc giữa tới mốc phát lực chạy chậm lại còn 60%
function vRun(sc,u){if(u.fixedV)return u.fixedV;return 20*clamp(u.tp/sc.tpTB,0.6,1.8);}
function vRec(sc,u){if(u.fixedV)return u.fixedV;return 26*clamp(u.hoi/sc.hoiTB,0.6,1.8)/(u.rec||1);}

  u.intent=it;

// gỡ id khỏi waitSet của mọi người đang tụ lực phe kia

// ---------- vòng lặp trận ----------
function combatStep(dt){
  const sc=G.run&&G.run.scene;if(!sc||sc.type!=='combat'||sc.over)return;
  if(sc.hold){
    if(sc.aiWait!=null){sc.aiWait-=dt;if(sc.aiWait<=0){sc.aiWait=null;const u=U_(sc,sc.cur);runAct(sc,()=>aiAct(sc,u));}}
    return;
  }
  sc.t+=dt;
  for(const u of sc.units){
    if(u.hp<=0||u.gone){u.phase='down';continue;}
    if(u.stunT>0){u.stunT=Math.max(0,u.stunT-dt);continue;}
    if(u.phase==='run')u.pos+=vRun(sc,u)*dt;
    else if(u.phase==='recover'){u.pos+=vRec(sc,u)*dt;if(u.pos>=100){u.pos=0;u.phase='run';onZero(sc,u);if(sc.over)return;}}
    else if(u.phase==='charge'||u.phase==='guard'){u.pos=Math.min(PHAT,u.pos+vRec(sc,u)*dt*CHG_SLOW);u.chargeT+=dt;if(u.phase==='guard'&&u.pos>=PHAT)endStance(sc,u,(u.ctrl==='player'?'Ngươi':u.name)+' không phải đỡ đòn nào, buông thế.');}
  }
  // người đang tụ lực: đủ điều kiện thì tung chiêu
  const ch=sc.units.find(u=>u.phase==='charge'&&u.hp>0&&u.pos>=PHAT);
  if(ch){sc.hold=true;sc.cur=ch.id;
    if(ch.ctrl==='player'&&!sc.kiep&&!(G.meta.opt&&G.meta.opt.autoQte)){sc.qte={uid:ch.id,id:(sc.qid=(sc.qid||0)+1)};sc.rev++;return;}
    runAct(sc,()=>fireCharge(sc,ch,1));return;}
  // ai chạm mốc 50
  const rd=sc.units.filter(u=>u.phase==='run'&&u.hp>0&&u.pos>=50);
  if(rd.length){
    rd.sort((a,b)=>(b.pos-a.pos)||(b.tp-a.tp)||((a.side==='A'?0:1)-(b.side==='A'?0:1))||(a.id-b.id));
    const u=rd[0];
    for(const x of rd.slice(1))x.pos=49.9;
    u.pos=50;u.phase='ready';u.burnedTurn=0;sc.cur=u.id;sc.hold=true;sc.rev++;
    if(u.kind==='kiep'){runAct(sc,()=>kiepStrike(sc,u));return;}
    if(u.ctrl==='player')return; // chờ người chơi chọn chiêu
    sc.aiWait=0.3;
  }
}
// tắt hold ở đúng một chỗ
function runAct(sc,fn){
  try{fn();}
  finally{
    if(sc.dodge||sc.qte||sc.critQ)return; // còn chờ thao tác
    sc.cur=null;sc.aiWait=null;checkEnd(sc);sc.hold=false;sc.rev++;
    syncMain(sc);
  }
}
function syncMain(sc){const me=mainUnit(sc),r=G.run;if(me&&r){r.hp=Math.max(0,Math.round(me.hp));r.mp=Math.round(me.mp);}}
function onZero(sc,u){
  if(u.immune)return;
  const isP=u.ctrl==='player';const fx=isP?S().fx:{};
  u.st.block=0;
  if(isP&&fx.blockTurn)u.st.block=Math.round(u.max*fx.blockTurn/100);
  let d=0;
  if(u.st.poison>0){if(isP&&fx.poisonImm)u.st.poison=0;else{d+=u.st.poison;u.st.poison=Math.floor(u.st.poison*0.75);}}
  if(u.st.burn>0){d+=u.st.burn;u.st.burn=Math.floor(u.st.burn*0.5);}
  if(d){u.hp-=d;clog(sc,`${u.name} trúng độc/thiêu: ${d}`,'dot');if(u.hp<=0){down(sc,u);checkEnd(sc);return;}}
  let reg=(fx.regenHp||0)+(u.st.regen>0?6:0);if(u.st.regen>0)u.st.regen--;
  if(reg)u.hp=Math.min(u.max,u.hp+Math.round(u.max*reg/100));
  if(u.maxMp)u.mp=Math.min(u.maxMp,u.mp+Math.round(u.maxMp*(0.05+(fx.regenMp||0)/100)));
  if(u.tl!=null)u.tl=Math.min(100,u.tl+TL_REGEN);
  if(u.st.vuln>0)u.st.vuln--;if(u.st.weak>0)u.st.weak--;
  if(u.esc)u.st.rage=(u.st.rage||0)+1;
  syncMain(sc);
}
function down(sc,u){
  if(u.immune)return;
  if(u.isMain&&!sc.spar&&U('hoi')&&!G.run.revived){G.run.revived=true;u.hp=Math.round(u.max*0.3);clog(sc,'🕯️ Hồi quang phản chiếu! Ngươi gượng đứng dậy.','me');return;}
  u.hp=0;u.phase='down';u.pending=null;u.waitSet=[];doneAct(sc,u);
  // gỡ khỏi mọi waitSet ngay khi gục
  for(const x of sc.units)x.waitSet=x.waitSet.filter(i=>i!==u.id);
  clog(sc,`${u.name} gục ngã.`,u.side==='A'?'en':'win');
}
function checkEnd(sc){
  if(sc.over)return;const me=mainUnit(sc);
  if(me.hp<=0){
    if(sc.spar){me.hp=1;sc.over='lose';clog(sc,'Ngươi gục xuống. Trận đấu kết thúc.','en');}
    else sc.over='dead';
    finishCombat(sc);return;}
  if(sc.kiep){const k=sc.kiep;if(k.done>=k.n){if(k.wave<k.waves){k.wave++;k.done=0;me.hp=Math.min(me.max,me.hp+Math.round(me.max*0.3));clog(sc,`Đợt lôi thứ ${k.wave} kéo tới. Ngươi kịp hồi lại một hơi.`,'en');}else{sc.over='win';clog(sc,'Mây kiếp tan. Ngươi vẫn đứng đó.','win');finishCombat(sc);}}return;}
  if(!alive(sc,'B').length){sc.over='win';finishCombat(sc);}
}
function finishCombat(sc){
  sc.done=true;sc.hold=true;sc.dodge=null;sc.qte=null;sc.critQ=null;syncMain(sc);
  const r=G.run;
  // đồng đội: ghi lại khí huyết
  for(const u of sc.units)if(u.ally!=null){const p=(r.party||[]).find(x=>x.id===u.ally);if(p)p.hp=Math.max(0,u.hp);}
  if(r.party)r.party=r.party.filter(p=>p.hp>0);
  if(sc.over==='win'&&!sc.kiep){r.kills+=sc.units.filter(u=>u.side==='B').length;G.meta.kills+=1;if(G.meta.kills>=100)ach('tram');
    clog(sc,`${sc.en.n} bại trận.`,'win');
    const fx=aggFx();if(fx.healAfter){const s=S();r.hp=Math.min(s.maxHp,r.hp+Math.round(s.maxHp*fx.healAfter/100));}
    if(sc.after&&sc.after.nemesis)ach('baothu');}
}

const HD=24, HM=720, HY=8640;

const SEASON={xuan:'xuân',ha:'hạ',thu:'thu',dong:'đông'};
function W(){return G.meta.world;}
function tYear(t){return 1000+Math.floor(t/HY);}
function tMonth(t){return Math.floor((t%HY)/HM);}
function tHour(t){return t%HD;}
function partOf(t){const h=tHour(t);return h>=5&&h<11?'sang':h>=11&&h<17?'chieu':h>=17&&h<21?'toi':'dem';}
function seasonOf(t){const m=tMonth(t)+1;return m<=3?'xuan':m<=6?'ha':m<=9?'thu':'dong';}

let TICK_OUT=null; // gom "chuyện xảy ra trong lúc đó"
function advanceTime(h){
  const w=W(),out=[];
  if(!(h>0))return out;
  const outer=TICK_OUT;TICK_OUT=out;
  try{
    if(h<=48){w.t+=h;worldStep(h);}
    else{
      const fine=Math.min(h,30*HD);
      for(let d=0;d<fine-1e-9;d+=HD){const s=Math.min(HD,fine-d);w.t+=s;worldStep(s);if(!G.run&&G.screen==='over')break;}
      let rest=h-fine;const m=Math.floor(rest/HM);
      if(m>0){worldCoarse(m);worldCoarseEnts();if(G.run)director();}
      rest-=m*HM;if(rest>0){w.t+=rest;worldStep(Math.min(rest,HD));}
    }
    while(tYear(w.t)>=w.bangY){w.bangY+=10;if(G.run)publishBang();}
    const r=G.run;
    if(r){
      r.age=r.birthAge+(w.t-r.bornT)/HY;
      if(r.age>=S().life&&!(r.scene&&r.scene.type==='combat')){die('toahoa');}
    }
    if(G.run&&typeof timeHooks==='function')timeHooks(h);
  }finally{TICK_OUT=outer;if(outer)outer.push(...out);}
  return out;
}

      const s=S();r.rgH=(r.rgH||0)+s.maxHp*0.005*h;r.rgM=(r.rgM||0)+s.maxMp*0.02*h;
      const a=Math.floor(r.rgH),b=Math.floor(r.rgM);r.rgH-=a;r.rgM-=b;
      r.hp=Math.min(s.maxHp,r.hp+a);r.mp=Math.min(s.maxMp,r.mp+b);
    }
  }

}

  const w=W();const r=G.run;

}

function lifeSummary(cause,info){
  const r=G.run;const age=Math.floor(r.age);
  const lines=r.bio.slice(0,6);
  let end='';
  if(cause==='combat')end=`Năm ${age} tuổi, ${r.ten} chết dưới tay ${info.n} ở ${r.place.n}.`;
  else if(cause==='toahoa')end=`Năm ${age} tuổi, thọ nguyên cạn kiệt, ${r.ten} tọa hóa ở ${r.place.n}.`;
  else if(cause==='tamma')end=`Năm ${age} tuổi, ${r.ten} tẩu hỏa nhập ma.`;
  else if(cause==='kiep')end=`Năm ${age} tuổi, ${r.ten} tan thành tro bụi dưới thiên kiếp ở ${r.place.n}.`;
  else if(cause==='quyan')end=`Năm ${age} tuổi, ${r.ten} gác kiếm quy ẩn ở ${r.place.n}, sống nốt phần đời còn lại như một phàm nhân.`;
  else if(cause==='phithang')end=`Năm ${age} tuổi, ${r.ten} vượt Cửu Trùng Lôi Kiếp, phá không phi thăng.`;
  lines.push(end+(cause==='combat'||cause==='toahoa'?' '+pick(['Một đời tu tiên, như bao người khác.','Không ai kịp nhớ tên.','Người đời nhắc tới vài năm, rồi quên.','Tiên lộ dài, chân người ngắn.']):''));
  return lines;
}
function calcPts(cause){
  const r=G.run;const o=[];
  o.push(['Cảnh giới',r.maxRealm*12+Math.floor(r.tv/25)]);
  o.push(['Vùng đất đã qua',r.region*6]);
  o.push(['Thủ lĩnh bị hạ',r.bossKills*8]);
  o.push(['Kẻ địch bị hạ',Math.floor(r.kills/3)]);
  o.push(['Kỳ ngộ đã trải',Math.floor(r.evDone/4)]);
  if(cause==='phithang')o.push(['Phi thăng',80]);
  if(cause==='quyan')o.push(['Quy ẩn an lành',4]);
  return o.filter(x=>x[1]>0);
}
function die(cause,info){
  const r=G.run;if(!r)return;
  const pts=calcPts(cause);const tot=pts.reduce((a,b)=>a+b[1],0)+1;
  const lines=lifeSummary(cause,info);
  const ep=T('{epitaph}');
  const life={_mr:r.maxRegion||0,k:r.kiep,ten:r.ten,g:r.g,tuoi:Math.floor(r.age),realm:qualName(r.maxRealm,(r.quality||[])[r.maxRealm]||0),cause,lines,ep,pts:tot,origin:r.origin};
  const M=G.meta;M.lives.unshift(life);if(M.lives.length>40)M.lives.pop();
  M.pts+=tot;M.total+=tot;
  M.last={grave:cause!=='phithang'?{ten:r.ten,tuoi:Math.floor(r.age),r:r.region}:null,killer:cause==='combat'&&info&&!info.boss&&info.k?{n:info.n,k:info.k,i:info.i,el:info.el,r:r.region}:(cause==='combat'&&info&&info.boss?{n:info.n,k:'boss',i:info.i,el:info.el,r:r.region}:null),ten:r.ten};
  ach('chet1');if(cause==='toahoa')ach('toahoa');if(cause==='quyan')ach('quyan');if(cause==='phithang'){ach('phithang');gainLore('chan_tuong');}
  if(M.nlife>=5)ach('kiep5');
  G.over={life,pts,cause,title:{combat:'Tử trận',kiep:'Hồn phi phách tán',toahoa:'Tọa hóa',tamma:'Tẩu hỏa nhập ma',quyan:'Quy ẩn',phithang:'Phi thăng'}[cause]};

function director(){

  // kẻ truy sát từ hạt giống oán đã chín
  for(const s of r.seeds){if(s.t==='oan'&&!s.ent&&W().t-(s.at||0)>=30*HD&&chance(.25)){const e=spawnEnt('truysat',k,{name:s.ten,data:{seed:1}});if(e){s.ent=e.id;}}}

  // quanh người chơi trống trải: cho một đoàn người đi ngang qua
  {const me=nodeById(r.at);if(!L.some(e=>{const p=entXY(e);return Math.hypot(p[0]-me.x,p[1]-me.y)<=senseR();})&&L.length<12&&chance(.12))spawnEnt(chance(.5)?'thuong':'khach',k,{near:r.at});}

function entsStep(h){
  const w=W(),r=G.run;if(!r)return;
  for(const e of entsHere(r.region).slice()){
    if(w.t>e.until){if(e.type==='truysat'&&e.data.nem&&w.nemesis)w.nemesis.ent=null;removeEnt(e);continue;}
    if(e.wait>0){e.wait=Math.max(0,e.wait-h);if(e.wait>0)continue;}
    if(e.to==null){entIdle(e);continue;}
    const L=edgeLen(e.at,e.to)||1;e.prog+=e.speed*h/L;
    while(e.to!=null&&e.prog>=1){e.prog-=1;e.at=e.to;e.route.shift();e.to=e.route.length?e.route[0]:null;if(e.to==null){e.prog=0;entArrive(e);break;}}
  }
}
function entIdle(e){

  if(e.type==='thuong'){const ts=townsOf(e.r).filter(x=>x.id!==e.at);if(ts.length)setRoute(e,pick(ts).id);}
  else if(e.type==='tuantra'){const nb=neighbors(e.data.home);setRoute(e,e.at===e.data.home?pick(nb):e.data.home);}
  else if(e.type==='thienkieu'){const di=W().ents.find(x=>x.r===e.r&&x.type==='di');setRoute(e,di&&di.at!==e.at?di.at:pick(regionOf(e.r).nodes).id);}
  else if(e.type==='truysat'&&r)setRoute(e,r.at);
  else if(e.type==='khach'){const ns=regionOf(e.r).nodes.filter(x=>x.id!==e.at&&x.type!=='ai');if(ns.length)setRoute(e,pick(ns).id);}
}
function entArrive(e){

    if(n.state==='ok'){n.state='ruin';n.stateUntil=w.t+6*HM;chron(`Thú triều tràn qua ${n.name}. Nhà cửa đổ nát, người sống sót bỏ đi.`);}

// gặp nhau: người chơi tới điểm có thực thể, hoặc đi ngược chiều trên cùng đoạn đường
function entMeetAt(id,from){
  const r=G.run;if(!r||r.scene)return false;
  for(const e of entsHere(r.region)){
    if(e.met===r.kiep+':'+Math.floor(W().t/HD))continue;
    const atNode=e.to==null&&e.at===id||e.to!=null&&e.prog<0.05&&e.at===id;
    const opp=from!=null&&e.at===id&&e.to===from;
    if(atNode||opp){
      // thương đội và khách qua đường: không phải lần nào đi ngang cũng dừng lại nói chuyện
      const soft=MEET_SOFT[e.type];
      if(soft){const day=Math.floor(W().t/HD);e.met=r.kiep+':'+day;const last=(r.meetT||{})[soft.g];
        if(last!=null&&W().t-last<soft.cd*HD||!chance(soft.p))continue;
        (r.meetT||(r.meetT={}))[soft.g]=W().t;}
      meetEnt(e);return true;}
  }

}

// ---------------- NỐI CÁC KIẾP ----------------
function rivalsCoarse(months){
  const w=W();for(const rv of w.rstate){if(!rv.alive)continue;const dy=months/12;rv.age=(rv.age||18)+dy;const wr=w.rivals[rv.i];
    let left=dy;while(left>0&&rv.realm<4){const step=Math.min(left,1);rv.prog+=step*wr.tal*[14,6,2.6,1.2,.5][rv.realm];left-=step;if(rv.prog>=100){rv.realm++;rv.prog=ri(0,15);}}
    if(rv.age>LIFE[rv.realm]*0.95||(rv.age>60&&rv.realm<1)){rv.alive=false;rv.died=tYear(w.t);}}
}
function newRival(i,from){
  const w=W();const s=w.sects[w.rivals[i].s];const g=s.kind==='phat'?'nam':(chance(.5)?'nam':'nu');
  const old=w.rivals[i];const ten=s.kind==='phat'?tangName():genName(g,true);
  const rel=from&&chance(.3)?(chance(.5)?'đệ tử của '+old.ten:'hậu duệ của '+old.ten):null;
  const tt={kiem:g==='nam'?'kiếm tử':'kiếm tiên tử',dan:g==='nam'?'đan tử':'đan tiên tử',phat:'phật tử',ma:g==='nam'?'ma tử':'yêu nữ',am:g==='nam'?'quỷ tử':'âm nữ',the:g==='nam'?'thiếu chủ':'đại tiểu thư',thu:g==='nam'?'thú vương tử':'linh thú tiên tử'}[s.kind]||(g==='nam'?'thánh tử':'thánh nữ');
  w.rivals[i]={ten,g,s:old.s,tt,el:pick(['kim','moc','thuy','hoa','tho','loi','bang','phong']),tinh:old.tinh,tal:rnd1(0.85+R()*0.55),rel};
  w.rstate[i]={i,realm:0,prog:ri(5,40),alive:true,age:ri(16,20)};
  if(rel)chron(`${ten}, ${rel}, bước vào hàng thiên kiêu.`);
}
function afterlife(r,cause,info){
  const w=W();
  // 2. mộ tại điểm đang đứng (chết trên đường: điểm vừa rời)
  let at=r.at;if(r.moving&&r.moving.seg<r.moving.path.length-1)at=r.moving.path[r.moving.seg];
  const n=nodeById(at);
  if(cause!=='phithang'&&n){const items=shuffle(r.relics.slice()).slice(0,2);n.grave={ten:r.ten,tuoi:Math.floor(r.age),realmName:qualName(r.realm,(r.quality||[])[r.realm]||0),t:w.t,items,r:n.r};
    const gs=[];for(const R0 of w.regions)for(const x of R0.nodes)if(x.grave)gs.push(x);gs.sort((a,b)=>a.grave.t-b.grave.t);while(gs.length>12){gs.shift().grave=null;}}
  // 3. sương mù thành ký ức (đã gọi fogToMemory)
  // 4. ân oán còn lại vào legacy
  for(const s of r.seeds)w.legacy.push({t:s.t,ten:s.ten,d:s.d,hn:s.hn,who:r.ten,r:s.r});
  while(w.legacy.length>20)w.legacy.shift();
  w.rstate=r.rivals.map(x=>({i:x.i,realm:x.realm,prog:x.prog,alive:x.alive,age:x.age||18,died:x.died}));
  // kẻ đã giết người chơi
  if(cause==='combat'&&info&&!info.boss&&info.k&&info.k!=='kiep'){const old=w.nemesis&&w.nemesis.n===info.n?w.nemesis.lv:0;w.nemesis={n:info.n,k:info.k,i:info.i,el:info.el,r:r.region,lv:old+1,kiep:r.kiep,who:r.ten};}
  // 5. năm tháng trôi qua
  const yrs=ri(3,30);G.lastGap=yrs;
  worldCoarse(yrs*12);rivalsCoarse(yrs*12);
  // 6. thế hệ
  for(let i=0;i<w.rstate.length;i++){if(!w.rstate[i].alive)newRival(i,true);}
  const keep=[];
  for(const L of w.legacy){
    if(L.done){continue;}
    if(L.t==='an'&&chance(.5)){const pool=[];for(const R0 of w.regions.slice(0,Math.max(1,(r.maxRegion||0)+1)))for(const x of R0.nodes)if(['tran','thanh','tong'].includes(x.type)&&!x.patron)pool.push(x);
      if(pool.length){const x=pick(pool);x.patron={ten:L.ten,who:L.who,d:L.d,role:x.type==='tong'?'trưởng lão':'chưởng quỹ'};continue;}}
    if(L.t==='oan'&&chance(.5)){L.feud=1;keep.push(L);continue;}
    if(L.t==='oan'&&!L.feud)continue;
    keep.push(L);
  }
  w.legacy=keep.slice(-20);
  if(w.chron.length>60)w.chron=w.chron.slice(-60);
}
