    'Ở góc chợ, một gã bán hàng rong đang thề sống thề chết rằng cái bát mẻ trên tay từng là bát cơm của tiên nhân.'],
 c:[
  {i:'🎲',l:'Mua đại một món',cost:{st:22},o:[
    {w:2,t:'Về nhìn kỹ, hóa ra là đồ thật!',e:{relic:0}},
    {w:2,t:'Là một viên đan không rõ tên, ngửi thấy thơm. Ngươi đánh liều cất đi.',e:{pill:1}},
    {w:2,t:'Đồ giả. Rõ ràng là đồ giả. Ngươi cười khổ, coi như học phí.'}]},
  {i:'🗣️',l:'Mặc cả',chk:['van',8],ok:{t:'Ngươi nói một hồi, gã bán hàng mặt tái mét, cuối cùng đưa ngươi một món gần như cho không.',e:{relic:0,st:-6}},no:{t:'Gã cười hề hề, không bớt một đồng. Ngươi bỏ đi.'}},
  {i:'🔎',l:'Vạch trần đồ giả',chk:['ngo',10],ok:{t:'Ngươi chỉ ra từng vết keo dán. Đám đông cười ồ, gã phải bồi thường cho mấy người bị lừa trước đó, lại dúi cho ngươi chút tiền để im miệng.',e:{st:15,karma:2}},no:{t:'Ngươi nói sai. Món đó là thật. Cả chợ cười ngươi.',e:{tamma:2}}}
 ]});

ev({id:'thu_con',n:'Thú non lạc mẹ',tg:['rung','nui','dong','hoang'],w:2,
 t:['Trong hốc cây, một con thú nhỏ lông trắng đang run rẩy, chân bị kẹp. Nó kêu ư ử khi thấy ngươi.',
    'Tiếng kêu non nớt dẫn ngươi tới một con hồ ly con, lông đỏ như lửa, mắt đen láy. Mẹ nó nằm chết cách đó không xa, trên mình cắm ba mũi tên.'],
 c:[
  {i:'🐾',l:'Cứu và nuôi nó',req:r=>!r.relics.find(x=>x.u==='linhthu'),t:'Ngươi gỡ bẫy, băng bó cho nó. Con thú nhỏ liếm tay ngươi rồi chui vào ngực áo, từ đó không chịu rời.',e:{relic:'linhthu',karma:4}},
  {i:'🗡️',l:'Lấy yêu đan',t:'Ngươi xuống tay dứt khoát. Yêu đan nhỏ như hạt đậu, vẫn còn ấm.',e:{tv:6,karma:-5,tamma:3}},
  {i:'🔙',l:'Đưa về hang',o:[
    {w:2,t:'Ngươi đặt nó trước cửa hang. Một con thú lớn hiện ra, nhìn ngươi rất lâu, rồi đẩy ra một viên ngọc sáng.',e:{relic:0,karma:4}},
    {w:1,t:'Thú mẹ tưởng ngươi bắt con nó, gầm lên lao tới!',fight:{k:'beast'},win:{t:'Ngươi đánh lui thú mẹ. Hai mẹ con chạy vào rừng sâu. Ngươi đứng đó, không biết nên vui hay buồn.',e:{tv:3}}}]}
 ]});

ev({id:'thac_ngo',n:'Ngộ đạo dưới thác',tg:['nui','song','rung'],w:2,
 t:['Thác nước trắng xóa đổ xuống từ trăm trượng. Ngươi ngồi xuống tảng đá bên dưới, tiếng nước gầm như sấm mà lòng lại tĩnh lạ thường.',
    '{$canh} Tiếng nước chảy có nhịp, như có ai đang gảy đàn. Ngươi bỗng nhớ tới một câu khẩu quyết chưa từng hiểu.'],
 c:[
  {i:'🧘',l:'Ngồi xuống ngộ đạo',chk:['ngo',9],ok:{t:'{tvgain} Khi mở mắt, trăng đã lên tới đỉnh. Ngươi ngồi đó nửa năm.',e:{dao:2,tv:14,tam:1,h:360}},no:{t:'Càng nghĩ càng rối. Tiếng nước như tiếng cười nhạo. Ngươi đứng dậy, đầu đau như búa bổ.',e:{tamma:4,tv:3,h:216}}},
  {i:'🏊',l:'Đứng dưới thác luyện thể',t:'Nước đập vào lưng như búa tạ. Ngươi nghiến răng chịu đựng ba ngày ba đêm, da thịt tím bầm rồi lại lành.',e:{hp:'-15%',hpP:5}},
  {i:'🚶',l:'Ngắm một lúc rồi đi',t:'Cảnh đẹp, nhưng đường còn dài.',e:{tamma:-3}}
 ]});

ev({id:'bia_co',n:'Bia đá cổ',tg:['phe','nui','hoang','thien'],w:2,
 t:['Một tấm bia đá cao ba trượng, chữ khắc như rồng bay phượng múa. Nhìn lâu, ngươi thấy chữ như đang chuyển động.',
    'Giữa đống đổ nát có tấm bia gãy. Nửa trên đã mất, nửa dưới còn mấy hàng chữ cổ, nét nào cũng sâu như kiếm khắc.'],
 c:[
  {i:'👁️',l:'Tham ngộ',chk:['ngo',11],ok:{t:'Chữ trên bia hóa thành kiếm, thành lửa, thành nước, rồi tụ lại trong đầu ngươi thành một môn pháp thuật.',e:{dao:2,skill:1,lore:'doan_thien'}},no:{t:'Chữ trên bia đâm vào thức hải như kim. Ngươi ôm đầu lùi lại, mũi chảy máu.',e:{hp:'-10%',tamma:3}}},
  {i:'📜',l:'Chép lại để bán',t:'Mất ba ngày mới chép xong. Ít ra cũng có thứ để bán cho đám thư sinh hiếu kỳ.',e:{st:18,h:36}},
  {i:'🔨',l:'Đập bia lấy linh thạch bên trong',t:'Bia vỡ. Trong lõi đá quả có linh thạch, nhưng ngươi có cảm giác vừa làm một chuyện không nên làm.',e:{st:35,karma:-4}}
 ]});

ev({id:'ao_tran',n:'Ảo trận',tg:['rung','phe','dong','nui','ma'],w:2,
 t:['Sương mù dâng lên. Khi tan đi, ngươi thấy mình đứng giữa sân nhà cũ ở {$que}. Có tiếng gọi vào ăn cơm.',
    'Bước thêm một bước, cảnh vật đổi khác. Ngươi đứng trên đài cao, bên dưới hàng vạn người quỳ lạy, gọi ngươi là Tiên Tôn.',
    'Đi mãi vẫn quay về gốc cây ấy. Lần thứ ba, ngươi khắc một dấu lên thân cây. Lần thứ tư, dấu khắc đã ở đó trước khi ngươi khắc.'],
 c:[
  {i:'🪷',l:'Giữ vững bản tâm',chk:['tam',10],ok:{t:'Ngươi nhắm mắt, niệm một câu tĩnh tâm. Ảo cảnh vỡ như gương. Trận nhãn hiện ra, bên trong còn sót linh thạch.',e:{st:20,tam:1,tv:5}},no:{t:'Ngươi chìm trong ảo cảnh mấy tháng trời. Khi tỉnh lại, người gầy rộc, tóc dài chấm vai.',e:{h:432,tamma:6}}},
  {i:'💥',l:'Dùng sức phá trận',cost:{mp:'40%'},t:'Ngươi tung toàn lực vào hư không. Ảo trận nứt toác, nhưng phản chấn khiến ngươi hộc máu.',e:{hp:'-15%',tv:4}},
  {i:'😌',l:'Ở lại thêm chút nữa',t:'Biết là giả, ngươi vẫn ngồi xuống ăn hết bát cơm. Rời đi, ngươi khóc như đứa trẻ. Lòng nhẹ đi nhiều.',e:{tamma:-10,h:72}}
 ]});

ev({id:'linh_tuyen',n:'Linh tuyền',tg:['nui','rung','dong','song'],w:2,
 t:['Giữa khe núi có một hồ nước nhỏ, mặt nước bốc hơi trắng, linh khí nồng đến mức đọng thành giọt.','{$canh} Ngươi tìm thấy một dòng suối nước ấm, đáy suối lấp lánh như rải ngọc vụn.'],
 c:[
  {i:'🛁',l:'Ngâm mình',t:'Nước thấm vào từng lỗ chân lông. Xương cốt kêu răng rắc, rồi nhẹ bẫng.',e:{dao:1,hp:'100%',hpP:4}},
  {i:'🫗',l:'Uống vài ngụm',t:'Nước ngọt lịm, đi tới đâu mát tới đó. Linh lực trong người như được rửa sạch.',e:{mp:'100%',mpP:5}},
  {i:'🏺',l:'Đóng vào bình',t:'Ngươi đổ đầy hai bình. Thứ nước này luyện đan rất tốt.',e:{pill:['hoixuan','tukhi']}}
 ]});

ev({id:'do_thach',n:'Đổ thạch',tg:['thanh','tran'],r:[0,1,2],w:2,v:()=>({a:npc('thuong')}),
 t:['Phường đổ thạch đông nghịt. Những khối đá thô xếp thành đống, mở ra có thể là linh ngọc, cũng có thể chỉ là đá.','“Một đao nghèo, một đao giàu!” {$a.ten} hét lớn, tay vỗ lên khối đá đen sì.'],
 c:[
  {i:'🪨',l:'Mua một khối nhỏ',cost:{st:15},o:[{w:3,t:'Đá. Chỉ là đá.'},{w:2,t:'Có một mạch linh thạch nhỏ, đủ hoàn vốn và lời chút ít.',e:{st:25}},{w:1,t:'Lớp vỏ vỡ, ánh xanh tràn ra. Cả phường lặng đi. Một khối linh tủy!',e:{st:60,van:1}}]},
  {i:'💰',l:'Chơi lớn',cost:{st:40},o:[{w:3,t:'Đá. Ngươi nghe tiếng ai đó cười khúc khích sau lưng.'},{w:2,t:'Một mạch linh thạch dày bằng ngón tay. Đám đông xuýt xoa.',e:{st:80}},{w:1,t:'Bên trong là một món pháp bảo bị phong ấn trong đá!',e:{relic:1}}]},
  {i:'👁️',l:'Dùng thần thức dò trước',chk:['ngo',12],ok:{t:'Ngươi chọn một khối xấu xí ở góc. Chủ sạp cười, bán rẻ. Mở ra, cả phường im bặt.',e:{st:50}},no:{t:'Thần thức vừa chạm vào đã bị cấm chế đánh bật. Bị phát hiện dò trộm, ngươi bị mời ra ngoài.',e:{tamma:2}}}
 ]});

ev({id:'hac_diem',n:'Quán trọ đen',tg:['tran','rung','song','hoang'],w:2,
 t:['Quán trọ ven đường đèn đóm lờ mờ. Bà chủ cười rất tươi, rót rượu rất đầy.','Trời tối, chỉ có một khách điếm giữa rừng. Tiểu nhị nhìn túi trữ vật của ngươi lâu hơn nhìn mặt ngươi.'],
 c:[
  {i:'🍶',l:'Uống rượu, nghỉ đêm',chk:['ngo',10],
    ok:{t:'Rượu có mùi lạ. Ngươi vờ uống, đợi nửa đêm cả bọn mò vào thì…',fight:{k:'sontac',n:'Chủ quán đen'},win:{t:'Hắc điếm bị dẹp. Dưới hầm có cả đống đồ của khách bị hại.',e:{st:30,karma:4,pill:1}}},
    no:{t:'Tỉnh dậy, ngươi nằm ngoài bãi tha ma, túi trữ vật nhẹ bẫng, đầu đau như búa bổ.',e:{st:'-30%',hp:'-10%'}}},
  {i:'🗡️',l:'Ra tay trước',fight:{k:'sontac',n:'Chủ quán đen'},win:{t:'Ngươi đoán không sai. Dưới hầm toàn xương người. Ngươi phóng hỏa đốt quán, mang theo số tiền chúng cướp được.',e:{st:28,karma:3}}},
  {i:'🌙',l:'Ngủ ngoài trời',t:'Ngươi gác kiếm ngủ dưới gốc cây. Nửa đêm nghe tiếng bước chân lảng vảng, rồi xa dần.',e:{hp:'15%'}}
 ]});

ev({id:'tra_lau',n:'Trà lâu',tg:['tran','thanh'],w:3,
 t:['Trà lâu chật kín người. Tiên sinh kể chuyện vỗ thước gỗ xuống bàn: “Hôm nay, ta kể chuyện Ngũ Tổ chém Yêu Hoàng!”','Ngồi góc trà lâu, ngươi nghe đủ chuyện thiên hạ. Người ta bàn về {$rv}, về {$sect}, về giá linh thạch lên xuống.'],
 c:[
  {i:'👂',l:'Ngồi nghe',t:'Kể tới chỗ máu Yêu Hoàng bắn lên cửa trời, cả trà lâu nín thở. Câu chuyện ấy ai cũng thuộc, mà vẫn nghe.',e:{lore:'ngu_to',rumor:2}},
  {i:'📢',l:'Lên kể chuyện kiếm tiền',chk:['ngo',8],ok:{t:'Ngươi kể chuyện mình đánh nhau với yêu thú, thêm thắt chút ít. Khách vỗ tay, quăng tiền lên bục.',e:{st:15}},no:{t:'Ngươi kể lộn đầu lộn đuôi, khách ném vỏ lạc lên bục. Ba tối được đúng ít tiền lẻ.',e:{st:3}}},
  {i:'🍵',l:'Uống trà rồi đi',t:'Trà ngon. Vậy là đủ.',e:{hp:'10%',tamma:-2}}
 ]});

ev({id:'cao_thi',n:'Cáo thị truy nã',tg:['tran','thanh'],w:2,v:()=>({a:npc('ma')}),
 t:['Trên tường thành dán cáo thị: truy nã {$a.ten}, kẻ đã giết cả nhà một vị huyện lệnh. Thưởng hậu.','Bảng cáo thị ở cổng trấn có tờ mới: {$a.ten}, ma tu, đang lẩn trốn quanh {$pl}. Bên dưới có hàng chữ đỏ: “Sống chết không cần.”'],
 c:[
  {i:'📜',l:'Bóc cáo thị',fight:{k:'matu',n:'{$a.ten}',m:1.15},win:{t:'Ngươi mang đầu {$a.ten} về phủ nha. Quan phủ thưởng linh thạch theo lệ, dân chúng đốt pháo mừng.',e:{st:45,karma:5,tv:4}}},
  {i:'🚶',l:'Không phải việc của ta',t:'Ngươi đi qua. Phía sau có người thở dài: “Lại một tu sĩ chẳng quan tâm.”'}
 ]});

ev({id:'xem_tuong',n:'Thầy bói',tg:['tran','thanh','song'],r:[0,1,2,3],w:2,v:()=>({a:npc('dao')}),
 t:['Một lão đạo ngồi dưới lá phướn ghi bốn chữ “Thiết khẩu trực đoán”. Thấy ngươi, lão nheo mắt: “{$a.goi}, mệnh có kiếp nạn đấy.”','Bàn bói dựng bên đường. Thầy bói là {$a.ten}, {$a.look}. Lão gọi giật ngươi lại: “Đứng đó. Ấn đường của ngươi có khí đen.”'],
 c:[
  {i:'🪙',l:'Trả tiền xem quẻ',cost:{st:10},o:[
    {w:2,t:'Lão gieo ba đồng xu, nhìn rất lâu rồi nói: “Đi phương nào cũng gặp quý nhân, chỉ cần đừng tham.” Lòng ngươi bỗng nhẹ nhõm.',e:{van:2}},
    {w:2,t:'Lão rùng mình, đẩy tiền lại: “Quẻ này ta không dám nói. Ngươi tự bảo trọng.”',e:{st:10,tamma:2}},
    {w:1,t:'Lão phán ngươi sống không quá ba mươi. Ngươi cười. Lão không cười.',e:{tam:1}}]},
  {i:'🙅',l:'Vạch mặt kẻ lừa đảo',chk:['ngo',9],ok:{t:'Ngươi chỉ ra ba chỗ sai trong lời lão. Lão đạo nhìn ngươi một lúc lâu, rồi cười ha hả, tặng ngươi một lá bùa.',e:{pill:'kimcang'}},no:{t:'Lão cười nhạt, nói đúng ba chuyện cũ của ngươi mà ngươi chưa từng kể với ai. Ngươi lạnh gáy.',e:{tamma:3}}}
 ]});

ev({id:'an_may',n:'Kẻ ăn mày lạ',tg:['tran','thanh','song'],w:2,v:()=>({a:npc('gia')}),
 t:['Một lão ăn mày {$a.look} chìa cái bát mẻ về phía ngươi. “{$a.goi}, cho xin miếng ăn.”','Ở góc phố, một kẻ ăn mày nằm ngáy pho pho, bên cạnh là bầu rượu rỗng. Thấy ngươi, {$a.hn} mở một mắt: “Có rượu không?”'],
 c:[
  {i:'🍚',l:'Cho tiền mua đồ ăn',cost:{st:8},o:[
    {w:2,t:'{$a.hn} ăn ngấu nghiến, xong chùi tay vào áo, móc từ trong ngực ra một cuốn sách nhàu nát: “Giấy lau tay, cho ngươi.” Ngươi lật vài trang, tay run lên.',e:{skill:1,karma:3}},
    {w:3,t:'{$a.hn} cảm tạ rối rít, chúc ngươi sống lâu. Chỉ vậy thôi. Nhưng ngươi thấy vui.',e:{karma:4,van:1}}]},
  {i:'🍶',l:'Mời rượu, ngồi nói chuyện',cost:{st:12},t:'Hai người uống tới khuya. {$a.hn} kể chuyện trên trời dưới đất, có mấy câu nghe như khẩu quyết. Sáng ra, {$a.hn} biến mất.',e:{tv:8,ngo:1}},
  {i:'🙅',l:'Lắc đầu đi qua',t:'{$a.hn} nhìn theo, khẽ thở dài: “Lại một kẻ không có duyên.”'}
 ]});

ev({id:'tre_ban_hoa',n:'Đứa trẻ bán hoa',tg:['tran','thanh'],w:2,v:()=>({a:npc('hai')}),
 t:['Một đứa trẻ {$a.look} đứng nép bên đường bán từng bó hoa dại. “Mua hoa đi {$a.goi}, mẹ cháu ốm nặng lắm…”','{$a.ten}, một đứa trẻ {$a.look}, quỳ trước tiệm thuốc, trán dập xuống đất đã rớm máu. Chủ tiệm đứng khoanh tay.'],
 c:[
  {i:'💎',l:'Cho linh thạch',cost:{st:12},t:'Ngươi đặt linh thạch vào tay đứa trẻ. {$a.hn} sững sờ, rồi òa khóc, rồi chạy biến đi. Ngươi không biết nó có mua được thuốc không.',e:{karma:6,an:['a','cho tiền mua thuốc']}},
  {i:'🌿',l:'Theo về xem bệnh',cost:{mp:'30%'},t:'Người bệnh bị âm khí xâm thể. Ngươi truyền linh lực đẩy âm khí ra ngoài. Người đỡ dần, cả nhà quỳ lạy ngươi.',e:{karma:8,tv:3,an:['a','chữa bệnh cho người nhà']}},
  {i:'🚶',l:'Thế gian khổ nhiều, giúp không xuể',t:'Ngươi bước đi. Tiếng rao non nớt đuổi theo mãi một đoạn đường.',e:{tamma:2}}
 ]});

ev({id:'kiem_khach',n:'Kiếm khách say',tg:['tran','thanh','song','nui'],w:2,v:()=>({a:npc('nam')}),
 t:['Trên lan can tửu lâu, một kiếm khách {$a.look} đang ngửa cổ tu rượu. Thấy kiếm khí trên người ngươi, hắn cười lớn: “Đấu một trận không?”','Giữa cầu đá có kẻ say nằm chắn ngang, kiếm đặt trên bụng. Hắn không nhúc nhích: “Muốn qua cầu, đỡ ta ba kiếm.”'],
 c:[
  {i:'⚔️',l:'Nhận lời',fight:{k:'kiemtu',n:'{$a.ten}',spar:1},win:{t:'Hắn tỉnh rượu hẳn, chắp tay: “Hay! Hay!” Rồi tặng ngươi nửa bầu rượu và một câu kiếm quyết.',e:{tv:6,atkP:3}},lose:{t:'Ba kiếm. Ngươi đỡ được hai. Hắn thu kiếm, vỗ vai ngươi: “Không tệ.”',e:{tv:4}}},
  {i:'🍶',l:'Uống cùng hắn',cost:{st:8},t:'Hai người uống từ trưa tới tối. Hắn kể về một người con gái đã chết, về thanh kiếm hắn chưa từng rút khỏi vỏ. Lúc chia tay, hắn cười rất buồn.',e:{tam:2,an:['a','uống rượu nghe chuyện']}},
  {i:'🚶',l:'Đi đường khác',t:'Kẻ say rượu, nói chuyện với hắn làm gì.'}
 ]});

ev({id:'hoa_duyen',n:'Tăng nhân hóa duyên',tg:['tran','thanh','song','nui'],w:2,v:()=>({a:npc('tang')}),
 t:['Một vị hòa thượng {$a.look} đứng trước mặt ngươi, chắp tay: “A di đà Phật. Thí chủ có thể bố thí cho bần tăng một bữa chay?”','Tiếng mõ lốc cốc. {$a.ten}, vị tăng khổ hạnh, đi chân đất qua cổng trấn. Đi tới đâu, chó dữ cũng im.'],
 c:[
  {i:'🙏',l:'Bố thí',cost:{st:6},t:'Vị tăng nhận, rồi đặt tay lên đỉnh đầu ngươi. Một luồng ấm áp lan xuống, những ý nghĩ đen tối trong lòng tan như sương.',e:{tamma:-12,karma:3}},
  {i:'💬',l:'Hỏi đạo',chk:['ngo',10],ok:{t:'“Thí chủ hỏi trường sinh để làm gì?” Ngươi á khẩu. Vị tăng cười, đọc cho ngươi một đoạn kinh. Về sau ngươi mới hiểu, đó là tâm pháp.',e:{tam:3,tv:5}},no:{t:'Hai bên nói chuyện như gà với vịt. Vị tăng chắp tay cáo từ.'}},
  {i:'⚔️',l:'Thử bản lĩnh vị tăng',fight:{k:'votang',n:'{$a.ten}',spar:1},win:{t:'Vị tăng thu tay, mỉm cười: “Thí chủ võ công cao, chỉ tiếc tâm còn nóng.”',e:{tv:6,karma:-2}},lose:{t:'“Thí chủ, nóng giận hại thân.” Vị tăng đỡ ngươi dậy, phủi bụi cho ngươi.',e:{tamma:-5,tv:3}}}
 ]});

ev({id:'ho_ly',n:'Thiếu nữ trong rừng',tg:['rung','tran','phe'],r:[0,1,2],w:2,v:()=>({a:npc('nu')}),
 t:['Giữa rừng sâu lại có một thiếu nữ ngồi khóc bên suối. Nàng {$a.look}, nói bị lạc đường, xin ngươi đưa về nhà.','Đêm mưa, có người gõ cửa miếu nơi ngươi trú. Một nữ tử ướt sũng, cười e lệ: “Cho tiểu nữ trú nhờ một đêm được không?”'],
 c:[
  {i:'🏮',l:'Đưa nàng về',chk:['ngo',10],ok:{t:'Đi một đoạn, ngươi để ý thấy chân nàng không chạm đất. Ngươi dừng lại. Nàng cũng dừng lại, cười: “Đạo hữu tinh mắt thật.” Rồi hóa thành hồ ly, để lại một món quà.',e:{relic:0,tv:4}},no:{t:'Nàng dẫn ngươi vào một tòa nhà lộng lẫy. Sáng ra ngươi tỉnh dậy giữa bãi tha ma, người mệt lả như bị rút hết sinh khí.',e:{hp:'-25%',tv:-6}}},
  {i:'👁️',l:'Vạch mặt yêu tinh',fight:{k:'holy',n:'Hồ yêu {$a.ten}'},win:{t:'Hồ yêu bỏ chạy, để lại cái đuôi gãy và một viên yêu đan nhỏ.',e:{tv:5,st:10}}},
  {i:'🙈',l:'Giả vờ không thấy',t:'Ngươi quay lưng đi. Sau lưng có tiếng cười khúc khích, như tiếng chuông gió.'}
 ]});

ev({id:'co_mo',n:'Cổ mộ',tg:['phe','nui','hoang','dong'],w:2,v:()=>({}),
 t:['Mưa lở núi, để lộ cửa một ngôi cổ mộ. Trên cửa đá khắc hình thú đầu người, mắt khảm hai viên hồng ngọc.','Dưới chân ngươi có tiếng rỗng. Đào xuống ba thước, lộ ra bậc đá dẫn sâu vào lòng đất, hơi lạnh phả lên tận mặt.'],
 c:[
  {i:'🔦',l:'Vào trong',t:'Hành lang dài hun hút. Đi được trăm bước, trước mặt có ba cánh cửa: một cửa vẽ rồng, một cửa vẽ hổ, một cửa không vẽ gì.',c:[
    {i:'🐉',l:'Cửa rồng',t:'Bên trong là kho báu, nhưng cũng là chỗ của thủ mộ khôi lỗi.',fight:{k:'khoiloi',m:1.1},win:{t:'Khôi lỗi đổ sập. Kho báu là của ngươi.',e:{relic:1,st:25}}},
    {i:'🐯',l:'Cửa hổ',chk:['tp',11],ok:{t:'Tên tẩm độc bắn ra từ bốn phía. Ngươi lăn qua làn mưa tên. Cuối phòng là một hộp gỗ, bên trong có bí tịch.',e:{skill:1}},no:{t:'Ba mũi tên găm vào vai. Ngươi lết ra, chỉ kịp vơ được ít linh thạch.',e:{hp:'-30%',st:15}}},
    {i:'⬜',l:'Cửa trơn',t:'Căn phòng trống, chỉ có một bộ xương ngồi xếp bằng. Trên vách khắc mấy dòng di ngôn: kẻ đến sau, chớ tham.',e:{tam:2,tv:8,lore:'thien_dao'}}]},
  {i:'🪨',l:'Lấp cửa mộ lại',t:'Người chết cần yên nghỉ. Ngươi lăn tảng đá chặn cửa, vái ba vái.',e:{karma:3,van:1}}
 ]});

ev({id:'dong_phu_cu',n:'Động phủ tiền bối',tg:['nui','dong','rung'],w:2,
 t:['Sau thác nước có một động phủ bị bỏ hoang. Cấm chế ở cửa đã yếu, chỉ còn lớp màng mờ như bong bóng.','Ngươi phát hiện một động phủ ẩn sau dây leo. Trên cửa treo tấm biển gỗ: “{$who} bế quan, kẻ tự tiện vào, chết.” Chữ đã mốc meo.'],
 c:[
  {i:'✋',l:'Phá cấm chế',chk:['ngo',10],ok:{t:'Cấm chế tan. Bàn ghế đá phủ bụi dày, trên bồ đoàn có một túi trữ vật.',e:{dao:2,relic:0,pill:1}},no:{t:'Cấm chế phản phệ, một đạo kiếm quang bắn ra sượt qua vai ngươi.',e:{hp:'-20%'}}},
  {i:'🙇',l:'Vái ba vái rồi mới vào',o:[{w:2,t:'Cấm chế tự tan như đáp lễ. Trên bàn đá có một ngọc giản, bên trong là truyền thừa của chủ nhân.',e:{skill:1,karma:2}},{w:1,t:'Không có chuyện gì xảy ra. Có lẽ chủ nhân đã đi quá lâu. Ngươi vào lấy vài thứ còn dùng được.',e:{st:20}}]},
  {i:'🚶',l:'Rời đi',t:'Động phủ của người khác, ngươi không đụng vào.'}
 ]});

ev({id:'bi_canh',src:'ent:di',n:'Bí cảnh mở cửa',tg:['*'],once:1,w:2,
 t:['Trên trời bỗng mở ra một khe nứt ngũ sắc. Tu sĩ khắp nơi đổ về: bí cảnh trăm năm mới mở một lần!','Mặt hồ phẳng lặng bỗng xoáy thành vòng tròn, ánh sáng từ đáy hồ chiếu lên. Lối vào bí cảnh đã mở.'],
 c:[
  {i:'🌀',l:'Xông vào',o:[
    {w:2,t:'Một con thủ hộ thú chặn ngay lối vào.',fight:{elite:1},win:{t:'Thủ hộ thú gục xuống. Phía sau là một bệ đá, trên đó có bảo vật đang phát sáng.',e:{relic:1}}},
    {w:2,t:'Bí cảnh là một vườn thuốc bỏ hoang. Ngươi hái mỏi tay.',e:{pill:['tinhnguyen','hoixuan','taytuy'],h:144}},
    {w:1,t:'Bí cảnh sụp đổ khi ngươi mới vào được nửa đường. Ngươi chạy thục mạng ra ngoài, chỉ kịp vơ lấy một thứ.',e:{relic:0,hp:'-20%'}}]},
  {i:'⏳',l:'Chờ ở cửa, cướp kẻ đi ra',chk:['tp',11],ok:{t:'Mấy kẻ lảo đảo đi ra, mình đầy thương tích. Ngươi ra tay nhanh gọn.',e:{st:40,karma:-6}},no:{t:'Kẻ đi ra đầu tiên lại là kẻ mạnh nhất.',fight:{k:'tantu',elite:1},win:{t:'Hắn gục. Túi trữ vật của hắn nặng trịch.',e:{st:30,karma:-3}}}},
  {i:'🚶',l:'Không tham gia',t:'Nơi nhiều người tranh, thường lắm kẻ chết. Ngươi đi tiếp.'}
 ]});

ev({id:'sao_roi',src:'ent:di',n:'Sao rơi',tg:['nui','hoang','rung','bien','thien'],w:1,
 t:['Đêm qua có sao băng rơi xuống phía tây, đất rung ba lần. Sáng nay khói vẫn còn bốc lên.','Một quả cầu lửa vạch ngang trời rồi đâm xuống thung lũng gần đó. Tiếng nổ làm chim chóc bay rợp trời.'],
 c:[
  {i:'🔥',l:'Tới xem',o:[
    {w:2,t:'Giữa hố sâu là một khối sắt đỏ rực, tỏa ra kiếm khí lạnh buốt.',e:{relic:'tinhthiet'}},
    {w:2,t:'Ngươi tới sau. Đã có kẻ đứng giữa hố.',fight:{k:'tantu'},win:{t:'Kẻ kia bỏ chạy. Khối sắt sao vẫn nằm đó, còn nóng hổi.',e:{relic:'tinhthiet'}}},
    {w:1,t:'Thứ rơi xuống không phải sắt. Nó đang cử động.',fight:{k:'tinhthu',m:1.15},win:{t:'Tinh thú tan thành bụi sao. Trong lòng bàn tay ngươi còn đọng lại mấy hạt sáng.',e:{tv:10,st:25}}}]},
  {i:'🙅',l:'Kệ nó',t:'Trời rơi xuống thứ gì, kệ trời.'}
 ]});

ev({id:'loi_moc',n:'Cây bị sét đánh',tg:['rung','nui'],w:1,
 t:['Cây tùng cổ thụ trên đỉnh đồi bị sét đánh toạc làm đôi, lõi cây đen bóng, vẫn còn tia điện nhảy lách tách.'],
 c:[
  {i:'🪓',l:'Lấy lõi gỗ',o:[{w:2,t:'Ngươi bị giật tê dại cả người, nhưng lấy được.',e:{hp:'-15%',relic:'loimoc'}},{w:1,t:'Lõi gỗ tan thành tro ngay khi chạm tay. Chỉ còn lại cảm giác tê rần ở đầu ngón.',e:{mpP:3}}]},
  {i:'🧘',l:'Ngồi dưới gốc cảm ngộ lôi ý',chk:['ngo',11],ok:{t:'Trong đầu ngươi vang lên tiếng sấm. Khi tĩnh lại, lòng bàn tay đã có thể tóe ra tia điện.',e:{tv:8,skill:'chuongloi'}},no:{t:'Tia điện còn sót lại chui vào kinh mạch. Ngươi giật nảy, tóc dựng đứng cả ngày.',e:{hp:'-10%'}}}
 ]});

ev({id:'bi_cuop',src:'road',n:'Cướp đường',tg:['rung','nui','hoang','song','tran'],w:2,v:()=>({a:npc('nam')}),
 t:['“Núi này ta mở, cây này ta trồng…” Một đám sơn tặc nhảy ra chặn đường, kẻ cầm đầu {$a.look}.','Dây thừng bật lên từ mặt đất, suýt quật ngã ngươi. Mấy gã đàn ông mặt mũi bặm trợn bước ra từ hai bên đường.'],
 c:[
  {i:'⚔️',l:'Đánh',fight:{k:'sontac',n:'{$a.ten}'},win:{t:'Bọn cướp chạy tán loạn, bỏ lại cả của cướp được.',e:{st:20,karma:2}}},
  {i:'💎',l:'Nộp tiền mãi lộ',cost:{st:12},t:'Bọn chúng cười hô hố, nhường đường. Ngươi nuốt cục tức xuống bụng.',e:{tamma:3}},
  {i:'😤',l:'Tỏa uy áp dọa chúng',chk:['tam',9],ok:{t:'Ngươi chỉ hừ một tiếng. Cả bọn quỳ rạp, dập đầu xin tha, còn dâng cả của cướp được.',e:{st:15}},no:{t:'Uy áp của ngươi như gió thoảng. Cả bọn cười rồ lên rồi xông vào.',fight:{k:'sontac',n:'{$a.ten}'},win:{t:'Lần sau chúng sẽ biết sợ.',e:{st:12}}}}
 ]});

ev({id:'lo_dan_no',n:'Lò đan nổ',tg:['tran','thanh','tong','nui'],w:2,v:()=>({a:npc('tre')}),
 t:['Một tiếng nổ lớn. Khói đen bốc lên từ căn nhà gỗ ven đường. {$a.ten} chạy ra, mặt đen thui, tóc dựng đứng: “Lò… lò của ta!”','Mùi khét lẹt bay khắp phố. Một đan sư trẻ ngồi bệt giữa đống đổ nát, ôm cái lò đan nứt đôi mà khóc.'],
 c:[
  {i:'🧯',l:'Giúp dập lửa',t:'Lửa tắt. {$a.ten} cảm kích, tặng ngươi mấy viên đan còn sót lại sau vụ nổ.',e:{pill:['hoixuan','tukhi'],karma:3,an:['a','giúp dập lửa lò đan']}},
  {i:'🔍',l:'Nhặt đan dược văng ra',chk:['tp',9],ok:{t:'Ngươi nhanh tay vơ được mấy viên lăn lóc ngoài đường.',e:{pill:[1,1],karma:-2}},no:{t:'Một viên đan cháy dở nổ ngay trong tay ngươi.',e:{hp:'-15%'}}},
  {i:'🗨️',l:'Chỉ ra chỗ sai trong phối dược',chk:['ngo',11],ok:{t:'{$a.ten} sững người, rồi vỗ đùi: “Đúng rồi! Phải cho Huyết Linh Chi vào sau Cửu Diệp Thảo!” Lần luyện sau thành công, {$a.hn} chia cho ngươi một nửa.',e:{pill:'taytuy',an:['a','chỉ cách luyện đan']}},no:{t:'{$a.hn} nhìn ngươi như nhìn kẻ ngốc.'}}
 ]});

ev({id:'hon_phien',n:'Hồn phiên vô chủ',tg:['phe','hoang','ma','dong'],once:1,w:1,
 t:['Giữa bãi chiến trường cũ cắm một lá cờ đen, gió không thổi mà vẫn bay phần phật. Trên mặt cờ thêu trăm khuôn mặt người, mặt nào cũng đang nhìn ngươi.','Ngươi nghe tiếng khóc ri rỉ. Lần theo, chỉ thấy một lá hồn phiên cắm trên mỏm đá, quanh đó cỏ không mọc nổi.'],
 c:[
  {i:'✊',l:'Nhổ lấy',t:'Cán cờ lạnh như băng. Tiếng khóc im bặt, như chờ chủ nhân mới ra lệnh.',e:{relic:'honphien',karma:-8,tamma:8}},
  {i:'🔥',l:'Thiêu hủy, siêu độ vong hồn',fight:{k:'amhon',m:1.1},win:{t:'Lá cờ cháy rụi. Trăm luồng khói trắng bay lên, khẽ cúi đầu với ngươi rồi tan vào trời.',e:{karma:10,tv:6,tam:2}}},
  {i:'🚶',l:'Tránh xa',t:'Thứ này không nên đụng vào.'}
 ]});

ev({id:'nhan_cu',n:'Chiếc nhẫn cũ',tg:['*'],r:[0,1],once:1,w:1,
 t:['Ở sạp đồ cũ có một chiếc nhẫn sắt đen sì, giá chỉ ba đồng. Lúc ngươi chạm vào, nó khẽ ấm lên.','Đêm ấy, chiếc nhẫn sắt nhặt được ở bờ sông bỗng phát sáng mờ mờ. Có giọng ai khàn khàn vang lên trong đầu: “Ngủ lâu quá…”'],
 c:[
  {i:'💍',l:'Giữ lấy',t:'Ngươi đeo nhẫn vào tay. Từ đó, những đêm tu luyện, ngươi luôn có cảm giác có người nhìn qua vai mình, thỉnh thoảng hừ một tiếng khi ngươi vận khí sai.',e:{relic:'nhancu',flag:'nhancu'}},
  {i:'🗑️',l:'Vứt đi',t:'Đồ cũ thì có gì tốt. Ngươi ném nó xuống sông. Mặt nước gợn lên một vòng, rồi thôi.'}
 ]});
ev({id:'nhan_tinh',n:'Hồn trong nhẫn',spec:1,once:1,cond:r=>r.flags.nhancu&&r.region>=1&&r.relics.some(x=>x.u==='nhancu'),
 t:['Chiếc nhẫn cũ nóng rực lên. Lần này giọng nói ấy rõ ràng: “{$p.tt}, ta là {$lao}, ba nghìn năm trước từng đứng đầu một phương. Giờ chỉ còn tàn hồn này. Ngươi giúp ta một việc, ta giúp ngươi một đời.”'],
 c:[
  {i:'🤝',l:'Đồng ý giúp',o:[
    {w:2,t:'Lão chỉ ngươi đến một mộ cổ, lấy lại thứ lão giấu năm xưa. Đổi lại, lão truyền cho ngươi tâm pháp cả đời.',e:{skill:2,tv:12}},
    {w:1,t:'“Việc ấy” là thân thể của ngươi. Thần hồn lão tràn ra từ chiếc nhẫn, muốn đoạt xá!',fight:{k:'amhon',n:'{$lao}',m:1.3,elite:1},win:{t:'Tàn hồn tan biến. Chiếc nhẫn vỡ đôi, nhưng ký ức tu luyện của lão đọng lại trong đầu ngươi.',e:{tv:18,ngo:3,rmRelic:'nhancu'}}}]},
  {i:'🔥',l:'Luyện hóa tàn hồn',chk:['tam',12],ok:{t:'Lão gào thét rồi im bặt. Sức mạnh ba nghìn năm chảy vào kinh mạch ngươi, lạnh và đắng.',e:{tv:18,tamma:8,karma:-6,rmRelic:'nhancu'}},no:{t:'Tàn hồn phản kích, suýt nữa chiếm luôn thức hải của ngươi.',e:{hp:'-30%',tamma:6}}},
  {i:'🙏',l:'Mời lão đi đầu thai',t:'Lão im lặng rất lâu. “Ba nghìn năm… cũng mệt rồi.” Ánh sáng tắt. Chiếc nhẫn trở lại là sắt vụn, nhưng ngươi giữ nó lại.',e:{karma:8,van:3,lore:'luan_hoi'}}
 ]});

ev({id:'thu_khan',n:'Thư khẩn',tg:['tran','thanh'],w:1,v:()=>({a:npc('pham')}),
 t:['Trạm dịch hỗn loạn. Ngựa trạm chết dọc đường, mà bức thư khẩn về phủ thành phải tới trong ba ngày. Dịch thừa {$a.ten} vò đầu bứt tai.'],
 c:[
  {i:'📨',l:'Nhận đưa thư',chk:['tp',8],ok:{t:'Ba ngày ba đêm không ngủ, tới cổng phủ thì hai bàn chân ngươi rộp cả. Thư tới kịp, quan phủ thưởng linh thạch theo lệ.',e:{st:30,karma:3}},no:{t:'Ngươi tới trễ nửa ngày. Quan phủ lắc đầu, chỉ thưởng chút ít.',e:{st:8}}},
  {i:'🚶',l:'Không rảnh',t:'Việc của phàm nhân, để phàm nhân lo.'}
 ]});

ev({id:'tho_san',n:'Thợ săn đặt bẫy',tg:['rung','nui'],w:2,v:()=>({a:npc('pham')}),
 t:['Ngươi suýt giẫm phải bẫy kẹp. Gần đó, thợ săn {$a.ten} đang kéo một con hươu sừng ngọc bị thương nặng.','Một thợ săn chặn ngươi lại: “Đừng đi lối đó, ta đặt bẫy yêu thú. Mà nếu {$a.goi} rảnh, giúp ta một tay?”'],
 c:[
  {i:'🤝',l:'Giúp săn yêu thú',fight:{k:'beast'},win:{t:'{$a.ten} chia cho ngươi một nửa da thịt và yêu đan, còn chỉ cho ngươi lối tắt qua núi.',e:{st:18}}},
  {i:'🦌',l:'Mua con hươu rồi thả',cost:{st:10},t:'Con hươu nhìn ngươi một cái rồi nhảy vào rừng. Sừng ngọc của nó lấp lánh như sao.',e:{karma:5,van:2}},
  {i:'🚶',l:'Đi tiếp',t:'Ngươi gật đầu chào rồi đi.'}
 ]});

ev({id:'chay_rung',n:'Rừng thuốc cháy',tg:['rung','nui'],w:1,v:()=>({a:npc('pham')}),
 t:['Khói đen bốc lên từ thung lũng. Cả một rừng thuốc đang cháy, tiếng người kêu cứu lẫn trong tiếng lửa reo.'],
 c:[
  {i:'💧',l:'Dập lửa cứu người',cost:{mp:'50%'},t:'Ngươi dốc hết linh lực gọi mưa, lửa tắt dần. Mấy người hái thuốc quỳ xuống lạy ngươi như lạy thần.',e:{karma:10,tv:4,an:['a','cứu khỏi đám cháy']}},
  {i:'🌿',l:'Tranh thủ hái linh dược',t:'Lửa lan nhanh, ngươi vơ vội được mấy gốc linh thảo quý. Tiếng kêu cứu sau lưng nhỏ dần.',e:{pill:['tinhnguyen','hoixuan'],karma:-5}},
  {i:'🔍',l:'Tìm kẻ phóng hỏa',fight:{k:'matu'},win:{t:'Kẻ phóng hỏa là ma tu cần tro linh thảo để luyện độc. Hắn không còn cơ hội luyện nữa.',e:{karma:6,st:20}}}
 ]});

ev({id:'khach_diem',n:'Khách điếm',tg:['tran','thanh','song'],w:3,v:()=>({a:npc('tre')}),
 t:['Khách điếm ở {$pl} đông đúc. Ngươi gọi một bình rượu, ngồi bên cửa sổ nhìn mưa.','Đêm ấy ngươi nghỉ ở khách điếm. Phòng bên có tiếng đàn, réo rắt đến tận canh ba.'],
 c:[
  {i:'🛏️',l:'Nghỉ ngơi',cost:{st:5},t:'Một giấc ngủ không mộng mị. Sáng ra, người nhẹ bẫng.',e:{hp:'60%',mp:'60%'}},
  {i:'🎶',l:'Sang làm quen người đánh đàn',o:[
    {w:2,t:'Người đánh đàn là {$a.ten}. Hai người nói chuyện tới sáng, hóa ra cùng có một giấc mơ thời thơ ấu.',e:{tam:2,an:['a','nghe đàn suốt đêm']}},
    {w:1,t:'Ngươi gõ cửa, tiếng đàn tắt. Phòng trống không, chỉ có cây đàn đứt dây và một mùi hương lạ.',e:{tamma:3,relic:0}}]},
  {i:'🍶',l:'Nghe ngóng tin tức',t:'Dưới nhà, mấy tay buôn đang bàn chuyện thiên hạ. Ngươi mời một bình rượu, nghe được không ít.',e:{rumor:2,st:-2}}
 ]});

ev({id:'co_tu',n:'Cổ tự hoang',tg:['phe','nui','rung','tran'],w:2,
 t:['Ngôi cổ tự bỏ hoang, tượng Phật sứt mũi nhìn xuống với nụ cười không đổi. Trời tối rồi, ngươi đành trú lại.','Chùa không còn sư, chỉ còn tiếng gió lùa qua khung cửa. Trên bàn thờ có ai mới thắp một nén nhang, khói còn nghi ngút.'],
 c:[
  {i:'🕯️',l:'Thắp nến, tụng kinh',t:'Đêm yên ả. Gần sáng ngươi nghe tiếng chuông, mà chùa không có chuông.',e:{dao:1,tamma:-8,tam:1}},
  {i:'🔦',l:'Khám phá hậu điện',o:[{w:1,t:'Trong bóng tối có thứ đang chờ ngươi.',fight:{k:'quy'},win:{t:'Âm vật tan biến. Dưới chỗ nó đứng có một hộp gỗ.',e:{relic:0}}},{w:2,t:'Dưới bệ tượng có một ngăn bí mật, bên trong là cuốn kinh chép tay.',e:{skill:1}}]},
  {i:'😴',l:'Ngủ một giấc',o:[{w:2,t:'Ngươi ngủ một mạch tới sáng.',e:{hp:'40%'}},{w:1,t:'Nửa đêm có kẻ tới trước chỗ ngươi nằm.',fight:{},win:{t:'Ngươi ngủ tiếp tới sáng, cạnh cái xác.',e:{hp:'20%'}}}]}
 ]});

ev({id:'son_mon',n:'Tông môn tuyển đồ',tg:['tong','tran','thanh','nui'],r:[0,1],once:1,w:3,cond:r=>!r.flags.tongmon,v:()=>({a:npc('tre')}),
 t:['{$sectC} mở sơn môn thu nhận đệ tử. Thiếu niên khắp nơi nô nức kéo về, xếp hàng dài dưới chân núi. Đệ tử canh cổng {$a.ten} mặt lạnh như tiền.','Cáo thị dán khắp thành trấn: {$sectC} tuyển đồ. Ba đường vào cửa: trắc linh thạch, vấn tâm lộ, hoặc dâng lễ làm tạp dịch.'],
 c:[
  {i:'💠',l:'Thi trắc linh thạch',chk:['root',0],ok:{t:'Viên trắc linh thạch sáng rực lên. {$a.ten} sững sờ, rồi cúi đầu: “Mời {$p.sd} vào.”',e:{relic:'lenhtong',flag:'tongmon',skill:1}},no:{t:'Viên đá chỉ lóe lên mờ mờ. {$a.ten} lắc đầu: “Linh căn thế này, tông ta không thu thẳng.”',e:{tamma:3}}},
  {i:'🪜',l:'Đi vấn tâm lộ',chk:['tam',11],ok:{t:'Ba nghìn bậc thang, mỗi bậc một ảo cảnh. Tới bậc cuối, ngươi chỉ còn lại chính mình. Trưởng lão vuốt râu gật đầu.',e:{relic:'lenhtong',flag:'tongmon',tam:2}},no:{t:'Tới bậc thứ chín trăm, ngươi gục xuống, mơ thấy nỗi sợ lớn nhất đời mình. Tỉnh dậy đã ở chân núi.',e:{tamma:5}}},
  {i:'🎁',l:'Dâng lễ làm tạp dịch',cost:{st:40},t:'Ngươi gánh nước bổ củi hai năm, rảnh thì lén nghe giảng đạo. Cuối cùng cũng được ghi tên vào sổ.',e:{relic:'lenhtong',flag:'tongmon',tv:12,h:1080}}
 ]});

ev({id:'dai_bi',n:'Tông môn đại bỉ',tg:['tong','thanh'],r:[0,1,2],w:2,
 t:['{$sect} mở kỳ đại bỉ: đệ tử lên lôi đài thi đấu, người thắng được vào Tàng Kinh Các chọn một môn công pháp.','Lôi đài dựng giữa quảng trường {$sect}. Khán đài chật kín, ai cũng muốn xem thiên kiêu năm nay là ai.'],
 c:[
  {i:'🥋',l:'Ghi danh',fight:{k:'detu',m:1.15,spar:1},win:{t:'Ngươi thắng liền ba trận, tiếng hò reo vang dội. Phần thưởng là một lượt vào Tàng Kinh Các.',e:{skill:2,st:20}},lose:{t:'Ngươi thua ở trận thứ hai. Nhưng một vị trưởng lão đã nhớ mặt ngươi.',e:{tv:5}}},
  {i:'👀',l:'Đứng xem học hỏi',t:'Mỗi trận đấu là một bài học. Ngươi ghi nhớ từng chiêu.',e:{tv:6}}
 ]});

ev({id:'dau_gia',src:'ent:dauGia',n:'Hội đấu giá',tg:['thanh'],r:[0,1,2,3],w:2,
 t:['Đại hội đấu giá của Vạn Bảo Thương Hội. Món cuối cùng được bưng ra, phủ khăn đỏ. Người dẫn chương trình mỉm cười: “{$dan}, giá khởi điểm…”','Ngươi chen được vào hội đấu giá ở {$pl}. Đèn lồng vạn ngọn, người tu tiên ngồi kín ba tầng lầu.'],
 c:[
  {i:'💎',l:'Ra giá món chót',cost:{st:55},t:'Tiếng búa gõ xuống. Món đồ là của ngươi. Mấy ánh mắt hằm hằm nhìn theo.',e:{pill:'@bt',lore:'van_bao'}},
  {i:'🏺',l:'Mua một món nhỏ hơn',cost:{st:30},t:'Một món pháp bảo không ai để ý. Ngươi mua với giá hời.',e:{relic:0}},
  {i:'👀',l:'Chỉ xem',t:'Xem người ta tranh nhau, ngươi hiểu ra giá trị thật của mọi thứ trên đời.',e:{rumor:1,lore:'van_bao'}}
 ]});

ev({id:'loi_dai',n:'Lôi đài',tg:['thanh','tran'],w:2,
 t:['Lôi đài dựng giữa quảng trường, ai thắng được ba trận liền thì nhận cả hũ linh thạch. Đám đông gào thét.'],
 c:[
  {i:'🥊',l:'Lên đài',fight:{k:'human',spar:1,m:1.05},win:{t:'Ngươi giơ hũ linh thạch lên cao. Đám đông gọi tên ngươi.',e:{st:35,van:1}},lose:{t:'Ngươi bị đánh văng khỏi đài. Có người huýt sáo chế giễu.',e:{tamma:2}}},
  {i:'🎰',l:'Đặt cược',cost:{st:15},o:[{t:'Ngươi thắng cược!',e:{st:32}},{t:'Ngươi thua. Đời là vậy.'}]},
  {i:'🚶',l:'Đi qua',t:'Tiếng hò reo nhỏ dần sau lưng.'}
 ]});

ev({id:'yeu_quai_lang',n:'Thôn bị yêu quấy',tg:['tran'],r:[0,1,2],w:2,v:()=>({a:npc('pham')}),
 t:['Cả thôn treo bùa đỏ khắp cửa. {$a.ten} quỳ xuống trước mặt ngươi: “Tiên sư cứu mạng! Đêm nào cũng có người mất tích, gia súc chết khô.”','Thôn {$pl} vắng tanh giữa ban ngày. Một bà lão lén hé cửa, thì thào: “Đi đi, đêm nay nó lại tới.”'],
 c:[
  {i:'🌙',l:'Đêm nay canh gác',o:[
    {w:2,t:'Nửa đêm, gió lạnh thổi tắt mọi ngọn đèn. Nó tới.',fight:{k:'quy',m:1.1},win:{t:'Yêu vật gục ngã. Dân làng mổ lợn ăn mừng ba ngày liền.',e:{st:25,karma:8,tv:6}}},
    {w:1,t:'Thứ xuất hiện là một con hồ ly già. Nó không tấn công, chỉ dẫn ngươi tới cái giếng cuối làng. Dưới đáy giếng có ánh lửa. Hóa ra nó mới là kẻ bảo vệ thôn.',c:[
      {i:'⚔️',l:'Xuống giếng',fight:{k:'luyenthi',m:1.15},win:{t:'Tên luyện thi nhân chết dưới đáy giếng. Con hồ ly ngồi trên miệng giếng nhìn ngươi, rồi lặng lẽ bỏ đi.',e:{st:30,karma:10,tv:8}}},
      {i:'🦊',l:'Nghi ngờ con hồ ly',fight:{k:'holy'},win:{t:'Ngươi giết con hồ ly. Đêm hôm sau, lại có người mất tích.',e:{karma:-8,tamma:8}}}]}]},
  {i:'💎',l:'Đòi thù lao trước',t:'{$a.ten} gom góp được ít linh thạch, run run đưa cho ngươi. Đêm ấy, nó tới.',e:{st:12,karma:-2},fight:{k:'quy'},win:{t:'Việc đã xong. Dân làng không ăn mừng, chỉ đóng cửa im lặng.',e:{tv:5}}},
  {i:'🚶',l:'Bỏ đi',t:'Ngươi đi khỏi thôn. Đêm ấy, ngươi nằm mãi không ngủ được.',e:{tamma:4}}
 ]});

ev({id:'thuy_quy',when:{part:['toi','dem']},n:'Bến đò đêm',tg:['song'],w:2,v:()=>({a:npc('pham')}),
 t:['Lái đò {$a.ten} nhất quyết không chở ai qua sông sau giờ Dậu. “Dưới sông có thứ kéo người xuống, năm nay đã mất bảy mạng.”','Đò ra giữa dòng thì nước bỗng đen kịt. Một bàn tay trắng bệch bám lên mạn thuyền.'],
 c:[
  {i:'⚔️',l:'Diệt thủy quỷ',fight:{k:'thuyquy'},win:{t:'Mặt nước lặng dần. Lái đò quỳ lạy ngươi, nước mắt giàn giụa.',e:{karma:6,st:15}}},
  {i:'🪔',l:'Thả đèn cầu siêu',chk:['tam',9],ok:{t:'Ngọn đèn hoa sen trôi đi. Mặt nước lặng dần. Từ đó bến đò không còn ai chết đuối.',e:{karma:8,tam:1}},no:{t:'Đèn bị một bàn tay dìm xuống. Nó không muốn đi.',fight:{k:'thuyquy'},win:{t:'Nó đi rồi. Lần này thì thật.',e:{karma:4}}}},
  {i:'🏊',l:'Tìm chỗ khác qua sông',chk:['tp',8],ok:{t:'Ngươi tìm được chỗ cạn, lội qua an toàn.'},no:{t:'Nước xiết hơn ngươi tưởng. Ngươi bị cuốn đi mấy dặm mới bám được vào bờ.',e:{hp:'-15%'}}}
 ]});

ev({id:'hoa_bi',n:'Cô dâu mới',tg:['tran','thanh'],r:[0,1,2,3],w:1,
 t:['Nhà phú hộ trong trấn vừa cưới vợ ba. Từ đó, cứ cách mấy đêm lại có gia nhân chết, tim bị moi mất.','Ngươi đi ngang một nhà giàu, thấy yêu khí lẩn khuất trên mái ngói. Cô dâu mới đứng tựa cửa sổ, nhìn ngươi cười.'],
 c:[
  {i:'🔍',l:'Điều tra',chk:['ngo',10],ok:{t:'Ngươi tìm thấy tấm da người treo trong tủ. Đêm ấy, cô dâu không có da để mặc.',fight:{k:'hoabi'},win:{t:'Họa bì cháy thành tro. Nhà phú hộ tạ ơn hậu hĩnh.',e:{karma:8,st:30,relic:0}}},no:{t:'Ngươi không tìm ra gì. Đêm ấy, chính ngươi suýt bị moi tim.',fight:{k:'hoabi',m:1.2},win:{t:'Nguy hiểm thật. Ngươi chạm tay lên ngực, tim vẫn còn đập.',e:{karma:6,st:15}}}},
  {i:'🚶',l:'Không xen vào',t:'Chuyện nhà người ta. Nhưng nụ cười ấy đi theo ngươi vào giấc ngủ.',e:{tamma:2}}
 ]});

ev({id:'lao_ngu',n:'Cá chép vàng',tg:['song','bien'],w:1,v:()=>({a:npc('gia')}),
 t:['Ông lão đánh cá kéo lưới lên, trong lưới là một con cá chép vàng to bằng đứa trẻ, mắt rưng rưng như người khóc.'],
 c:[
  {i:'💎',l:'Mua lại rồi thả',cost:{st:15},t:'Ngươi thả cá xuống sông. Nó quẫy đuôi ba lần như lạy rồi lặn mất. Đêm ấy, có viên ngọc trai sáng rực đặt ở đầu giường ngươi.',e:{relic:0,karma:5,van:2}},
  {i:'🍲',l:'Mua về nấu',cost:{st:10},t:'Thịt cá ngọt như mật, ăn vào nóng rực cả người. Nửa đêm, ngươi mơ thấy có ai đứng khóc ở cửa.',e:{hpP:4,tv:6,karma:-3}},
  {i:'🚶',l:'Đi qua',t:'Ông lão xách con cá ra chợ. Ngươi không ngoảnh lại.'}
 ]});

ev({id:'chuong_xac',when:{part:['dem']},n:'Chuông dẫn xác',tg:['hoang','phe','rung'],w:1,
 t:['Tiếng chuông lắc leng keng giữa đêm. Một đoàn xác chết dán bùa vàng nhảy cò cò trên đường, dẫn đầu là một đạo sĩ áo đen.','Trên cành cây khô treo một chiếc chuông đồng nhỏ, gió thổi lại kêu. Dưới gốc cây là bảy cái xác không tên.'],
 c:[
  {i:'🙇',l:'Nhường đường',t:'Đạo sĩ cản thi gật đầu cảm ơn. Đoàn xác đi qua, mùi đất ẩm thoảng lại rất lâu.',e:{van:1}},
  {i:'⚔️',l:'Chặn lại xem xét',fight:{k:'luyenthi'},win:{t:'Hóa ra đây là luyện thi nhân bắt người sống luyện thi. Ngươi chôn cất bảy cái xác.',e:{karma:6,st:20}}},
  {i:'🔔',l:'Lấy cái chuông',t:'Chuông nằm trong tay ngươi, không còn kêu nữa. Nhưng đêm nào ngươi cũng nghe thấy nó.',e:{relic:0,tamma:4}}
 ]});

ev({id:'cho_que',n:'Con chó vàng',tg:['tran'],w:1,
 t:['Một con chó vàng cứ lẽo đẽo theo ngươi từ đầu trấn tới cuối trấn. Ngươi dừng, nó dừng. Ngươi đi, nó đi.'],

  {i:'🍖',l:'Mua cho nó cái bánh',cost:{st:2},t:'Nó vẫy đuôi ăn hết, rồi chạy biến. Hôm sau, ngươi nhặt được một túi linh thạch ai đánh rơi ngay chỗ nó nằm.',e:{van:2,st:10}},
  {i:'🚶',l:'Đuổi đi',t:'Nó cụp đuôi bỏ đi. Ngươi thấy hơi áy náy.'}
 ]});

ev({id:'hoi_den',when:{season:['xuan']},n:'Hội hoa đăng',tg:['tran','thanh','song'],w:1,

 c:[

 ]});

ev({id:'thu_nha',n:'Thư nhà',tg:['*'],r:[0,1],once:1,w:1,

    {w:1,t:'Thư báo tin người thân của ngươi đã mất từ mùa thu. Ngươi đọc đi đọc lại ba lần. Rồi ngươi ngồi xuống, rất lâu.',e:{tamma:6,tam:2,tv:5}}]},
  {i:'🔥',l:'Đốt đi không đọc',t:'Đã bước lên tiên lộ, không quay đầu. Tro giấy bay theo gió.',e:{tam:1,tamma:3}}

ev({id:'xin_lam_do',n:'Đứa trẻ xin bái sư',tg:['tran','thanh'],w:1,v:()=>({a:npc('hai')}),

 c:[
  {i:'🧑‍🏫',l:'Nhận làm đệ tử',t:'Nửa năm dạy nó luyện khí. Lúc chia tay, nó khóc như mưa, hứa sau này nổi danh sẽ đi tìm ngươi.',e:{karma:4,tam:2,h:288,an:['a','nhận làm đệ tử']}},
  {i:'🍚',l:'Cho ít tiền rồi khuyên về',cost:{st:5},t:'Nó cầm tiền, cúi đầu đi. Có lẽ làm phàm nhân yên ổn cũng là một cái phúc.',e:{karma:1}},

ev({id:'hoa_su',n:'Họa sư',tg:['tran','thanh','song','nui'],w:1,v:()=>({a:npc('tre')}),

 ]});

ev({id:'tuyet_son',when:{season:['dong']},n:'Người ngồi trong tuyết',tg:['nui'],w:1,
 t:['Trên đỉnh núi tuyết có người ngồi thiền, tuyết phủ tới vai. Người dưới núi nói người ấy đã ngồi đó ba năm.'],
 c:[
  {i:'🧘',l:'Ngồi xuống bên cạnh',t:'Ngươi ngồi một năm. Tuyết phủ lên vai ngươi. Ngày ngươi đứng dậy, người kia cũng mở mắt, khẽ gật đầu với ngươi, rồi đi xuống núi.',e:{dao:2,tv:14,tam:2,h:720}},

ev({id:'ga_quay',n:'Tranh nhau con gà',tg:['tran','thanh'],w:1,v:()=>({a:npc('tre'),b:npc('tre')}),

  {i:'🍗',l:'Lấy con gà rồi chạy',chk:['tp',9],ok:{t:'Lúc hai người nhận ra thì ngươi đã ngồi gặm đùi gà ở đầu phố bên kia. Ngon thật.',e:{hp:'20%',van:1}},no:{t:'Hai người cùng dừng tay, cùng quay sang ngươi.',fight:{k:'tantu',n:'{$a.ten}'},win:{t:'Ngươi ăn con gà trước mặt cả hai.',e:{hp:'20%'}}}},

ev({id:'bat_nat',n:'Ức hiếp tạp dịch',tg:['tong'],w:2,v:()=>({a:npc('tre'),b:npc('nam')}),

  {i:'✋',l:'Can ngăn',fight:{k:'detu',n:'{$b.ten}'},win:{t:'{$b.ten} ôm mặt bỏ chạy, buông một câu: “Ngươi chờ đấy!” {$a.ten} lén nhìn ngươi, mắt sáng lên như sao.',e:{karma:6,an:['a','cứu khỏi trận đòn'],oan:['b','đánh cho mất mặt']}}},

 ]});

 c:[
  {i:'🌿',l:'Lén hái',chk:['tp',11],ok:{t:'Ngươi vào ra như gió. Trong túi đã có mấy gốc linh thảo thượng hạng.',e:{pill:['tinhnguyen','taytuy'],karma:-4}},no:{t:'Lão già mở mắt. Hóa ra lão chỉ giả ngủ.',fight:{k:'votang',n:'Lão canh vườn',m:1.1},win:{t:'Ngươi chạy thoát, trên tay còn kịp nhổ một gốc.',e:{pill:1,karma:-4}}}},

ev({id:'luan_dao',n:'Luận đạo',tg:['tong','nui','thanh'],w:2,v:()=>({a:npc('dao')}),

ev({id:'luyen_khi',n:'Lò rèn pháp bảo',tg:['tong','thanh','nui'],r:[1,2,3],w:1,v:()=>({a:npc('gia')}),

 c:[

  {i:'🏝️',l:'Để sóng đẩy vào đảo',o:[{t:'Ngươi dạt vào một hòn đảo lạ, cát trắng như muối.',fight:{},win:{t:'Chủ đảo không mời mà tới. Giờ thì đảo không còn chủ.',e:{st:20}}},{t:'Trên đảo có một rương gỗ mục, bên trong là đồ của ai đó.',e:{relic:0}}]},

  {i:'🔔',l:'Tìm cái chuông',chk:['ngo',12],ok:{t:'Chiếc chuông đồng treo ở tháp cao nhất. Ngươi gõ một tiếng. Trong đầu vang lên một bài pháp quyết cổ xưa.',e:{lore:'long_cung',skill:3,tam:2}},no:{t:'Ngươi lạc trong mê cung san hô, suýt chết đuối.',e:{lore:'long_cung',hp:'-20%'}}},

// ================= LÕI BỔ SUNG =================
// Vòng chu thiên, linh thú, luyện chế, bế quan tùy chọn, thế cục, nhân mạch, ghi chú bản đồ.
// Hàm thuần, không đụng giao diện; chạy được trong Node (xem tools/run.js).

function note(t,c){G.toasts=G.toasts||[];G.toasts.push({t,c:c||''});if(G.toasts.length>6)G.toasts.shift();}
function run2(){const r=G.run;if(!r)return null;
  if(!r.chu)r.chu=[null,null,null,null,null,null,null,null];
  if(!r.pets)r.pets=[];if(!r.eggs)r.eggs=[];if(r.petOut===undefined)r.petOut=null;
  if(!r.mats)r.mats={thao:0,khoang:0,dan:0};
  return r;}

// ---------------- VÒNG CHU THIÊN ----------------
// Tám ô quanh đan điền. Linh khí chảy theo chiều kim đồng hồ: ô trước sinh ô sau thì mạnh lên, khắc thì yếu đi.
const SINH={moc:'hoa',hoa:'tho',tho:'kim',kim:'thuy',thuy:'moc'};
const QUY={bang:'thuy',phong:'moc',loi:'hoa',am:'thuy',phat:'tho'}; // hệ biến dị quy về ngũ hành khi xét sinh khắc
const CHU_N=[4,5,6,7,8,8];
function chuSlots(){return CHU_N[G.run.realm]||4;}
function chuBase(el){return QUY[el]||el;}
function chuItem(c){const r=G.run;if(!c)return null;
  if(c.k==='s'){const own=r.skills.find(x=>x.id===c.id);if(!own)return null;const sk=SK[c.id];return {k:'s',n:sk.n,el:sk.el,lv:own.lv};}
  const rel=r.relics.find(x=>x.name===c.n);return rel?{k:'r',n:rel.name,el:rel.el||'vo',tier:rel.tier||0}:null;}
function chuKey(c){return c?(c.k==='s'?'s:'+c.id:'r:'+c.n):'';}
function chuPool(){const r=run2();const used=new Set(r.chu.map(chuKey));const L=[];
  for(const k of r.skills){const c={k:'s',id:k.id};if(!used.has(chuKey(c)))L.push(c);}
  for(const x of r.relics){const c={k:'r',n:x.name};if(!used.has(chuKey(c))&&!L.find(y=>chuKey(y)===chuKey(c)))L.push(c);}
  return L;}
function chuSet(i,c){const r=run2();if(i<0||i>=chuSlots())return;
  if(c){const k=chuKey(c);for(let j=0;j<8;j++)if(chuKey(r.chu[j])===k)r.chu[j]=null;}
  r.chu[i]=c||null;clampHp();saveSoon();}
function chuLink(a,b){ // a chảy sang b
  if(!a||!b)return 0;const x=chuBase(a.el),y=chuBase(b.el);
  if(x==='vo'||y==='vo')return 0;
  if(SINH[x]===y)return 1;if(KHAC[x]===y)return -1;if(x===y)return 2;return 0;}
function chuView(){const r=run2();const n=chuSlots();const it=[];
  for(let i=0;i<n;i++){const v=chuItem(r.chu[i]);if(!v&&r.chu[i])r.chu[i]=null;it.push(v);}
  const links=[];let sinh=0,khac=0,dong=0;
  for(let i=0;i<n;i++){const j=(i+1)%n;const l=chuLink(it[i],it[j]);links.push(l);if(l===1)sinh++;else if(l===-1)khac++;else if(l===2)dong++;}
  const full=it.every(Boolean);const dai=full&&!khac&&sinh>=n-1;
  return {n,it,links,sinh,khac,dong,full,dai};}
function chuFx(fx){const r=G.run;if(!r||!r.chu)return;const v=chuView();
  for(let i=0;i<v.n;i++){const j=(i+1)%v.n;const l=v.links[i];if(!l)continue;const el=v.it[j].el;
    fx.elP[el]=(fx.elP[el]||0)+(l===1?6:l===2?3:-5);if(l===1)fx.mpP=(fx.mpP||0)+3;}
  if(v.dai){fx.tvP=(fx.tvP||0)+15;fx.hpP=(fx.hpP||0)+8;}}
function chuAuto(){ // xếp tự động: thử tham lam để được nhiều mối tương sinh nhất
  const r=run2();const n=chuSlots();const all=r.chu.filter(Boolean).concat(chuPool());
  const items=all.map(c=>({c,v:chuItem(c)})).filter(x=>x.v);
  let best=null,bs=-1e9;
  for(let s=0;s<items.length;s++){
    const left=items.slice();const seq=[left.splice(s,1)[0]];
    while(seq.length<n&&left.length){let bi=0,bv=-9;for(let i=0;i<left.length;i++){const l=chuLink(seq[seq.length-1].v,left[i].v);const sc=l===1?3:l===2?1:l===-1?-3:0;if(sc>bv){bv=sc;bi=i;}}seq.push(left.splice(bi,1)[0]);}
    let sc=0;for(let i=0;i<seq.length;i++){const l=chuLink(seq[i].v,seq[(i+1)%n]&&seq[(i+1)%n].v);sc+=l===1?3:l===2?1:l===-1?-3:0;}
    sc+=seq.length*0.1;if(sc>bs){bs=sc;best=seq;}
  }
  r.chu=[null,null,null,null,null,null,null,null];if(best)best.forEach((x,i)=>{r.chu[i]=x.c;});clampHp();saveSoon();}

  r.relics.forEach((x,i)=>L.push({key:'r'+i,cat:'eq',n:x.name,tier:x.tier||0,cnt:1,el:x.el||'vo',slot:slotOf(x),ref:{t:'rel',i},tip:fxLines(relicFx(x),x).join('\n')+'\n\n'+(x.lore||'')}));
  const st={};r.pills.forEach((p,i)=>{const k='p'+p.id+':'+(p.q||0);if(!st[k])L.push(st[k]={key:k,cat:'dan',n:PILL[p.id].n,tier:p.q||0,cnt:0,em:PILL[p.id].i,ref:{t:'pill',id:p.id,q:p.q||0},use:PILL[p.id].w==='any',tip:pillTip(p.id,p.q)});st[k].cnt++;});
  const M={thao:'duoc',khoang:'khoang',dan:'vl'};for(const k in MAT)if(r.mats[k]>0)L.push({key:'m'+k,cat:M[k],n:MAT[k].n,tier:0,cnt:r.mats[k],em:MAT[k].i,ref:{t:'mat',k},tip:MAT[k].d});
  r.eggs.forEach((e,i)=>L.push({key:'e'+i,cat:'trung',n:'Trứng '+e.n,tier:1,cnt:1,em:'🥚',ref:{t:'egg',i},tip:e.t>W().t?'Còn '+durH(e.t-W().t)+' nữa thì nở.':'Sắp nở.'}));
  r.passes.forEach(g=>L.push({key:'q'+g,cat:'nv',n:'Lệnh bài thông quan '+REG[g].n,tier:2,cnt:1,em:'🎫',ref:{t:'pass'},tip:'Trình ở quan ải để sang '+REG[g].n+'.'}));
  return L;}
function bagUse(key,n){const r=G.run;const it=bagItems().find(x=>x.key===key);if(!it||!it.use)return 0;let c=0;
  for(let k=0;k<n;k++){const i=r.pills.findIndex(p=>p.id===it.ref.id&&(p.q||0)===it.ref.q);if(i<0)break;const m=usePill(i,false);if(!G.run)break;if(m===false||r.pills[i]&&r.pills.filter(p=>p.id===it.ref.id&&(p.q||0)===it.ref.q).length===it.cnt-c)break;c++;}
  if(c&&G.run)log('Dùng '+c+' '+it.n+'.');return c;}
function bagDrop(key,n){const r=G.run;const it=bagItems().find(x=>x.key===key);if(!it)return 0;if(it.ref.t==='rel'?r.relics[it.ref.i].lock:(r.locks&&r.locks[key]))return 0;const R0=it.ref;let c=0;
  if(R0.t==='rel'){r.relics.splice(R0.i,1);c=1;}
  else if(R0.t==='pill'){for(let k=0;k<n;k++){const i=r.pills.findIndex(p=>p.id===R0.id&&(p.q||0)===R0.q);if(i<0)break;r.pills.splice(i,1);c++;}}
  else if(R0.t==='mat'){c=Math.min(n,r.mats[R0.k]);r.mats[R0.k]-=c;}
  else if(R0.t==='egg'){r.eggs.splice(R0.i,1);c=1;}
  if(c)log('Vứt '+c+' '+it.n+'.');saveSoon();return c;}

// ================= ĐỢT 5: CÔNG PHÁP, TÂM PHÁP, SỞ HỌC, KỸ NĂNG =================
// Công pháp: cộng chỉ số theo hệ và mang 1–3 chiêu. Tâm pháp: toàn nội tại, đôi khi có đòn thần thức.
// Học từ bí tịch; chỉ môn đang đặt trong vòng vận công mới vận hành.
function skCat(sk){return sk.fx.evade?'move':!sk.fx.p?'def':sk.t>=3?'ult':'atk';}
const CAT_N={atk:'Tấn công',def:'Phòng thủ',move:'Thân pháp',ult:'Thần thông'},CAT_MAX={atk:3,def:3,move:1,ult:1};
const ART_SFX={cp:['Quyết','Kinh','Công','Chân Giải','Đạo Thư','Bí Lục'],tp:['Tâm Kinh','Tâm Pháp','Dưỡng Khí Thiên','Nội Kinh','Tĩnh Tâm Chú']};
const EL_FX={kim:['atkP',6],moc:['hpP',6],thuy:['mpP',8],hoa:['matkP',7],tho:['defP',8],loi:['crit',3],bang:['defP',6],phong:['tp',1.2],am:['drain',3],phat:['tam',1.5],vo:['tvP',5]};
const PAS={
  tu:{n:'Tu luyện',fx:'tvP',v:6,d:'Tu vi nhận thêm {v}%'},bq:{n:'Tĩnh tọa',fx:'bqP',v:8,d:'Bế quan hiệu quả hơn {v}%'},
  than:{n:'Thần thức',fx:'than',v:2,d:'Niệm lực +{v}'},mp:{n:'Hồi linh',fx:'regenMp',v:3,d:'Trong trận mỗi lượt hồi {v}% linh lực'},
  hp:{n:'Hồi sinh lực',fx:'regenHp',v:1.5,d:'Trong trận mỗi lượt hồi {v}% khí huyết'},atk:{n:'Bổ trợ tấn công',fx:'atkP',v:5,d:'Công vật lý +{v}%'},
  matk:{n:'Bổ trợ pháp thuật',fx:'matkP',v:5,d:'Công phép +{v}%'},stage:{n:'Tích lũy',fx:'atkStage',v:2,d:'Mỗi tiểu cảnh giới: công +{v}%'},
  rage:{n:'Chiến ý',fx:'rageTurn',v:0.5,d:'Trong trận mỗi lượt +{v} tầng cuồng nộ, tối đa 5 tầng',int:1},def:{n:'Bổ trợ phòng thủ',fx:'defP',v:6,d:'Thủ +{v}%'},
  ho:{n:'Hộ thể',fx:'startBlock',v:5,d:'Đầu trận có hộ thể bằng {v}% khí huyết'},tl:{n:'Bổ trợ thể lực',fx:'hpP',v:3,d:'Khí huyết +{v}%'},
  tam:{n:'Thanh tâm',fx:'tammaRes',v:12,d:'Tâm ma tăng chậm hơn {v}%'},di:{n:'Khinh thân',fx:'moveP',v:8,d:'Đi đường nhanh hơn {v}%'},
};
const FX_N={atkP:'Công vật lý +{v}%',hpP:'Khí huyết +{v}%',mpP:'Linh lực +{v}%',matkP:'Công phép +{v}%',defP:'Thủ +{v}%',crit:'Chí mạng +{v}%',tp:'Thân pháp +{v}',drain:'Hút {v}% sát thương thành khí huyết',tam:'Đạo tâm +{v}',tvP:'Tu vi nhận thêm {v}%'};
SLOT_N.book='Bí tịch';KSLOT.book='book';BAG_CAT.bitich='Bí tịch';
// ----- công pháp, tâm pháp theo "dòng": mỗi dòng là một chỉ số hoặc một chiêu; tham ngộ lên tầng mới mở dòng kế tiếp,
// và dòng nào ghi cảnh giới thì phải đủ cảnh giới mới có tác dụng. Bản thân môn cũng đòi cảnh giới mới học được.
const ART_REQ=[0,0,1,2,3,4,5];               // cảnh giới tối thiểu thường gặp theo phẩm
const ART_LINES=[3,4,5,6,7,8,9];             // số dòng theo phẩm
const LV_N=['tầng 1','tầng 2','tầng 3','tầng 4','tầng 5','tầng 6','tầng 7','tầng 8','tầng 9'];
const STAGE_FX={atkStage:'Mỗi cảnh giới: công vật lý +{v}%',hpStage:'Mỗi cảnh giới: khí huyết +{v}%',defStage:'Mỗi cảnh giới: thủ +{v}%',matkStage:'Mỗi cảnh giới: công phép +{v}%'};
function reqName(q){return q?REALM[q]:'Phàm nhân';}
function artReqMul(req){return 1+0.12*(req||0);}
// trần cho các chỉ số dễ vỡ cân bằng
const FX_CAP={tammaRes:60,startBlock:30,regenMp:12,regenHp:6,rageTurn:2,moveP:60,bqP:80,tvP:80,crit:20,drain:20,than:40,atkStage:12,tp:12};
function genArt(type,tier,sid,o){const r=G.run;o=o||{};r.aid=(r.aid||0)+1;tier=clamp(Math.round(tier),0,6);
  const req=o.req!=null?o.req:clamp(ART_REQ[tier]+(chance(.25)?1:0),0,5);
  const nL=ART_LINES[tier];const span=tier>=4?2:tier>=2?1:(chance(.5)?1:0);
  let el,sks=[];
  if(type==='cp'){const sk0=SK[sid]||SK[rollSkill(clamp(tier,1,4))];el=sk0.el;const want=tier<=1?1:tier<=3?2:3;sks=[sk0.id];const cats=new Set([skCat(sk0)]);
    for(const id of shuffle(SK_RAW.filter(s=>(s[2]===el||s[2]==='vo')&&s[3]<=clamp(tier+1,1,5)&&s[0]!==sk0.id).map(s=>s[0]))){if(sks.length>=want)break;const c=skCat(SK[id]);if(cats.has(c))continue;cats.add(c);sks.push(id);}}
  else el=o.el||(chance(.6)?pick(r.root.els):pick(['vo','kim','moc','thuy','hoa','tho']));
  // xếp dòng: dòng 1 là chỉ số chính; chiêu rải đều, chiêu mạnh nhất ở cuối
  const L=[];const pas=shuffle(Object.keys(PAS));let pi=0;
  const statLine=()=>{if(chance(.18)&&!L.some(x=>x.fx&&STAGE_FX[x.fx])){const k=pick(Object.keys(STAGE_FX));return {fx:k,v:1.5,stage:1};}const p=PAS[pas[(pi++)%pas.length]];return {fx:p.fx,v:p.v,n:p.n,d:p.d,int:p.int};};
  if(type==='cp'){const e=EL_FX[el]||EL_FX.vo;L.push({fx:e[0],v:e[1]});}else L.push(statLine());
  const skPos=type==='cp'?(sks.length===1?[1]:sks.length===2?[1,nL-1]:[1,Math.floor(nL/2),nL-1]):[];
  const sorted=sks.slice().sort((a,b)=>SK[a].t-SK[b].t);
  const mind=type==='tp'&&chance(tier>=3?.45:.15)?Math.max(1,nL-1):-1;
  for(let i=1;i<nL;i++){const j=skPos.indexOf(i);if(j>=0)L.push({sk:sorted[j]});else if(i===mind)L.push({mind:1});else L.push(statLine());}
  L.forEach((x,i)=>{x.req=clamp(req+Math.floor(i*span/Math.max(1,nL-1)+(i===nL-1&&span?0.01:0)),0,5);});
  const a={u:r.aid,type,n:pick(RELIC_PRE[el]||RELIC_PRE.vo)+' '+pick(ART_SFX[type]),el,tier,req,lv:1,lines:L,v:2};
  return a;}
// bản lưu cũ: đổi môn kiểu cũ (sk, pas, lv 1–3) sang kiểu dòng
function normArt(a){if(!a||a.v===2)return a;const L=[];
  if(a.type==='cp'){const e=EL_FX[a.el]||EL_FX.vo;L.push({fx:e[0],v:e[1]});}
  for(const id of a.sk||[])L.push({sk:id});for(const k of a.pas||[]){const p=PAS[k];if(p)L.push({fx:p.fx,v:p.v,n:p.n,d:p.d,int:p.int});}if(a.mind)L.push({mind:1});
  const req=ART_REQ[a.tier]||0;L.forEach(x=>x.req=req);a.req=req;a.lines=L;a.lv=a.lv>=3?L.length:Math.min(L.length,(a.lv||1)+1);a.v=2;return a;}
function artOpen(a,i){const r=G.run;const x=a.lines[i];return i<a.lv&&r.realm>=x.req;}
function artSk(a){return a.lines.filter((x,i)=>x.sk&&artOpen(a,i)).map(x=>x.sk);}
function artMind(a){return a.lines.some((x,i)=>x.mind&&artOpen(a,i));}
function skLvOf(a){return clamp(1+Math.floor((a.lv-1)/3),1,3);}
function artAff(a){const r=G.run;return a.el==='vo'||r.root.els.includes(a.el)?1:0.8;}
function artScale(a,pot){return Math.pow(PHAM_M[a.tier],0.85)*artReqMul(a.req)*artAff(a)*(pot==null?1:pot);}
function lineVal(a,x,pot){const r=G.run;let v=x.v*artScale(a,pot);if(x.stage)v=x.v*(1+a.tier*0.4)*artAff(a)*(pot==null?1:pot)*(r.realm+1);else if(FX_CAP[x.fx])v=Math.min(FX_CAP[x.fx],v);return x.int?Math.max(1,Math.round(v)):Math.round(v*10)/10;}
function lineText(a,x,pot){if(x.sk){const s=SK[x.sk];return 'Chiêu: '+s.n+' ('+CAT_N[skCat(s)].toLowerCase()+')';}if(x.mind)return 'Đòn thần thức: Thần Thức Thứ';
  const v=numFx(lineVal(a,x,pot));if(x.stage)return STAGE_FX[x.fx].replace('{v}',numFx(Math.round(x.v*(1+a.tier*0.4)*artAff(a)*(pot==null?1:pot)*10)/10))+' (đang +'+v+'%)';return (x.n?x.n+': ':'')+(x.d||FX_N[x.fx]||x.fx).replace('{v}',v);}
// chỉ các dòng chỉ số đã mở mới có tác dụng
function artFxList(a,pot){const L=[];a.lines.forEach((x,i)=>{if(!x.fx||!artOpen(a,i))return;const k=x.stage?x.fx.replace('Stage','P'):x.fx;L.push({k,v:lineVal(a,x,pot),t:x.stage?STAGE_FX[x.fx]:(x.d||FX_N[x.fx]),n:x.n});});return L;}
function artLines(a,pot){return a.lines.map((x,i)=>artOpen(a,i)?lineText(a,x,pot):null).filter(Boolean);}
function numFx(v){return String(v).replace('.',',');}
function artDesc(a){return (a.type==='cp'?'Công pháp':'Tâm pháp')+' hệ '+(EL[a.el]||EL.vo).n+' · cần '+reqName(a.req)+'.\n'+a.lines.map((x,i)=>'• '+lineText(a,x)).join('\n');}
function artNextWhy(a){const r=G.run;if(a.lv>=a.lines.length)return 'Đã tham ngộ hết các tầng.';const x=a.lines[a.lv];if(r.realm<x.req)return 'Tầng kế tiếp cần '+reqName(x.req)+'.';return '';}
function studyTime(a){return Math.round((2+a.lv)*2*(1+a.tier*0.25))*HM;}
function bookOf(a){return {name:'Bí tịch '+a.n,k:'book',tier:a.tier,el:a.el,fx:{},lore:artDesc(a),art:a,seen:1};}
function gainSkill(id){const r=G.run,sk=SK[id];if(!sk)return null;run2();const a=genArt('cp',sk.t,id);const b=bookOf(a);r.relics.push(b);log('Được '+b.name+'.');
  return chip('📖',b.name,PHAM[a.tier]+'\n'+b.lore+'\n\nMở Nhân vật → Sở học để học.','item');}
function gainBookTp(tier){const r=G.run;run2();const b=bookOf(genArt('tp',tier));r.relics.push(b);return b;}
function arts(){const r=G.run;if(!r.arts)r.arts=[];for(const a of r.arts)if(a.v!==2)normArt(a);return r.arts;}
function artBy(u){return arts().find(a=>a.u===u);}
function learnTime(a){return (a.tier+1)*2*HM;}
const ART_MAX=10,ART_CAP={cp:[5,6,7,8,9,10],tp:[5,6,7,8,9,10]};
function artCap(type){const r=G.run;return ART_CAP[type][clamp(r.realm,0,5)];}
function learnWhy(rel){const r=G.run;if(rel&&rel.art&&!arts().some(x=>x.n===rel.art.n&&x.type===rel.art.type)&&arts().filter(x=>x.type===rel.art.type).length>=artCap(rel.art.type))return 'Đã đủ '+artCap(rel.art.type)+' ô '+(rel.art.type==='cp'?'công pháp':'tâm pháp')+'. Phế bỏ một môn hoặc lên cảnh giới để mở thêm ô.';if(r.scene||r.moving)return 'Phải đứng yên ngoài bản đồ mới tham ngộ được.';normArt(rel.art);if(r.realm<rel.art.req)return 'Cần '+reqName(rel.art.req)+' mới đọc hiểu.';return '';}
function learnBook(i){const r=G.run;const rel=r.relics[i];if(!rel||rel.k!=='book'||learnWhy(rel))return null;const a=rel.art;r.relics.splice(i,1);
  const old=arts().find(x=>x.n===a.n&&x.type===a.type);advanceTime(learnTime(a));if(!G.run)return null;let t;
  if(old){if(old.lv<old.lines.length)old.lv++;t=`Đọc lại ${a.n}, lĩnh hội thêm một tầng: ${LV_N[old.lv-1]}.`;}
  else{r.arts.push(a);const n=chuSlots();for(let j=0;j<n;j++)if(!r.chu[j]){r.chu[j]={k:'a',u:a.u};break;}t=`Học được ${a.n}.`;if(a.lines.some(x=>x.sk&&SK[x.sk].dao)&&addDao(3,'skill'))t+=' Đạo cơ +3.';}
  log(t);syncSkills();clampHp();autoCheck();saveSoon();return t;}
function studyArt(u){const r=G.run;const a=artBy(u);if(!a||artNextWhy(a)||r.scene||r.moving)return null;advanceTime(studyTime(a));if(!G.run)return null;a.lv++;const t=`Tham ngộ ${a.n}: ${LV_N[a.lv-1]}.`;log(t);syncSkills();clampHp();autoCheck();saveSoon();return t;}
function dropArt(u){const r=G.run;r.arts=arts().filter(a=>a.u!==u);for(let j=0;j<8;j++)if(r.chu[j]&&r.chu[j].u===u)r.chu[j]=null;syncSkills();clampHp();saveSoon();}
function learnAll(){const r=G.run;if(!r||r.scene||r.moving)return;for(let i=r.relics.length-1;i>=0&&G.run;i--)if(r.relics[i]&&r.relics[i].k==='book'&&!learnWhy(r.relics[i]))learnBook(i);}
// ----- vòng vận công: giờ đặt công pháp, tâm pháp. Có huyệt (mạnh gấp rưỡi) và ô tắc phải đả thông -----
function chuKey(c){return c?'a:'+c.u:'';}
function chuItem(c){if(!c||c.k!=='a')return null;const a=artBy(c.u);return a?{k:'a',u:a.u,n:a.n,el:a.el,tier:a.tier,type:a.type,lv:a.lv}:null;}
function chuPool(){const r=run2();const used=new Set(r.chu.filter(Boolean).map(c=>c.u));return arts().filter(a=>!used.has(a.u)).map(a=>({k:'a',u:a.u}));}
function chuSlots(){const r=G.run;if(!r.chuOpen)r.chuOpen=4;return Math.min(r.chuOpen,CHU_N[r.realm]||4);}
function chuBlocked(){const r=G.run;return Math.max(0,(CHU_N[r.realm]||4)-chuSlots());}
function chuUnblock(){const r=G.run;if(!chuBlocked()||r.tv<15||r.scene||r.moving)return false;r.tv-=15;advanceTime(6*HM);if(!G.run)return true;r.chuOpen=chuSlots()+1;log('Đả thông một đoạn kinh mạch bị tắc.');autoCheck();saveSoon();return true;}
function chuHuyet(){const r=G.run;const h=hashS('huyet'+r.ten+r.kiep);const a=h%8;let b=(h>>>3)%8;if(b===a)b=(b+3)%8;return [a,b];}
function chuPot(v,i){const n=v.n;const lin=v.links[(i-1+n)%n];return Math.max(0.3,1+(lin===1?0.15:lin===-1?-0.15:lin===2?0.08:0)+(chuHuyet().includes(i)?0.5:0)+(v.dai?0.2:0));}
function chuFx(fx){const r=G.run;if(!r||!r.chu||!r.arts)return;const v=chuView();
  for(let i=0;i<v.n;i++){const it=v.it[i];if(!it)continue;const a=artBy(it.u);for(const x of artFxList(a,chuPot(v,i)))fx[x.k]=(fx[x.k]||0)+x.v;
    const l=v.links[(i-1+v.n)%v.n];if(l)fx.elP[it.el]=(fx.elP[it.el]||0)+(l===1?6:l===2?3:-5);}
  if(v.dai)fx.tvP=(fx.tvP||0)+10;}
function activeArts(){const r=run2();const n=chuSlots();const L=[];for(let i=0;i<n;i++){const a=r.chu[i]&&artBy(r.chu[i].u);if(a)L.push(a);}return L;}
// ----- kỹ năng: gắn chiêu của các môn đang vận hành vào ô dùng trong trận -----
function knAvail(cat){const m={};for(const a of activeArts()){const lv=skLvOf(a);for(const id of artSk(a))if(skCat(SK[id])===cat&&(!m[id]||m[id]<lv))m[id]=lv;}return m;}
function syncSkills(){const r=G.run;if(!r||!r.arts)return;if(!r.kn)r.kn={atk:[],def:[],move:[],ult:[]};const out=[];
  for(const c in CAT_MAX){const av=knAvail(c);let L=(r.kn[c]||[]).filter((id,i,A)=>av[id]&&A.indexOf(id)===i).slice(0,CAT_MAX[c]);
    if(!r.knManual||!r.knManual[c])for(const id of Object.keys(av).sort((x,y)=>SK[y].t-SK[x].t)){if(L.length>=CAT_MAX[c])break;if(!L.includes(id))L.push(id);}
    r.kn[c]=L;for(const id of L)out.push({id,lv:av[id]});}
  r.skills=out;r.atkSlots=r.kn.atk.slice();r.pendingSkill=null;}
function knSet(cat,i,id){const r=G.run;syncSkills();r.knManual=r.knManual||{};r.knManual[cat]=1;const L=r.kn[cat];if(id==null)L.splice(i,1);else{const j=L.indexOf(id);if(j>=0)L.splice(j,1);if(i<L.length)L[i]=id;else L.push(id);}syncSkills();saveSoon();}

// Lực chiến = căn bậc hai của (sức đánh × sức chịu đòn) × hệ số tốc độ × 2.
// Lấy căn bậc hai nên khí huyết gấp đôi thì lực chiến chỉ tăng khoảng 1,4 lần, không vọt lên vì máu nhiều.
// Trang bị, công pháp đã nằm sẵn trong các chỉ số nên được tính luôn.
function lcCalc(o){const atk=Math.max(o.atk||0,o.matk||0);
  const off=atk*(1+(o.crit||0)/100*Math.max(0,(o.critDmg||150)-100)/100)*(1+((o.cx||10)-10)*0.01);
  const surv=((o.maxHp||o.max||1)+0.3*(o.maxMp||0))*(1+Math.max(0,o.def||0)/40)*(1+(o.ne||0)*0.01)*(1+(o.hoTam||0)*0.005);
  const spd=Math.max(0.6,1+(((o.tp||10)+(o.hoi||10))/2-10)*0.02);return Math.round(Math.sqrt(Math.max(0,off*surv))*spd*2);}

// Thang điểm tu vi: tu vi vẫn lưu theo %, đổi ra điểm để hiển thị. Đầy một cảnh giới = số năm bế quan chuẩn × 8640 giờ × 5 điểm.

// Tu vi bỏ xa lịch luyện thì tu vi thực nhận giảm dần (mọi nguồn, kể cả đan dược):
// vượt dưới 20% nhận đủ; 30% còn 70%; 40% còn 35%; 60% còn 10%; từ 70% trở lên chỉ còn 2% (bình cảnh).

const LL_T=[[20,1],[30,.7],[40,.35],[60,.1],[70,.02]],LL_BT=100,LL_MAX=150,LL_CAPE=0.05; // dưới 5% coi như chạm đáy
function llOf(){return (G.run&&G.run.ll)||0;}
function llEff(tv){const ll=llOf();const gap=tv-ll;if(gap<0)return 1+Math.min(0.15,-gap/100*0.5);if(gap<=LL_T[0][0])return 1;
  for(let i=1;i<LL_T.length;i++){const [g1,e1]=LL_T[i-1],[g2,e2]=LL_T[i];if(gap<=g2)return e1+(e2-e1)*(gap-g1)/(g2-g1);}return LL_T[LL_T.length-1][1];}

{const _at10=addTv;addTv=function(x){const r=G.run;if(!(x>0)||!r)return _at10(x);const P=tvPts(r.realm)/100;const raw=tvSimAdd(x)*P+(r.tvAcc||0);const pts=Math.floor(raw+1e-9);r.tvAcc=raw-pts;if(pts<=0)return;

function tuMul(){const a=tuArt();if(!a)return 0;const r=G.run;return TU_M[clamp(a.tier,0,6)]*(a.el!=='vo'&&r.root.els.includes(a.el)?1.1:1);}
function hasTp(){const r=G.run;return arts().some(a=>a.type==='tp')||r.relics.some(x=>x.k==='book'&&x.art&&x.art.type==='tp');}
function tuWhy(){if(tuArt())return '';return arts().some(a=>a.type==='tp')?'Chưa vận hành tâm pháp nào trong Khí Hải: linh khí vào thân rồi lại tản mất.':'Chưa có tâm pháp tu luyện: không biết cách dẫn linh khí vào thân. Tìm ở tạp hóa, tông môn, cao nhân, hoặc chờ cơ duyên.';}
function tuCapWhy(){const r=G.run;const a=tuArt();if(!a||isPham())return '';return tpMax(a)<r.realm+1?a.n+' ('+PHAM[a.tier]+') chỉ đưa tới '+REALM[tpMax(a)]+' viên mãn. Muốn lên '+REALM[clamp(r.realm+1,0,5)]+' phải có tâm pháp '+PHAM[r.realm+1]+' trở lên đang vận hành.':'';}

// Công pháp, tâm pháp đã có yêu cầu riêng (cần cảnh giới mới đọc hiểu, từng tầng có cảnh giới mở). Phương tiện đã có yêu cầu riêng ở trạm dịch.
const LV_NAME=['Phàm nhân'].concat(REALM);
function plv(){const r=G.run;if(!r)return 0;return isPham()?0:clamp((r.realm||0)+1,1,6);}
function relReq(rel){if(!rel||rel.k==='book')return 0;return rel.req!=null?rel.req:clamp(rel.tier||0,0,6);}
function relOk(rel){return plv()>=relReq(rel);}
function relWhy(rel){return relOk(rel)?'':'Cần '+LV_NAME[relReq(rel)]+' mới dùng được '+(rel.name||'món này')+'.';}
phamLock=function(rel){return !!rel&&rel.k!=='book'&&!relOk(rel);};
{const _e30=equip;equip=function(i){const rel=G.run.relics[i];if(rel&&!relOk(rel)){note(relWhy(rel));return;}return _e30(i);};}
{const _et30=equipTo;equipTo=function(i,s){const rel=G.run.relics[i];if(rel&&!relOk(rel)){note(relWhy(rel));return;}return _et30(i,s);};}
{const _dp30=ddPut;ddPut=function(i){const rel=G.run.relics[i];if(rel&&!relOk(rel)){note(relWhy(rel));return false;}return _dp30(i);};}
{const _ea30=eqAuto;eqAuto=function(){const r=G.run;if(!r)return _ea30();const keep=r.relics.filter(x=>!x.seen&&x.k!=='book'&&!relOk(x));keep.forEach(x=>x.seen=1);return _ea30();};}
// đồ đang mặc mà chưa đủ cảnh giới (bản lưu cũ): cất về túi
{const _ef30=eqFix;eqFix=function(){_ef30();const r=G.run;if(!r||!r.eq)return;for(const k in r.eq){const x=r.eq[k];if(x&&!relOk(x)){x.seen=1;r.relics.push(x);r.eq[k]=null;}}
  r.dd=(r.dd||[]).filter(d=>{if(relOk(d.rel))return true;d.rel.seen=1;r.relics.push(d.rel);return false;});};}
{const _r230=run2;run2=function(){const r=_r230();if(r&&!r._eq4){r._eq4=1;eqFix();}return r;};}
// ----- sửa lại: phẩm không gắn với cảnh giới. Mỗi món có yêu cầu cảnh giới riêng, theo nơi nó xuất hiện -----
// Vùng 1 (Phàm Trần): cần Phàm nhân hoặc Luyện Khí; vùng 2: Luyện Khí hoặc Trúc Cơ; vùng 3: Trúc Cơ hoặc Kết Đan… Phẩm nào cũng có thể gặp ở mọi yêu cầu.
// Món cũ chưa có yêu cầu (bản lưu trước): coi như Phàm nhân dùng được.
function relReqRoll(){const r=G.run;const k=clamp((r&&r.region)||0,0,4);return clamp(k+(chance(k===0?0.4:0.5)?1:0),0,6);}
{const _gr31=genRelic;genRelic=function(t){const x=_gr31(t);if(x&&x.req==null)x.req=relReqRoll();return x;};}
relReq=function(rel){if(!rel||rel.k==='book')return 0;return rel.req!=null?rel.req:0;};
// ----- phẩm quyết định SỐ dòng chỉ số, cảnh giới yêu cầu quyết định ĐỘ LỚN chỉ số -----
// Mỗi món giữ chỉ số gốc theo loại (kiếm: công, giáp: thủ…); phẩm càng cao càng thêm nhiều dòng phụ:
//  phàm 0 · hoàng 1 · huyền 1 · địa 2 · thiên 2 · tiên 3 · thần 4 dòng phụ.
// Mọi dòng (gốc và phụ) nhân theo cảnh giới yêu cầu: Phàm nhân ×1 · Luyện Khí ×1,3 · Trúc Cơ ×1,7 · Kết Đan ×2,2 · Nguyên Anh ×2,8 · Hóa Thần ×3,5 · Độ Kiếp ×4,3.
// Nên món thần phẩm cần Trúc Cơ: nhiều dòng, số vừa; món phàm phẩm cần Hóa Thần: một loại chỉ số nhưng số rất lớn.
const REL_X=[0,1,1,2,2,3,4],REL_M=[1,1.3,1.7,2.2,2.8,3.5,4.3];
const REL_POOL={atkP:5,matkP:6,defP:8,hpP:6,mpP:8,tp:1,crit:3,critDmg:8,dodge:3,hoTam:3,van:1,tam:1,ngo:1,regenHp:1,regenMp:2,drain:3,tvP:5};
{const _gr32=genRelic;genRelic=function(t){const x=_gr32(t);if(!x)return x;const n=REL_X[clamp(x.tier||0,0,6)];const keys=Object.keys(REL_POOL).filter(k=>!(k in x.fx));x.fx2={};
  for(const k of shuffle(keys).slice(0,n))x.fx2[k]=REL_POOL[k];x.v2=1;return x;};}
{const _rf32=relicFx;relicFx=function(rel){if(!rel||!rel.v2)return _rf32(rel);const m=REL_M[clamp(rel.req||0,0,6)];const o=_rf32(Object.assign({},rel,{tier:0}));
  for(const k in o){if(['firstEvade','weakStart','vulnStart','pillSlot'].includes(k))continue;o[k]=k==='poisonHit'?Math.round(o[k]*m*100)/100:Math.max(1,Math.round(o[k]*m));}
  for(const [k,v] of Object.entries(rel.fx2||{})){const x=v*m;o[k]=(o[k]||0)+(['tp','van','tam','ngo','regenHp','regenMp'].includes(k)?Math.max(1,Math.round(x)):Math.round(x));}
  return o;};}

let GFX_AUTO=1;
function gfxDetect(){const c=navigator.hardwareConcurrency||4,m=navigator.deviceMemory||4;const mob=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
  GFX_AUTO=(c<=4||m<=3)?0:(mob||c<=6||m<=4)?1:2;
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)GFX_AUTO=Math.min(GFX_AUTO,1);}catch(e){}}

function win(title,body,o){o=o||{};return `<section class="win ${o.cls||''}"><header class="win-h"><h2>${title}</h2>${o.extra||''}${o.noClose?'':`<button class="xb" data-act="${o.close||'closePanel'}" aria-label="Đóng">${ic('close')}</button>`}</header><div class="win-b">${body}</div>${o.foot?`<footer class="win-f">${o.foot}</footer>`:''}</section>`;}
function toastFlush(){const L=G.toasts;if(!L||!L.length)return;const box=$('#toast');if(!box)return;
  for(const t of L){const d=document.createElement('div');d.className='toast '+(t.c||'');d.textContent=t.t;box.appendChild(d);setTimeout(()=>d.remove(),3600);}
  G.toasts=[];while(box.children.length>3)box.firstChild.remove();}

let GLOSS_RE=null;
function gloss(h){if(!GLOSS_RE){const ks=Object.keys(GLOSS).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));GLOSS_RE=new RegExp('(^|[^\\p{L}])('+ks.join('|')+')(?![\\p{L}])','giu');}
  const seen=new Set();return String(h).replace(GLOSS_RE,(m,pre,w)=>{const k=w.toLowerCase();if(seen.has(k))return m;seen.add(k);return `${pre}<span class="gl" data-tip="${esc(w.charAt(0).toUpperCase()+w.slice(1)+': '+GLOSS[k])}">${w}</span>`;});}
function txt(s){return gloss(esc(s));}

function mixHex(a,b,t){const x=hexRGB(a),y=hexRGB(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('');}

// ---------- bế quan: các con số đổi theo thanh trượt ----------
function bqBits(y,I){I=I||bqInfo();const sp=bqSpan(y);const left=Math.max(0,I.left-y);const need=Math.max(0,bqNeedY()-y);const risk=Math.round(bqRisk(y)*100);
  const r=G.run;const P=tvPts(r.realm)/100;const e0=llEff(r.tv),e1=llEff(Math.min(100,r.tv+sp[1]/P));const cap=bqCapY();
  let st,sc;
  if(r.tv>=100){st='Tu vi đã viên mãn, bế quan thêm không tăng tu vi.';sc='';}
  else if(y>0&&cap!=null&&y>cap){st=`Lịch luyện không đủ: bế quan quá ${durH(cap*HY)} thì gần như không tăng thêm tu vi.`;sc='bad';}
  else if(e0<0.5){st='Bình cảnh: tu vi đã bỏ lịch luyện quá xa nên bế quan rất chậm. Hãy ra ngoài đánh trận, đi đây đó.';sc='bad';}
  else if(e0<1||e1<0.9){st='Lịch luyện hơi mỏng: bế quan càng lâu càng chậm dần. Nên xen kẽ ra ngoài lịch luyện.';sc='mid';}
  else if(e0>1){st='Lịch luyện dày dặn: bế quan nhanh hơn bình thường.';sc='ok';}
  else{st='Lịch luyện vững vàng: bế quan bình thường.';sc='ok';}
  return {g:y>0?'~'+fmtN(sp[0])+' – '+fmtN(sp[1])+' tu vi':'0 tu vi',s:st,sc:'bq-'+(sc||'n'),l:Math.floor(left)+' năm',lc:left<=10?'lv-bad':left<=30?'lv-mid':'lv-ok',
    n:I.full?'đã viên mãn':need<=0?'viên mãn':'chừng '+numVN(need)+' năm',h:(y>0?(risk?risk+'% bị quấy nhiễu giữa chừng. ':'Yên ổn, không bị quấy nhiễu. '):'Chọn thời gian bế quan. ')+'Xuất quan thì khí huyết, linh lực hồi đầy.'};}
function bqUpd(y){const B=bqBits(y);const set=(id,t,c)=>{const e=document.getElementById(id);if(e){e.textContent=t;if(c!=null)e.className=c;}};
  set('bqY',y>0?durH(y*HY):'0 tháng');set('bqG',B.g);set('bqS',B.s,'bq-ll '+B.sc);set('bqL',B.l,B.lc);set('bqN',B.n);set('bqHint',B.h);const b=document.getElementById('bqGoB');if(b)b.disabled=!(y>0);
  const R=document.getElementById('bqR');if(R)R.style.setProperty('--val',(+R.max>0?y/+R.max*100:0)+'%');}
function lkTag(n){const m=LK_M[lkOf(n)]*(n&&n.dp?1.15:1)*(G.bqRoom?1.5:1);const c=m>=1.3?'lk-up':m>=0.9?'':m>=0.7?'lk-dn':'lk-bad';
  const t=LK_N[lkOf(n)]+(n&&n.dp?' · có động phủ':'')+(G.bqRoom?' · tĩnh thất tông môn':'');return `<b class="lk ${c}">${t}</b>`;}

function unitKind(u){if(u.kind==='kiep')return 'kiep'+(u.kk?'-'+u.kk:'');if(u.side==='A')return 'nhan';return u.f==='nhan'?'ma':(u.f||'vat');}

// thẻ kẻ địch / đồng hành. compact: chỉ avatar ở giữa, thanh khí huyết, thanh định lực, trạng thái
function unitCard(sc,u,pickMode,compact){
  const dead=u.hp<=0&&!u.immune;const foe=u.side==='B';const tgt=pickMode&&foe&&!dead&&!u.immune;
  const cls=`ucard ${foe?'foe':'ally'}${dead?' dead':''}${tgt?' tg':''}${sc.cur===u.id?' cur':''}${compact?' cmp':''}`;
  const sub=u.sub||(foe?(sc.elite?'Tinh anh':sc.boss?'Thủ lĩnh':'Đối thủ'):'Đồng hành');
  let bars;
  if(u.immune)bars=`<small class="u-s">${sc.kiep?'Đạo '+Math.min(sc.kiep.n,sc.kiep.done+1)+'/'+sc.kiep.n+(sc.kiep.waves>1?' · đợt '+sc.kiep.wave:''):''}${sc.kiep&&sc.kiep.uy<1?' · uy '+Math.round(sc.kiep.uy*100)+'%':''}</small>`;
  else bars=`<div class="brow"${ta('Khí huyết '+Math.max(0,Math.round(u.hp))+' / '+u.max)}>${cBar(Math.max(0,u.hp),u.max,hpCls(u))}${compact?'':`<b>${Math.max(0,Math.round(u.hp))}</b>`}</div><div class="brow thin"${ta('Định lực '+Math.round(dlOf(u))+'%\nTrúng đòn thì giảm. Về 0: choáng, mất một lượt.')}>${cBar(dlOf(u),100,'dl')}</div>`;
  const th=u.fpt?100:clamp(u.than||0,0,100),RC=2*Math.PI*29;const fring=foe&&!u.immune?`<svg class="tl-ring ${u.fpt?'burn':th>=100?'full':''}" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="29"/><circle class="fg" cx="32" cy="32" r="29" stroke-dasharray="${(RC*th/100).toFixed(1)} ${RC.toFixed(1)}"/></svg>`:'';
  const av=`<span class="u-av${foe?' fav':' al'}${u.fpt?' fpt':''}"${ta(foe&&!u.immune?(u.fpt?u.fpt.n+'\nLượt tới nó sẽ tung đòn tối thượng!':'Thần lực '+Math.round(th)+'%\nĐầy thì hiển hóa pháp tướng, lượt sau tung đòn tối thượng.'):(compact?u.name+'\n'+sub:''))}>${fring}<span class="fav-in">${uAvatar(u)}</span>${phBadge(u)}${u.fpt?'<i class="flame"></i>':''}</span>`;
  if(compact)return `<div class="${cls}" id="uc${u.id}"${tgt?` data-act="tgt" data-arg="${u.id}"`:''}>${av}${bars}${stIcons(u.st)}</div>`;

function autoPick(sc){
  const r=G.run,me=mainUnit(sc),s=S();
  if(me.dazed){playerAct('_wait');return;}
  if(!sc.kiep){if(!sc.pt&&(me.than||0)>=100)playerUlt();if(sc.pt&&sc.pt.sk&&(sc.pt.left===1||(sc.pt.left<0&&me.hp<me.max*0.5))){if(playerUlt())return;}}
  if(me.hp<me.max*0.35){const i=r.pills.findIndex(p=>p.id==='hoixuan'||p.id==='baohuyet');if(i>=0){playerPillAct(i);return;}}
  let best='_atk',bp=BASIC.fx.p;
  for(const id of atkSlots()){const sk=SK[id];if(skillCost(sk)<=me.mp&&(sk.fx.p||0)>bp){bp=sk.fx.p;best=id;}}
  if(me.mp<me.maxMp*0.15&&best==='_atk'&&Math.random()<0.3)best='_guard';
  playerAct(best);
}
function combatFrame(now,dt){
  const sc=G.run&&G.run.scene;if(!sc||sc.type!=='combat')return;if(sc.fxq&&sc.fxq.length)fxDrain(sc);
  if(sc.done||UI.panel||UI.modal||document.hidden||now<(UI.fxHold||0))return;
  if(sc.dodge){
    if(!UI.dg||UI.dg.id!==sc.dodge.id){UI.dg={id:sc.dodge.id,t0:now+DG_LEAD*1000,n:sc.dodge.n,T:sc.dodge.T*1000,offs:[],lit:sc.dodge.lit,blk:sc.dodge.blk};}
    const d=UI.dg;if(now>d.t0+d.n*d.T+250){const o=[];for(let k=0;k<d.n;k++)o.push(d.offs[k]==null?null:d.offs[k]);UI.dg=null;dodgeResolve(o);after();}
    return;
  }
  if(sc.critQ){
    if(!UI.cq||UI.cq.id!==sc.critQ.id)UI.cq={id:sc.critQ.id,t0:now};
    if(CFG.autoFight){UI.cq=null;critResolve(chance(.7));after();return;}
    if(now>UI.cq.t0+CQ_T*2){UI.cq=null;critResolve(false);after();}
    return;
  }
  if(sc.qte){
    if(!UI.qt||UI.qt.id!==sc.qte.id)UI.qt={id:sc.qte.id,t0:now};
    if(CFG.autoFight){UI.qt=null;qteResolve(qteMult(0.5+Math.random()*0.3));after();return;}
    if(now>UI.qt.t0+1200){UI.qt=null;qteResolve(null);after();}
    return;
  }
  if(CFG.autoFight&&readyPlayer(sc)){if(!UI.autoT)UI.autoT=now;if(now-UI.autoT>260/(CFG.cspeed||1)){UI.autoT=0;UI.menu=null;UI.pendSk=null;autoPick(sc);after();}return;}
  UI.autoT=0;
  const rev=sc.rev;const sp=CFG.cspeed||1;for(let i=0;i<sp;i++){combatStep(Math.min(dt,0.05));if(!G.run||G.run.scene!==sc||sc.rev!==rev)break;}
  if(!G.run||G.run.scene!==sc||sc.rev!==rev){after();return;}
  for(const u of sc.units){const e=document.getElementById('av'+u.id);if(e)e.style.left=Math.min(100,u.pos)+'%';}
}

  {const me=mainUnit(G.run.scene);const used=d.offs.filter(x=>x!=null).length;if(!d.lit&&!d.blk&&me&&me.tl-used*TL_DODGE<TL_DODGE){const b=$('#dodgeBtn');if(b)b.textContent='Kiệt sức';return;}}

function fxEl(html,x,y,ms,cls,style){const L=$('#fx');if(!L)return null;const d=document.createElement('div');d.className='fxn '+(cls||'');d.style.cssText=`left:${x}px;top:${y}px;${style||''}`;d.innerHTML=html;L.appendChild(d);setTimeout(()=>d.remove(),ms);return d;}
function fxPos(sc,id){const u=sc.units.find(x=>x.id===id);const a=$('#cbArt');const r=a&&a.getBoundingClientRect();
  if(u&&r&&r.height>60){let x,y=0.62;if(u.side==='A'){const al=sc.units.filter(z=>z.side==='A');x=0.3-al.indexOf(u)*0.13;}else{const f=sc.units.filter(z=>z.side==='B');x=0.72+f.indexOf(u)*0.12-(f.length-1)*0.06;if(u.kind==='kiep')y=0.2;}return [r.left+r.width*x,r.top+r.height*y];}
  const c=document.getElementById('uc'+id);if(c){const q=c.getBoundingClientRect();return [q.left+Math.min(q.width/2,60),q.top+q.height/2];}return [innerWidth/2,innerHeight/2];}
function fxShake(big){const f=$('#full');if(!f)return;const c=big?'shk2':'shk';f.classList.remove('shk','shk2');void f.offsetWidth;f.classList.add(c);setTimeout(()=>f.classList.remove(c),big?650:340);}
function fxNum(x,y,t,cls){fxEl(`<b>${t}</b>`,x+(Math.random()*30-15),y-34,1100,'fx-num '+(cls||''));}
function fxSlash(x,y,el,big){const c=FXC[el]||FXC.vo;const rot=Math.round(-50+Math.random()*100);const s=big?1.5:1;
  fxEl(`<svg viewBox="0 0 160 160" style="transform:rotate(${rot}deg) scale(${s})"><path d="M6 96Q78 14 154 58Q78 44 6 96Z" fill="#fff"/><path d="M22 122Q92 60 150 92Q88 82 22 122Z" fill="${c[0]}" opacity=".85"/></svg>`,x,y,420,'fx-slash',`--c:${c[1]}`);}
function fxBurst(x,y,el,big){const c=FXC[el]||FXC.vo;const S0=big?190:120;
  fxEl('',x,y,520,'fx-core',`--c0:${c[0]};--c1:${c[1]};width:${S0}px;height:${S0}px`);
  fxEl('',x,y,560,'fx-ring',`--c0:${c[0]};--c1:${c[1]};width:${S0*0.8}px;height:${S0*0.8}px`);
  if(el==='thuy'||el==='bang')setTimeout(()=>fxEl('',x,y,560,'fx-ring',`--c0:${c[0]};--c1:${c[1]};width:${S0*1.1}px;height:${S0*1.1}px`),120);
  const n=big?18:10;let h='';
  for(let i=0;i<n;i++){const a=Math.random()*6.283,d=(big?90:55)+Math.random()*(big?90:50);let dx=Math.cos(a)*d,dy=Math.sin(a)*d;
    if(el==='hoa')dy=-Math.abs(dy)*1.3;if(el==='tho')dy=Math.abs(dy)*0.9+10;
    h+=`<i class="fx-p p-${el}" style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-delay:${(Math.random()*0.08).toFixed(2)}s"></i>`;}
  fxEl(h,x,y,800,'fx-ps',`--c0:${c[0]};--c1:${c[1]}`);
  if(el==='loi'){let px=0,pts='0,-260';for(let yy=-220;yy<=0;yy+=36){px=yy===0?0:px+(Math.random()*44-22);pts+=` ${px.toFixed(0)},${yy}`;}
    fxEl(`<svg viewBox="-80 -260 160 270" width="160" height="270"><polyline points="${pts}" fill="none" stroke="${c[1]}" stroke-width="9" opacity=".6"/><polyline points="${pts}" fill="none" stroke="#fff" stroke-width="3.5"/></svg>`,x,y,380,'fx-bolt');}
  if(el==='kim')fxEl('<i></i><i></i>',x,y,420,'fx-spark',`--c0:${c[0]}`);
  if(el==='am')fxEl('',x,y,620,'fx-vortex',`--c1:${c[1]};width:${S0}px;height:${S0}px`);
  if(el==='phong')fxEl(`<svg viewBox="0 0 120 120" width="${S0}" height="${S0}"><path d="M10 60A50 50 0 0 1 100 30M110 60A50 50 0 0 1 20 90" fill="none" stroke="${c[0]}" stroke-width="5" stroke-linecap="round"/><path d="M30 60A30 30 0 0 1 84 42M90 60A30 30 0 0 1 36 78" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`,x,y,560,'fx-wind');
  if(el==='phat')fxEl(Array.from({length:8},(_,i)=>`<i style="transform:rotate(${i*45}deg) translateY(-${S0*0.36}px)"></i>`).join(''),x,y,700,'fx-lotus',`--c0:${c[0]};--c1:${c[1]}`);
}
function fxShield(x,y){fxEl(`<svg viewBox="0 0 100 110" width="110" height="120"><path d="M50 4L92 20v34c0 26-18 42-42 52C26 96 8 80 8 54V20z" fill="rgba(120,190,255,.28)" stroke="#bfe3ff" stroke-width="4"/><path d="M50 18L80 30v24c0 18-12 30-30 38-18-8-30-20-30-38V30z" fill="none" stroke="#ffe9a8" stroke-width="2"/></svg>`,x,y,560,'fx-shield');}
function fxOne(sc,e){if(!G.run||G.run.scene!==sc)return;const fx=CFG.anim!==false;const t=sc.units.find(u=>u.id===e.id);const [x,y]=fxPos(sc,e.id);const me=t&&t.isMain;
  if(e.k==='hit'){if(fx){fxSlash(x,y,e.el,e.big);fxBurst(x,y,e.el,e.big);if(e.blk)fxShield(x,y);if(me){fxShake(e.big||e.crit);if(!e.blk&&e.d>0)fxEl('',0,0,450,'fx-vig');}else if(e.big||e.crit)fxShake(false);}
    if(e.blk)fxNum(x,y-26,'Đỡ!','blk');fxNum(x,y,e.d>0?(e.crit?'Bạo kích ':'')+'−'+e.d:'Hộ thể',e.d>0?(e.crit?'crit':me?'dmg me':'dmg'):'blk');
    const c=document.getElementById('uc'+e.id);if(c){c.classList.remove('hitf');void c.offsetWidth;c.classList.add('hitf');}}
  else if(e.k==='dodge'){fxNum(x,y,'Né!','ev');if(fx)fxEl('<i></i><i></i><i></i>',x,y,420,'fx-dash');}
  else if(e.k==='heal'){fxNum(x,y,'+'+e.d,'heal');if(fx)fxEl(Array.from({length:6},(_,i)=>`<i style="left:${(Math.random()*80-40).toFixed(0)}px;animation-delay:${(i*0.07).toFixed(2)}s">+</i>`).join(''),x,y,900,'fx-heal');}
  else if(e.k==='shield'){if(fx)fxShield(x,y);}
  else if(e.k==='daze'){fxNum(x,y-20,'Choáng!','dz');if(fx)fxEl('<i>✦</i><i>✦</i><i>✦</i>',x,y-46,900,'fx-daze');}
}
// hiển hóa pháp tướng: màn hình tối lại, tia tốc độ xoay, pháp tướng khổng lồ trồi lên, tên viết lớn
function fxUlt(el,name){hideTip();const c=FXC[el]||FXC.vo;if(CFG.anim===false){fxNum(innerWidth/2,innerHeight/2,name,'crit');return;}
  fxEl(`<div class="cine-bg"></div><div class="cine-lines"></div><div class="cine-fig">${ptFigSVG()}</div><div class="cine-bar"></div><div class="cine-txt"><small>Thần lực viên mãn</small><b>${esc(name)}</b></div><div class="cine-flash"></div>`,0,0,1750,'fx-cine',`--fc:${c[1]};--fl:${c[0]}`);
  setTimeout(()=>fxShake(true),250);}
// đòn tối thượng: chớp đen, một vệt sáng xé ngang màn hình, sóng xung kích, rung mạnh
function fxStrike(el,name){hideTip();const c=FXC[el]||FXC.vo;if(CFG.anim===false){fxNum(innerWidth/2,innerHeight/2,name,'crit');return;}
  fxEl(`<div class="cine-bg"></div><div class="cine-lines"></div><div class="st-beam"></div><div class="st-beam b2"></div><div class="st-ring"></div><div class="st-ring r2"></div><div class="st-ring r3"></div><div class="cine-txt st"><b>${esc(name)}</b></div><div class="cine-flash late"></div>`,0,0,1500,'fx-cine strike',`--fc:${c[1]};--fl:${c[0]}`);
  setTimeout(()=>fxShake(true),620);setTimeout(()=>fxShake(true),900);}
function fxDrain(sc){const q=sc.fxq;sc.fxq=[];if(!$('#fx')||!q||!q.length)return;const now=performance.now();let delay=0,nh=0;
  for(const e of q){
    if(e.k==='ult'){fxUlt(e.el,e.n);UI.fxHold=now+1500;continue;}
    if(e.k==='strike'){fxStrike(e.el,e.n);delay+=950;UI.fxHold=now+1550;continue;}
    if(e.k==='ptend')continue;
    const d=delay+nh*110;if(e.k==='hit'||e.k==='dodge')nh++;
    if(d)setTimeout(()=>fxOne(sc,e),d);else fxOne(sc,e);}
}
