<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phù Sinh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3E8CC;--bg2:#EADBB4;--paper:#FBF4E2;--ink:#3A3126;--ink2:#7A6A4F;--ink3:#A8987A;
  --gold:#B08638;--gold2:#D8BF85;--line:rgba(122,94,48,.2);--red:#A23B2A;--jade:#4F7B5B;--blue:#4D6D8E;
  --sun:#E4B95A;--tipbg:#3A3126;--tipfg:#F7EDD6;
  --e-kim:#A9832F;--e-moc:#4F7B5B;--e-thuy:#4D6D8E;--e-hoa:#A23B2A;--e-tho:#8A6838;--e-loi:#6A5A9C;--e-bang:#5E95A6;--e-phong:#6F9466;--e-am:#5B4566;--e-phat:#B98A2C;--e-vo:#8C7C60;
  --disp:'Cormorant Garamond','Noto Serif',Georgia,serif;--body:'Spectral','Noto Serif',Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1A13;--bg2:#2A2319;--paper:#2E271D;--ink:#ECDDBC;--ink2:#B3A281;--ink3:#7E705A;
  --gold:#D4AE60;--gold2:#6B5733;--line:rgba(225,195,135,.16);--red:#D2715A;--jade:#86B391;--blue:#8DAACB;--sun:#C79A45;--tipbg:#ECDDBC;--tipfg:#2A2319;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1A13;--bg2:#2A2319;--paper:#2E271D;--ink:#ECDDBC;--ink2:#B3A281;--ink3:#7E705A;
  --gold:#D4AE60;--gold2:#6B5733;--line:rgba(225,195,135,.16);--red:#D2715A;--jade:#86B391;--blue:#8DAACB;--sun:#C79A45;--tipbg:#ECDDBC;--tipfg:#2A2319;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:400 17px/1.75 var(--body);
  background:var(--bg) radial-gradient(ellipse 90% 55% at 50% 0%,var(--paper),transparent 70%) no-repeat;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
#app{max-width:620px;margin:0 auto;padding:0 22px 72px}
.dark .scape,[data-theme="dark"] .scape{filter:brightness(.5) saturate(.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scape{filter:brightness(.5) saturate(.7)}}

/* thanh trạng thái */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -22px;padding:10px 22px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.realm{font:600 1.12rem/1.2 var(--disp);letter-spacing:.02em;color:var(--ink)}
.icons{display:flex;gap:2px}
.icons button{background:none;border:0;font-size:1.12rem;width:40px;height:40px;border-radius:50%;filter:grayscale(.25)}
.icons button:hover{background:rgba(176,134,56,.12)}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;padding:4px 0 6px;color:var(--ink2)}
.st{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap;cursor:help}
.st b{color:var(--ink);font-weight:500}.st i{font-style:normal;color:var(--ink3)}
.st.warn b{color:var(--red)}
.bars{display:grid;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.hb{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.hb i{display:block;height:100%;transition:width .45s ease}
.hb.hp i{background:var(--red)}.hb.mp i{background:var(--blue)}

/* tranh phong cảnh */
.banner{position:relative;height:180px;margin:0 -22px 6px;overflow:hidden}
.banner.sm{height:130px}
.scape{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.seal{position:absolute;left:22px;top:20px;width:34px;height:34px;display:grid;place-items:center;background:var(--red);color:#F8EBD6;font:600 1.05rem/1 'Noto Serif SC','Songti SC',serif;border-radius:3px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);cursor:help}
.reg{position:absolute;left:66px;top:24px;font:italic 500 1.02rem/1.2 var(--disp);color:var(--ink2)}
.vt{position:absolute;right:22px;top:16px;writing-mode:vertical-rl;font:600 1.6rem/1.15 var(--disp);letter-spacing:.18em;color:var(--ink);text-shadow:0 0 14px var(--bg),0 0 4px var(--bg);max-height:160px}
.banner.sm .vt{font-size:1.3rem;max-height:116px}

/* truyện */
.story{max-width:34em}
.story p{margin:0 0 1.05em}
.story p.old{color:var(--ink2)}
.story p.q{font-style:italic;color:var(--ink3);font-size:.92rem;margin:-.2em 0 .7em;padding-left:14px;border-left:2px solid var(--gold2)}
.story p.new{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding-top:28px}
.news{font-size:.88rem;font-style:italic;color:var(--ink2);margin:-.2em 0 1.2em;padding:8px 0 8px 14px;border-left:2px solid var(--line)}
.hint{color:var(--ink3);font-size:.88rem;margin:.4em 0 .8em}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:999px;background:rgba(176,134,56,.11);font-size:.86rem;line-height:1.7;cursor:help}
.chip.up{color:var(--jade)}.chip.dn{color:var(--red)}.chip.item{box-shadow:inset 0 0 0 1px var(--gold2);color:var(--ink)}
.chip.lockc{color:var(--ink3);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* lựa chọn */
.choices{margin:6px 0 0}
.ch{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:15px 6px;line-height:1.45;transition:background .15s}
.ch:last-child{border-bottom:1px solid var(--line)}
.ch:hover:not(:disabled){background:rgba(176,134,56,.08)}
.ch:disabled{opacity:.45}
.ch.hl .ct{font-weight:500}.ch.soft{color:var(--ink2)}
.ci{flex:0 0 1.9em;text-align:center;font-size:1.2rem}
.ct{flex:1}
.cx{flex:none;font-size:.8rem;color:var(--ink2);white-space:nowrap;padding:1px 8px;border-radius:999px;background:rgba(176,134,56,.1)}
.cx.chk{color:var(--blue)}.cx.no{color:var(--red)}
.gorow{display:flex;justify-content:center;margin:26px 0 8px}
.go{background:none;border:1px solid var(--gold);border-radius:999px;padding:9px 34px;font:600 1.18rem/1.4 var(--disp);letter-spacing:.04em;transition:background .2s,color .2s}
.go:hover{background:var(--gold);color:var(--paper)}

/* lối rẽ */
.prog{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.pd{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--ink3)}
.pd.done{background:var(--ink3);box-shadow:none}.pd.now{background:var(--gold);box-shadow:0 0 0 3px rgba(176,134,56,.2)}
.pd.boss{width:auto;height:auto;box-shadow:none;font-size:.85rem;opacity:.5}.pd.boss.on{opacity:1}
.paths{display:grid;gap:12px;margin-top:6px}
.path{display:flex;align-items:center;gap:16px;text-align:left;background:none;border:0;padding:12px 4px;border-radius:12px;transition:background .15s}
.path:hover{background:rgba(176,134,56,.08)}
.pi{flex:none;width:52px;height:52px;display:grid;place-items:center;font-size:1.45rem;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px var(--gold2)}
.pt{flex:1;display:flex;flex-direction:column}
.pt b{font:600 1.22rem/1.25 var(--disp)}
.pt small{color:var(--ink3);font-size:.82rem}
.pv{flex:none;font-size:.85rem;color:var(--ink2)}

/* chiến đấu */
.foe{text-align:center;padding:10px 0 6px}
.foe-ic{position:relative;display:inline-grid;place-items:center;width:104px;height:104px;font-size:3.4rem;border-radius:50%;background:radial-gradient(circle,var(--paper) 55%,var(--bg2));box-shadow:inset 0 0 0 1px var(--gold2);margin:8px 0 6px}
.foe-ic.elite{box-shadow:inset 0 0 0 2px var(--red)}
.foe-ic.boss{width:124px;height:124px;font-size:4rem;box-shadow:inset 0 0 0 2px var(--gold),0 0 0 6px rgba(176,134,56,.12)}
.intent{position:absolute;right:-30px;top:-4px;font-size:.84rem;font-family:var(--body);background:var(--paper);border-radius:999px;padding:2px 10px;box-shadow:inset 0 0 0 1px var(--red);color:var(--red);white-space:nowrap;cursor:help}
.foe-n{font:600 1.5rem/1.2 var(--disp)}
.foe-sub{font-size:.85rem;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
.foe-hp{display:flex;align-items:center;gap:10px;max-width:280px;margin:10px auto 0;font-size:.8rem;color:var(--ink2)}
.foe-hp .hb{flex:1;height:5px}
.sts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:22px;margin-top:6px}
.si{font-size:.85rem;cursor:help}.si b{font-weight:500;font-size:.75rem;margin-left:1px}
.clog{min-height:120px;margin:10px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.92rem}
.clog p{margin:0 0 3px}.clog p.old{color:var(--ink3)}
.clog .me{color:var(--blue)}.clog .en{color:var(--ink)}.clog .dot{color:var(--jade)}.clog .win{color:var(--gold)}.clog .fl{font-style:italic;color:var(--ink2)}
.me .me-row{display:flex;align-items:center;gap:10px;font-size:.85rem}
.me .hb{flex:1;height:5px}.me b{font-weight:500;min-width:3.2em;text-align:right}
.me .sts{justify-content:flex-start}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}
.sk{display:flex;align-items:center;gap:9px;text-align:left;background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:10px 12px;line-height:1.3;font-size:.93rem}
.sk:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--gold)}
.sk:disabled{opacity:.42}
.sk .sn{flex:1}.sk i{font-style:normal;color:var(--gold);font-size:.8rem}
.sk small{color:var(--blue);font-size:.78rem}
.acts{display:flex;gap:8px}
.acts button{flex:1;background:none;border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:8px 6px;font-size:.9rem}
.acts button:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--gold)}
.acts button:disabled{opacity:.4}.acts i{font-style:normal;color:var(--ink3)}
.tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tray button{background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--gold2);border-radius:999px;padding:5px 12px;font-size:.86rem}
.cres{text-align:center;font:600 1.6rem/1.2 var(--disp);margin:18px 0 0}
.cres.win{color:var(--gold)}.cres.dead{color:var(--red)}

.el{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;font:500 .78rem/1 'Noto Serif SC','Songti SC',serif;color:#FBF3E2;background:var(--e-vo);flex:none;cursor:help;vertical-align:middle}
.el+.el{margin-left:2px}
.el-kim{background:var(--e-kim)}.el-moc{background:var(--e-moc)}.el-thuy{background:var(--e-thuy)}.el-hoa{background:var(--e-hoa)}.el-tho{background:var(--e-tho)}.el-loi{background:var(--e-loi)}.el-bang{background:var(--e-bang)}.el-phong{background:var(--e-phong)}.el-am{background:var(--e-am)}.el-phat{background:var(--e-phat)}

/* thưởng, phường thị */
.picks,.shop{display:grid;gap:8px}
.pick,.srow{display:flex;align-items:center;gap:14px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;line-height:1.35}
.shop .srow:last-child{border-bottom:1px solid var(--line)}
.pick:hover:not(:disabled),.srow:hover:not(:disabled){background:rgba(176,134,56,.08)}
.pick.taken{box-shadow:inset 3px 0 0 var(--gold)}.pick.dim,.srow:disabled{opacity:.45}.srow.sold{opacity:.4}
.pk-i{flex:0 0 2.2em;text-align:center;font-size:1.35rem}
.pk-t{flex:1;display:flex;flex-direction:column}.pk-t b{font-weight:500}.pk-t small{color:var(--ink3);font-size:.82rem}
.price{font-size:.88rem;color:var(--ink2);white-space:nowrap}

/* màn đầu, đầu thai, kết kiếp */
.title{position:relative;min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:0 -22px;padding:0 22px}
.title .scape{position:absolute;left:0;right:0;bottom:0;top:auto;height:56%;-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
.title h1{position:relative;font:600 clamp(4rem,17vw,6.6rem)/1 var(--disp);letter-spacing:.06em;margin:0}
.title .sub{position:relative;font:italic 500 1.2rem/1.5 var(--disp);color:var(--ink2);margin:.6em 0 2.4em}
.tbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;margin:18px 0}
.lnk{background:none;border:0;color:var(--ink2);font-size:.95rem;padding:6px 10px}
.lnk:hover{color:var(--ink)}.lnk b{color:var(--gold);font-weight:500}
.h{font:600 1.9rem/1.2 var(--disp);margin:0 0 18px}
.fates{display:grid;gap:14px}
.fate{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:18px 20px;line-height:1.35;transition:box-shadow .2s}
.fate:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.f-n{font:600 1.5rem/1.2 var(--disp);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.f-n small{font:400 .82rem var(--body);color:var(--ink3)}
.f-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.95rem}
.f-r small{width:100%;color:var(--ink3);font-size:.8rem;margin-left:1.9em}
.over{position:relative;text-align:center;padding-top:40px}
.over .scape{position:relative;display:block;height:150px;width:calc(100% + 44px);margin:0 -22px}
.over h1{font:600 3.2rem/1.1 var(--disp);margin:10px 0 6px}
.ep{font:italic 500 1.15rem/1.5 var(--disp);color:var(--ink2);margin:0 0 26px}
.bio{text-align:left;margin:0 auto}
.pts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:20px 0 0}
.meta .pts-big{font:600 3rem/1 var(--disp);color:var(--gold);text-align:center;cursor:help}
.meta .hint{text-align:center}
.upg{margin-top:20px}
.ur{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--line)}
.ur:last-child{border-bottom:1px solid var(--line)}
.ui{font-size:1.25rem;flex:0 0 1.8em;text-align:center}
.ut{flex:1;display:flex;flex-direction:column;line-height:1.35}.ut b{font-weight:500}.ut small{color:var(--ink3);font-size:.82rem}
.pips{color:var(--gold);font-size:.7rem;letter-spacing:.2em;margin-top:2px}
.buy{background:none;border:0;box-shadow:inset 0 0 0 1px var(--gold);border-radius:999px;padding:4px 14px;font-size:.88rem;white-space:nowrap}
.buy:hover:not(:disabled){background:var(--gold);color:var(--paper)}.buy:disabled{opacity:.35;box-shadow:inset 0 0 0 1px var(--line)}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 12px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.life{padding:10px 2px;border-bottom:1px solid var(--line)}
.life summary{cursor:pointer;display:flex;flex-direction:column;list-style:none}
.life summary::-webkit-details-marker{display:none}
.life summary b{font:600 1.2rem/1.3 var(--disp)}.life summary small{color:var(--ink3);font-size:.82rem}
.life p{margin:.6em 0 0;font-size:.95rem}.life .ep{margin:.6em 0 0;font-size:1rem}
.life.lock{color:var(--ink3);text-align:center}
.achs{display:flex;flex-wrap:wrap;gap:8px}

/* bảng phụ */
#sheet{position:fixed;inset:0;z-index:20}
#sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(40,30,15,.32);border:0;width:100%}
.sheet-panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);max-height:84vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:22px 24px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(60,40,10,.18);animation:up .28s ease}
@keyframes up{from{transform:translate(-50%,24px);opacity:.5}to{transform:translate(-50%,0);opacity:1}}
.sh{font:600 1.6rem/1.2 var(--disp);margin:0 0 2px}
.sheet-panel h4{font:600 1.1rem var(--disp);margin:20px 0 6px;color:var(--ink2)}
.sheet-panel h4 small{font:400 .8rem var(--body);color:var(--ink3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
.sr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem;cursor:help}
.sr span:first-child{width:1.5em;text-align:center}.sr span:nth-child(2){flex:1;color:var(--ink2)}.sr b{font-weight:500}
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem;cursor:help}
.li span:nth-child(2){flex:1}.li small{color:var(--ink3);font-size:.8rem}.li i{font-style:normal;color:var(--gold);font-size:.8rem}
.li.me{color:var(--gold)}.li.dead{opacity:.45;text-decoration:line-through}
.logl{font-size:.9rem;max-height:56vh;overflow:auto}
.logl p{margin:0;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.logl span{flex:0 0 2.4em;color:var(--ink3);text-align:right}
textarea{width:100%;margin-top:12px;font:400 .8rem/1.4 ui-monospace,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}

#tip{position:fixed;z-index:50;max-width:min(300px,86vw);background:var(--tipbg);color:var(--tipfg);font-size:.84rem;line-height:1.5;padding:9px 13px;border-radius:10px;white-space:pre-line;pointer-events:none;box-shadow:0 8px 24px rgba(40,25,5,.25)}
#tip[hidden]{display:none}
@media (max-width:420px){body{font-size:16.5px}#app{padding:0 18px 64px}#top,.banner,.title{margin-left:-18px;margin-right:-18px}#top{padding-left:18px;padding-right:18px}.skills{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr}.intent{right:-22px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><header id="top" hidden></header><main id="stage"></main></div>
<div id="sheet" hidden><button class="sheet-bg" data-act="closeSheet" aria-label="Đóng"></button><div class="sheet-panel" id="sheetBody"></div></div>
<div id="tip" role="tooltip" hidden></div>
<script>
// ================= KHO CHỮ =================

const R = Math.random;
const ri = (a,b)=>a+Math.floor(R()*(b-a+1));
const pick = a=>a[Math.floor(R()*a.length)];
const chance = p=>R()<p;
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const rnd1 = x=>Math.round(x*10)/10;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wIdx(arr){let t=0;arr.forEach(x=>t+=(x.w==null?1:x.w));let r=R()*t;for(let i=0;i<arr.length;i++){r-=(arr[i].w==null?1:arr[i].w);if(r<=0)return i;}return arr.length-1;}
function wpick(arr,wf){let t=0;arr.forEach(x=>t+=wf(x));let r=R()*t;for(const x of arr){r-=wf(x);if(r<=0)return x;}return arr[arr.length-1];}

const BAG = {};
function bagPick(key,arr){let b=BAG[key];if(!b||!b.length){b=BAG[key]=shuffle([...arr.keys()]);}const i=b.pop();return arr[i<arr.length?i:0];}
function gp(o,path){return path.split('.').reduce((x,k)=>x==null?undefined:x[k],o);}
function capS(s){return s.replace(/(^|[.!?…:]\s+|“|\n)([a-zà-ỹđ])/g,(m,a,b)=>a+b.toUpperCase());}
function T(s,v){
  if(Array.isArray(s)) s=s.length?bagPick('_t'+s[0].slice(0,24),s):'';
  if(s==null) return '';
  v=v||{};
  let out=String(s), g=0;
  while(g++<8 && /[\[{]/.test(out)){
    const b4=out;
    out=out.replace(/\[([^\[\]{}]*?\|[^\[\]{}]*?)\]/g,(_,a)=>pick(a.split('|')));
    out=out.replace(/\{(\$?)([\w.]+)\}/g,(m,d,k)=>{
      if(d){const x=gp(v,k);return x!=null?String(x):'';}
      const pool=P[k];return pool?bagPick(k,pool):m;
    });
    if(out===b4)break;
  }
  return capS(out.replace(/\s+([,.!?])/g,'$1').replace(/ {2,}/g,' ').trim());
}
const up1 = s=>s?s[0].toUpperCase()+s.slice(1):s;
const lc1 = s=>s?s[0].toLowerCase()+s.slice(1):s;

function genWorld(){
  const used=new Set();

  const sects=[mk('chinh','kiem'),mk('chinh','dan'),mk('chinh','dao'),mk('chinh',pick(['tran','khi','phu'])),mk('ma','ma'),mk('ma','am'),mk('phat','phat')];

  const rivals=[];const usedN=new Set();

    const tt={kiem:g==='nam'?'kiếm tử':'kiếm tiên tử',dan:g==='nam'?'đan tử':'đan tiên tử',phat:'phật tử',ma:g==='nam'?'ma tử':'yêu nữ',am:g==='nam'?'quỷ tử':'âm nữ',the:g==='nam'?'thiếu chủ':'đại tiểu thư',thu:g==='nam'?'thú vương tử':'linh thú tiên tử'}[s.kind]||(g==='nam'?'thánh tử':'thánh nữ');
    rivals.push({ten,g,s:i%sects.length,tt,el:pick(['kim','moc','thuy','hoa','tho','loi','bang','phong']),tinh:s.al==='ma'?pick(['hiem','hiem','loi']):pick(['nghia','nghia','loi','hiem']),tal:rnd1(0.85+R()*0.55)});
  }
  return {quoc:pick(['Lương Quốc','Triệu Quốc','Đại Tề','Tây Lương','Bắc Yến','Nam Chiếu','Đại Hạ','Việt Quốc','Đại Chu']),sects,rivals};
}

function pView(){const r=G.run;return {ten:r.ten,cn:r.g==='nam'?'công tử':'cô nương',ht:r.g==='nam'?'huynh đài':'cô nương',dh:r.g==='nam'?'huynh':'tỷ',sd:r.g==='nam'?'sư đệ':'sư muội',tt:r.g==='nam'?'tiểu tử':'nha đầu',ong:r.g==='nam'?'ông lão':'bà lão'};}
function rootView(r){const R0=ROOT.find(x=>x.id===r.id);return {n:R0.n,els:r.els,m:R0.m};}
function relicFx(rel){
  const o={};const m=TM[rel.tier||0];
  for(const [k,v] of Object.entries(rel.fx||{})){
    if(['firstEvade'].includes(k)) o[k]=v+((rel.tier||0)>=3?1:0);
    else if(['weakStart','vulnStart'].includes(k)) o[k]=v+Math.floor((rel.tier||0)/2);
    else if(['pillSlot'].includes(k)) o[k]=v;
    else if(k==='poisonHit') o[k]=rnd1(v*m*100)/100;
    else o[k]=Math.round(v*m);
  }
  return o;
}
function aggFx(){
  const r=G.run, fx={elP:{}};
  const add=(src)=>{if(!src)return;for(const[k,v]of Object.entries(src)){if(k==='elP'){for(const[e,x]of Object.entries(v))fx.elP[e]=(fx.elP[e]||0)+x;}else fx[k]=(fx[k]||0)+v;}};
  const og=ORIGIN.find(o=>o.id===r.origin);add(og&&og.fx);
  const tr=TRAIT.find(t=>t.id===r.trait);add(tr&&tr.fx);
  for(const rel of r.relics){const f=relicFx(rel);if(f.elX){fx.elP[rel.el]=(fx.elP[rel.el]||0)+f.elX;delete f.elX;}add(f);}
  add({hpP:U('hp')*8,mpP:U('mp')*10,ngo:U('ngo')*2,tam:U('tam')*3,van:U('st'),lifeP:U('tho')*6,pillSlot:U('tui')*2});
  return fx;
}
function tieu(){const t=G.run.tv;return t>=100?3:t>=66?2:t>=33?1:0;}
function S(){
  const r=G.run, fx=aggFx(), b=r.bon, k=tieu()*0.18, R0=r.realm;
  const lerp=(a)=>a[R0]+(a[R0+1]-a[R0])*k;
  const dq=r.realm>=2?[1,1.05,1.12,1.25][r.danQ||0]:1;
  const s={fx};
  s.maxHp=Math.round(lerp(TAB.hp)*(1+((fx.hpP||0)+b.hpP)/100)*dq);
  s.maxMp=Math.round(lerp(TAB.mp)*(1+((fx.mpP||0)+b.mpP)/100)*dq);
  s.atk=Math.round(lerp(TAB.atk)*(1+((fx.atkP||0)+b.atkP)/100)*dq);
  s.def=Math.round(lerp(TAB.def)*(1+((fx.defP||0)+b.defP)/100)*dq);
  s.tp=r.base.tp+b.tp+(fx.tp||0)+R0*2; s.ngo=r.base.ngo+b.ngo+(fx.ngo||0)+R0*2;
  s.van=r.base.van+b.van+(fx.van||0); s.tam=r.base.tam+b.tam+(fx.tam||0)+R0*2;
  s.crit=5+s.van*0.5+(fx.crit||0); s.dodge=Math.min(40,s.tp*0.8+(fx.dodge||0));
  s.life=Math.round(LIFE[R0]*(1+(fx.lifeP||0)/100)+r.lifeAdj);
  s.pillMax=5+(fx.pillSlot||0);
  s.tvM=rootView(r.root).m*(1+s.ngo/60)*(1+(fx.tvP||0)/100);
  return s;
}

function dmgCalc(atk,rage,weak,def,vuln,power,mult,pierce){

function absorb(st,d){if(st.block>0){const a=Math.min(st.block,d);st.block-=a;d-=a;}return d;}
function elemMult(skEl,enEl){const r=G.run,fx=aggFx();let m=1;

function playerSkill(id){
  const r=G.run,sc=r.scene;if(!sc||sc.type!=='combat'||sc.over)return;
  const en=sc.en,s=S(),fx=s.fx;
  const own=id==='_atk'?{id,lv:1}:r.skills.find(x=>x.id===id);if(!own)return;
  const sk=id==='_atk'?BASIC:SK[id];const f=sk.fx;const lvM=1+0.25*(own.lv-1);

  let total=0,hits=0;

      let d=dmgCalc(s.atk,sc.ps.rage,sc.ps.weak,en.def,en.st.vuln,f.p,mult,f.pierce);
      d=absorb(en.st,d);en.hp-=d;total+=d;hits++;

  }
  if(fx.drain&&total)r.hp=Math.min(s.maxHp,r.hp+Math.round(total*fx.drain/100));
  if(f.poison)en.st.poison=(en.st.poison||0)+Math.round(s.atk*f.poison*lvM);
  if(f.burn)en.st.burn=(en.st.burn||0)+Math.round(s.atk*f.burn*lvM);
  if(f.weak)en.st.weak=Math.max(en.st.weak||0,f.weak);
  if(f.vuln)en.st.vuln=Math.max(en.st.vuln||0,f.vuln);
  if(f.block)sc.ps.block=(sc.ps.block||0)+Math.round(s.atk*f.block*lvM);
  if(f.heal)r.hp=Math.min(s.maxHp,r.hp+Math.round(s.maxHp*f.heal*lvM/100));

  let msg=sk.n;if(total)msg+=`: ${total}`+(hits>1?` (${hits} đòn)`:'');

function tickDot(st,max,name,isPlayer){

function enemyTurn(){
  const r=G.run,sc=r.scene,en=sc.en,s=S();

  if(dot){en.hp-=dot;clog(sc,`${en.n} trúng độc/thiêu: ${dot}`,'dot');if(en.hp<=0){winCombat();return;}}

  if(en.st.stun>0){en.st.stun=0;clog(sc,`${en.n} bị choáng, không thể ra tay.`,'en');}
  else doIntent(sc);
  if(en.st.weak>0)en.st.weak--;

  // lượt người chơi bắt đầu
  sc.turn++;

  if(sc.ps.vuln>0)sc.ps.vuln--;if(sc.ps.weak>0)sc.ps.weak--;
  r.hp=Math.round(r.hp);
  nextIntent(sc);
  if(sc.ps.stun>0){sc.ps.stun=0;clog(sc,'Ngươi bị choáng, mất một lượt.','en');enemyTurn();}

function doIntent(sc){
  const r=G.run,en=sc.en,s=S(),it=en.intent;
  const V=(VERB[en.boss?'boss':en.f]||VERB.vat);
  const vb=(k)=>T((V[k]||V.atk)).replace('{e}',en.n);
  const say=(k)=>(VERB2[k]||'{e} ra tay').replace('{e}',en.n);
  const hit=(p,n)=>{let tot=0,ev=0;for(let i=0;i<(n||1);i++){
      if(sc.ps.evade>0){sc.ps.evade--;ev++;continue;}
      if(chance(s.dodge/100)){ev++;continue;}
      let d=dmgCalc(en.atk,en.st.rage,en.st.weak,s.def,sc.ps.vuln,p,1,0);
      d=absorb(sc.ps,d);r.hp-=d;tot+=d;
      if(s.fx.reflect&&d>0){en.hp-=Math.round(d*s.fx.reflect/100);}
    }return {tot,ev};};
  const fmt=(o)=>o.tot?`${o.tot}`+(o.ev?` (né ${o.ev})`:''):(o.ev?'né được':'bị hộ thể chặn');
  let o;
  switch(it){
    case 'atk':o=hit(1);clog(sc,`${vb('atk')}: ${fmt(o)}`,'en');break;
    case 'multi':o=hit(0.5,r.region>=2?3:2);clog(sc,`${vb('multi')}: ${fmt(o)}`,'en');break;
    case 'heavy':o=hit(2.2);clog(sc,`${vb('heavy')}: ${fmt(o)}`,'en');break;
    case 'charge':en.st.charged=1;clog(sc,say('charge'),'en');break;
    case 'block':en.st.block=(en.st.block||0)+Math.round(en.atk*1.3);clog(sc,say('block'),'en');break;
    case 'rage':en.st.rage=(en.st.rage||0)+1;clog(sc,say('rage'),'en');break;
    case 'poison':o=hit(0.5);if(!s.fx.poisonImm)sc.ps.poison=(sc.ps.poison||0)+Math.round(en.atk*0.45);clog(sc,`${say('poison')}: ${fmt(o)}`,'en');break;
    case 'burn':o=hit(0.6);sc.ps.burn=(sc.ps.burn||0)+Math.round(en.atk*0.6);clog(sc,`${say('burn')}: ${fmt(o)}`,'en');break;
    case 'weak':o=hit(0.5);sc.ps.weak=2;clog(sc,`${say('weak')}: ${fmt(o)}`,'en');break;

function genPicks(kind){
  const r=G.run,n=3+U('duyen');const out=[];const reg=r.region;
  const relT=clamp(reg+(kind==='boss'?1:0)+(kind==='elite'&&chance(.4)?1:0),0,4);
  for(let i=0;i<n;i++){
    let k;
    if(kind==='boss')k=i<2?'relic':pick(['relic','skill']);
    else if(kind==='elite')k=i===0?'relic':pick(['relic','skill','pill']);
    else k=pick(['skill','pill','pill','st','relic']);
    if(k==='relic')out.push({k,rel:genRelic(relT)});
    else if(k==='skill'){let id,g=0;do{id=rollSkill(kind==='boss'?[1,2,3,4,4][reg]:null);}while(out.some(o=>o.id===id)&&g++<10);out.push({k,id});}
    else if(k==='pill')out.push({k,id:rollPill(),q:reg>=3?ri(1,2):reg>=1?ri(0,1):0});
    else out.push({k:'st',n:Math.round(ri(18,30)*SC[reg])});
  }
  return out;
}
function rewardScene(kind,en){
  const r=G.run;
  const base={normal:{tv:7,st:9},elite:{tv:15,st:22},boss:{tv:25,st:55}}[kind];
  const chips=applyE({tv:base.tv,st:base.st+ri(-3,4)});
  if(kind==='boss'){const s=S();r.hp=Math.min(s.maxHp,r.hp+Math.round(s.maxHp*0.5));r.mp=s.maxMp;}
  const picks=(kind!=='normal'||chance(.55))?genPicks(kind):[];
  const text=kind==='boss'?T(['{$e} ngã xuống, đất trời như lặng đi một nhịp. Ngươi đứng giữa chiến trường, gió thổi tung vạt áo.','Đòn cuối cùng. {$e} gục xuống, không còn đứng dậy. Ngươi thở ra một hơi dài, như trút được cả một vùng trời.'],{e:en.n})
    :T(['{$e} không còn động đậy. Ngươi lục lọi chiến trường.','Trận chiến kết thúc. Ngươi chỉnh lại y phục, nhặt nhạnh những gì còn dùng được.','{$e} gục xuống. Bụi lắng, máu thấm vào đất.','Một trận ác chiến. Ngươi thắng, nhưng không vui lắm.','Kết thúc nhanh gọn. {$e} thậm chí chưa kịp kêu.'],{e:en.n});
  r.scene={type:'reward',kind,text,chips,picks,taken:-1};
}
function takePick(i){

function genPaths(){
  const r=G.run,reg=REG[r.region];
  if(r.step>=STEPS)return [{type:'boss',place:{n:bossPlace(),t:pick(reg.types)}}];
  const n=chance(.3)?2:3;const opts=[];const usedT=new Set();
  const W={event:46,combat:24,elite:r.step>=3?10:0,shop:r.step>=2?9:0,rest:r.step>=2?12:0};
  for(let i=0;i<n;i++){
    let t=wpick(Object.keys(W),k=>W[k]*(usedT.has(k)?(k==='event'?0.5:0.15):1));usedT.add(t);
    if(i===n-1&&r.step===STEPS-1&&!opts.some(o=>o.type==='rest'))t='rest';
    let pt=pick(reg.types);if(t==='shop')pt=reg.types.includes('thanh')?'thanh':pick(reg.types);if(t==='rest')pt=pick(['nui','dong','rung'].filter(x=>reg.types.includes(x)).concat(reg.types.slice(0,1)));
    const o={type:t,place:{n:placeName(pt),t:pt}};
    if(t==='combat'||t==='elite'){const sv=r.place;r.place=o.place;o.en=mkEnemy({elite:t==='elite'});r.place=sv;}
    if(t==='event'&&U('nhan')){o.ev=pickEvent(pt);}
    opts.push(o);
  }
  return opts;
}

function lifeSummary(cause,info){
  const r=G.run;const age=Math.floor(r.age);
  const lines=r.bio.slice(0,6);
  let end='';
  if(cause==='combat')end=`Năm ${age} tuổi, ${r.ten} chết dưới tay ${info.n} ở ${r.place.n}.`;
  else if(cause==='toahoa')end=`Năm ${age} tuổi, thọ nguyên cạn kiệt, ${r.ten} tọa hóa ở ${r.place.n}.`;
  else if(cause==='tamma')end=`Năm ${age} tuổi, ${r.ten} tẩu hỏa nhập ma.`;
  else if(cause==='quyan')end=`Năm ${age} tuổi, ${r.ten} gác kiếm quy ẩn ở ${r.place.n}, sống nốt phần đời còn lại như một phàm nhân.`;
  else if(cause==='phithang')end=`Năm ${age} tuổi, ${r.ten} vượt Cửu Trùng Lôi Kiếp, phá không phi thăng.`;
  lines.push(end+(cause==='combat'||cause==='toahoa'?' '+pick(['Một đời tu tiên, như bao người khác.','Không ai kịp nhớ tên.','Người đời nhắc tới vài năm, rồi quên.','Tiên lộ dài, chân người ngắn.']):''));
  return lines;
}
function calcPts(cause){
  const r=G.run;const o=[];
  o.push(['Cảnh giới',r.maxRealm*12+Math.floor(r.tv/25)]);
  o.push(['Vùng đất đã qua',r.region*6]);
  o.push(['Thủ lĩnh bị hạ',r.bossKills*8]);
  o.push(['Kẻ địch bị hạ',Math.floor(r.kills/3)]);
  o.push(['Kỳ ngộ đã trải',Math.floor(r.evDone/4)]);
  if(cause==='phithang')o.push(['Phi thăng',80]);
  if(cause==='quyan')o.push(['Quy ẩn an lành',4]);
  return o.filter(x=>x[1]>0);
}
function die(cause,info){
  const r=G.run;if(!r)return;
  const pts=calcPts(cause);const tot=pts.reduce((a,b)=>a+b[1],0)+1;
  const lines=lifeSummary(cause,info);
  const ep=T('{epitaph}');
  const life={k:r.kiep,ten:r.ten,g:r.g,tuoi:Math.floor(r.age),realm:REALM[r.maxRealm],cause,lines,ep,pts:tot,origin:r.origin};
  const M=G.meta;M.lives.unshift(life);if(M.lives.length>40)M.lives.pop();
  M.pts+=tot;M.total+=tot;
  M.last={grave:cause!=='phithang'?{ten:r.ten,tuoi:Math.floor(r.age),r:r.region}:null,killer:cause==='combat'&&info&&!info.boss&&info.k?{n:info.n,k:info.k,i:info.i,el:info.el,r:r.region}:(cause==='combat'&&info&&info.boss?{n:info.n,k:'boss',i:info.i,el:info.el,r:r.region}:null),ten:r.ten};
  ach('chet1');if(cause==='toahoa')ach('toahoa');if(cause==='quyan')ach('quyan');if(cause==='phithang'){ach('phithang');gainLore('chan_tuong');}
  if(M.nlife>=5)ach('kiep5');
  G.over={life,pts,cause,title:{combat:'Tử trận',toahoa:'Tọa hóa',tamma:'Tẩu hỏa nhập ma',quyan:'Quy ẩn',phithang:'Phi thăng'}[cause]};
  G.run=null;G.screen='over';saveSoon();
}
function retire(){die('quyan');}
function victory(){die('phithang');}

function swapSkill(i){

  if(sc.back==='res'){r.scene=sc.res;return;}
  nextNode();
}
